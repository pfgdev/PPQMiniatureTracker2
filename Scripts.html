<script>
  (function () {
    const desktopMq = window.matchMedia("(min-width: 980px)");
    const reducedMotionMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    const FILTER_OPTIONS = {
      sizes: ["Tiny", "Small", "Medium", "Large", "Huge", "Gargantuan"],
      creatureTypes: [
        "Aberration",
        "Beast",
        "Celestial",
        "Construct",
        "Dragon",
        "Elemental",
        "Fey",
        "Fiend",
        "Giant",
        "Humanoid",
        "Monstrosity",
        "Ooze",
        "Plant",
        "Undead",
        "n/a"
      ],
      roles: ["Melee", "Ranged", "Spellcaster", "Support", "Tank", "Boss", "Minion", "NPC", "Other", "Various", "n/a"],
      sexes: ["Female", "Male", "n/a"],
      races: [
        "Aasimar",
        "Bugbear",
        "Dragonborn",
        "Drow",
        "Dwarf",
        "Elf",
        "Gnoll",
        "Gnome",
        "Goblin",
        "Goliath",
        "Half-Elf",
        "Half-Orc",
        "Halfling",
        "Hobgoblin",
        "Human",
        "Kobold",
        "Lizardfolk",
        "Orc",
        "Tiefling",
        "Tortle",
        "Yuan-ti",
        "other",
        "n/a"
      ]
    };

    const EDIT_FIELDS = ["name", "size", "creatureType", "race", "sex", "role", "set", "setNumber", "home", "paint", "notes"];

    const state = {
      groups: INITIAL_STATE.groups.map((group, index) => enrichGroup({ ...group, originalOrder: index })),
      locations: INITIAL_STATE.locations.slice(),
      sets: Array.from(new Set(INITIAL_STATE.groups.map(group => group.set).filter(Boolean))).sort(compareText),
      browseMode: "groups",
      browseScroll: { groups: null, individuals: null },
      search: "",
      locationFilter: "all",
      locationMenuOpen: false,
      locationMenuSearch: "",
      filtersApplied: createEmptyFilterState(),
      sort: {
        key: "",
        direction: ""
      },
      openFacetKey: "",
      selectedRootId: "",
      selectedCopyId: "",
      draftLocations: {},
      editor: null,
      editorDrafts: Object.create(null),
      detailPointerDownInside: false
    };

    let root;
    let workspaceNode;
    let summaryLaneNode;
    let listHeaderNoteNode;
    let searchInputNode;
    let locationComboboxNode;
    let locationTriggerNode;
    let locationLabelNode;
    let locationClearNode;
    let locationPopoverNode;
    let locationSearchNode;
    let locationOptionsNode;
    let facetShellNode;
    let facetBarNode;
    let facetPopoverNode;
    let facetPopoverTitleNode;
    let facetPopoverClearNode;
    let facetPopoverBodyNode;
    let listStageNode;
    let tableScrollNode;
    let detailPanelNode;
    let detailStageNode;
    let detailHeaderTitleNode;
    let detailHeaderTagsNode;
    let detailCloseButtonNode;
    let detailScrollNode;
    let detailEmptyNode;
    let detailContentNode;
    let facetHideTimer = null;
    let facetSwapTimer = null;
    let detailWidthSyncTimer = null;
    let detailMarqueeSyncTimer = null;
    let copyRevealTimer = null;
    let scrollRestoreVersion = 0;

    initMiniV2();

    function initMiniV2() {
      buildShell();
      bindNodes();
      renderLocationFilter();
      renderAll();
      syncDesktopLayoutMetrics();
      bindEvents();
      window.addEventListener("resize", () => syncDesktopLayoutMetrics());
      new ResizeObserver(() => syncDesktopLayoutMetrics()).observe(workspaceNode);
      reducedMotionMq.addEventListener("change", () => scheduleDetailMarqueeSync(0));
      window.addEventListener("beforeunload", event => {
        if (!editorDraftIds().length && !state.groups.some(group => group.copies.some(isDirty))) return;
        event.preventDefault();
        event.returnValue = "";
      });
    }

    function buildShell() {
      document.getElementById("app").innerHTML = `
        <div id="miniV2Root" class="mini-v2">
          <section class="v2-card mini-v2-top-card">
            <div class="v2-card-header">PPQ Miniature Tracker</div>
            <div class="v2-card-body mini-v2-top-card-body">
              <p class="mini-v2-top-note">Mock data only. Save Changes lasts until reload; your Google Sheet is not changed.</p>
              <div id="miniV2SummaryLane" class="mini-v2-summary-lane"></div>
            </div>
          </section>

          <div class="mini-v2-workspace">
            <section class="v2-card mini-v2-table-card">
              <div id="miniV2ListStage" class="mini-v2-list-stage">
                <div class="v2-card-header mini-v2-list-header">
                  <span>Browse Minis</span>
                  <span id="miniV2ListHeaderNote" class="mini-v2-list-header-note" hidden></span>
                  <div class="mini-v2-view-switch" role="group" aria-label="Browse view">
                    <button type="button" data-browse-mode="groups" aria-pressed="true">Groups</button>
                    <button type="button" data-browse-mode="individuals" aria-pressed="false">Individuals</button>
                  </div>
                </div>
                <div class="v2-card-body mini-v2-table-body">
                  <div class="mini-v2-controls">
                    <div class="mini-v2-search-row">
                      <div class="mini-v2-field">
                        <input id="miniV2SearchInput" type="search" placeholder="Search name, sticker, or details...">
                      </div>
                      <div class="mini-v2-field">
                        <div id="miniV2LocationCombobox" class="mini-v2-combobox">
                          <button
                            id="miniV2LocationTrigger"
                            class="mini-v2-combobox-trigger"
                            type="button"
                            data-action="toggle-location-menu"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-controls="miniV2LocationPopover"
                          >
                            <span id="miniV2LocationLabel" class="mini-v2-combobox-label">All locations</span>
                            <span class="mini-v2-combobox-caret" aria-hidden="true">▾</span>
                          </button>
                          <button
                            id="miniV2LocationClear"
                            class="mini-v2-combobox-clear"
                            type="button"
                            data-action="clear-location"
                            aria-label="Clear location filter"
                            hidden
                          >
                            ×
                          </button>
                          <div id="miniV2LocationPopover" class="mini-v2-combobox-popover" hidden>
                            <div class="mini-v2-combobox-search-wrap">
                              <input id="miniV2LocationSearch" class="mini-v2-combobox-search" type="search" placeholder="Search locations...">
                            </div>
                            <div id="miniV2LocationOptions" class="mini-v2-combobox-options" role="listbox" aria-label="Locations"></div>
                          </div>
                        </div>
                      </div>
                      <button class="button mini-v2-action-btn" type="button" data-action="clear-filters">Clear</button>
                    </div>
                    <div id="miniV2FacetShell" class="mini-v2-facet-shell">
                      <div id="miniV2FacetBar" class="mini-v2-facet-row"></div>
                      <div id="miniV2FacetPopover" class="mini-v2-facet-popover" hidden>
                        <div class="mini-v2-facet-popover-header">
                          <div id="miniV2FacetPopoverTitle" class="mini-v2-facet-popover-title"></div>
                          <button
                            id="miniV2FacetPopoverClear"
                            class="button mini-v2-facet-popover-link"
                            type="button"
                            data-action="clear-open-facet"
                            disabled
                          >
                            Clear
                          </button>
                        </div>
                        <div id="miniV2FacetPopoverBody" class="mini-v2-facet-popover-body"></div>
                      </div>
                    </div>
                  </div>
                  <div id="miniV2TableScroll" class="mini-v2-table-scroll"></div>
                </div>
              </div>
            </section>

            <aside id="miniV2DetailPanel" class="v2-card mini-v2-detail-card">
              <div id="miniV2DetailStage" class="mini-v2-detail-stage">
                <div class="v2-card-header mini-v2-detail-header">
                  <div class="mini-v2-detail-header-main">
                    <span id="miniV2DetailHeaderTitle">Mini Details</span>
                    <input id="miniV2EditName" class="mini-v2-editor-name" data-edit-field="name" aria-label="Miniature name" hidden>
                    <div id="miniV2DetailHeaderTags" class="mini-v2-detail-tag-row"></div>
                  </div>
                  <div class="mini-v2-detail-header-actions">
                    <button class="button mini-v2-detail-close" type="button" data-action="edit-mini" hidden>Edit</button>
                    <button id="miniV2DetailCloseButton" class="button mini-v2-detail-close" type="button" data-action="close-detail">Close</button>
                  </div>
                </div>
                <div class="v2-card-body">
                  <div id="miniV2DetailScroll" class="mini-v2-detail-scroll">
                    <div id="miniV2DetailEmpty" class="mini-v2-detail-empty">Select a miniature to view its details and move individual copies.</div>
                    <div id="miniV2DetailContent" hidden></div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function bindNodes() {
      root = document.getElementById("miniV2Root");
      workspaceNode = root.querySelector(".mini-v2-workspace");
      summaryLaneNode = document.getElementById("miniV2SummaryLane");
      listHeaderNoteNode = document.getElementById("miniV2ListHeaderNote");
      searchInputNode = document.getElementById("miniV2SearchInput");
      locationComboboxNode = document.getElementById("miniV2LocationCombobox");
      locationTriggerNode = document.getElementById("miniV2LocationTrigger");
      locationLabelNode = document.getElementById("miniV2LocationLabel");
      locationClearNode = document.getElementById("miniV2LocationClear");
      locationPopoverNode = document.getElementById("miniV2LocationPopover");
      locationSearchNode = document.getElementById("miniV2LocationSearch");
      locationOptionsNode = document.getElementById("miniV2LocationOptions");
      facetShellNode = document.getElementById("miniV2FacetShell");
      facetBarNode = document.getElementById("miniV2FacetBar");
      facetPopoverNode = document.getElementById("miniV2FacetPopover");
      facetPopoverTitleNode = document.getElementById("miniV2FacetPopoverTitle");
      facetPopoverClearNode = document.getElementById("miniV2FacetPopoverClear");
      facetPopoverBodyNode = document.getElementById("miniV2FacetPopoverBody");
      locationTriggerNode.querySelector(".mini-v2-combobox-caret").textContent = "";
      locationClearNode.textContent = "x";
      listStageNode = document.getElementById("miniV2ListStage");
      tableScrollNode = document.getElementById("miniV2TableScroll");
      detailPanelNode = document.getElementById("miniV2DetailPanel");
      detailStageNode = document.getElementById("miniV2DetailStage");
      detailHeaderTitleNode = document.getElementById("miniV2DetailHeaderTitle");
      detailHeaderTagsNode = document.getElementById("miniV2DetailHeaderTags");
      detailCloseButtonNode = document.getElementById("miniV2DetailCloseButton");
      detailScrollNode = document.getElementById("miniV2DetailScroll");
      detailEmptyNode = document.getElementById("miniV2DetailEmpty");
      detailContentNode = document.getElementById("miniV2DetailContent");
    }

    function bindEvents() {
      root.addEventListener("click", handleRootClick);
      root.addEventListener("input", handleRootInput);
      root.addEventListener("change", handleRootChange);
      root.addEventListener("keydown", handleRootKeydown);
      facetPopoverNode.addEventListener("transitionend", handleFacetPopoverTransitionEnd);
      detailPanelNode.addEventListener("transitionend", handleDetailPanelTransitionEnd);
      document.addEventListener("click", handleDocumentClick);
      document.addEventListener("pointerdown", handleDocumentPointerDown, true);
    }

    function enrichGroup(group) {
      const copies = group.copies.map(copy => ({ ...copy }));
      const available = copies.filter(copy => copy.currentLocation === copy.home).length;
      const total = copies.length;
      const checkedOut = total - available;
      const needsStickers = copies.some(copy => !copy.sticker);
      const sharedSearchText = [
        group.name,
        group.rootId,
        group.home,
        group.size,
        group.creatureType,
        group.sex,
        group.race,
        group.role,
        group.set,
        group.setNumber,
        group.notes
      ].join(" ").toLowerCase();
      const searchText = [sharedSearchText]
        .concat(copies.map(copy => [copy.id, copy.sticker, copy.currentLocation, copy.note || ""].join(" ")))
        .join(" ")
        .toLowerCase();

      return { ...group, copies, available, total, checkedOut, needsStickers, sharedSearchText, searchText };
    }

    function renderAll(options = {}) {
      const resumedEditor = !state.editor && state.editorDrafts[state.selectedRootId];
      if (resumedEditor) {
        state.editor = resumedEditor;
        delete state.editorDrafts[state.selectedRootId];
        if (!state.selectedCopyId) state.selectedCopyId = state.editor.selectedCopyId || "";
      }
      const rows = getBrowseRows();
      if (!options.keepSelection) ensureSelectionVisibility(rows);
      const selectedGroup = getSelectedGroup();
      root.classList.toggle("mini-v2-has-detail", !!selectedGroup);
      renderSummaryLane(rows.length);
      renderListHeader(rows.length);
      renderLocationFilter();
      renderFacetBar();
      renderFacetFlyout();
      renderTable(rows);
      if (!options.keepDetail) renderDetail();
      syncDetailCopyTarget();
      return !!resumedEditor;
    }

    function renderAllPreservingScroll(existingState, options = {}) {
      const scrollState = existingState || captureScrollState();
      const restoreFocus = captureFocus();
      const resumedEditor = renderAll(options);
      if (resumedEditor && state.editor.editScroll) {
        scrollState.detailTop = state.editor.editScroll.detailTop;
        scrollState.detailTableLeft = state.editor.editScroll.detailTableLeft;
      }
      restoreFocus();
      restoreScrollState(scrollState);
      return scrollState;
    }

    function captureFocus() {
      const active = document.activeElement;
      if (!active || !root.contains(active)) return () => {};
      const identity = Array.from(active.attributes).filter(attribute =>
        attribute.name === "id" || attribute.name.startsWith("data-")
      );
      return () => {
        if (active.isConnected && !active.disabled && active.getClientRects().length) return;
        const replacement = identity.length && Array.from(root.querySelectorAll(active.tagName))
          .find(node => identity.every(attribute => node.getAttribute(attribute.name) === attribute.value));
        if (replacement && !replacement.disabled && replacement.getClientRects().length) {
          replacement.focus({ preventScroll: true });
        } else {
          (getSelectedGroup() ? detailCloseButtonNode : searchInputNode).focus({ preventScroll: true });
        }
      };
    }

    function renderSummaryLane(visibleCount) {
      const stickerWork = state.groups.filter(group => group.needsStickers).length;
      const dirtyCount = state.groups.reduce((count, group) => count + group.copies.filter(isDirty).length, 0);
      const draftCount = editorDraftIds().length;

      summaryLaneNode.innerHTML = `
        <span class="mini-v2-chip is-primary">Mock Data</span>
        <span class="mini-v2-chip">Groups ${state.groups.length}</span>
        <span class="mini-v2-chip mini-v2-visible-count">Visible ${visibleCount} ${getBrowseUnit(visibleCount)}</span>
        <span class="mini-v2-chip ${stickerWork ? "is-warn" : ""}" title="${stickerWork} groups with copies needing stickers">Sticker Work ${stickerWork}</span>
        ${dirtyCount ? `<button type="button" class="mini-v2-chip is-warn" data-action="review-changes" title="Open a miniature with pending location changes">Unsaved ${dirtyCount}</button>` : ""}
        ${draftCount ? `<button type="button" class="mini-v2-chip is-warn" data-action="review-editor-drafts" title="Resume unapplied editor drafts. Drafts last until reload; only Save applies them.">Drafts ${draftCount}</button>` : ""}
      `;
    }

    function getBrowseUnit(count) {
      const unit = state.browseMode === "individuals" ? "individual" : "group";
      return `${unit}${count === 1 ? "" : "s"}`;
    }

    function renderListHeader(visibleCount) {
      listHeaderNoteNode.textContent = `${visibleCount} ${getBrowseUnit(visibleCount)} shown`;
      root.querySelectorAll("button[data-browse-mode]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.browseMode === state.browseMode));
      });
    }

    function renderLocationFilter() {
      searchInputNode.value = state.search;
      locationComboboxNode.classList.toggle("is-open", state.locationMenuOpen);
      locationLabelNode.textContent = state.locationFilter === "all" ? "All locations" : state.locationFilter;
      const locationMeaning = state.browseMode === "individuals" ? "Current location" : "Home or current location";
      locationTriggerNode.setAttribute("aria-label", `${locationMeaning}: ${locationLabelNode.textContent}`);
      locationTriggerNode.title = `Filter by ${locationMeaning.toLowerCase()} (last saved locations)`;
      locationTriggerNode.setAttribute("aria-expanded", state.locationMenuOpen ? "true" : "false");
      locationTriggerNode.classList.toggle("is-active", state.locationFilter !== "all");
      locationTriggerNode.classList.toggle("is-open", state.locationMenuOpen);
      locationClearNode.hidden = true;
      locationPopoverNode.hidden = !state.locationMenuOpen;
      locationSearchNode.value = state.locationMenuSearch;

      const query = state.locationMenuSearch.trim().toLowerCase();
      const matchingLocations = state.locations.filter(location => location.toLowerCase().includes(query));
      const options = [
        {
          value: "all",
          label: "All locations"
        }
      ].concat(matchingLocations.map(location => ({
        value: location,
        label: location
      })));

      if (!options.length) {
        locationOptionsNode.innerHTML = `<div class="mini-v2-combobox-empty">No locations found.</div>`;
        return;
      }

      locationOptionsNode.innerHTML = options.map(option => `
        <button
          class="mini-v2-combobox-option ${state.locationFilter === option.value ? "is-selected" : ""}"
          type="button"
          role="option"
          aria-selected="${state.locationFilter === option.value ? "true" : "false"}"
          data-action="set-location-filter"
          data-location-value="${escapeHtml(option.value)}"
        >
          <span class="mini-v2-combobox-option-label">${escapeHtml(option.label)}</span>
          ${state.locationFilter === option.value ? '<span class="mini-v2-combobox-option-check" aria-hidden="true">✓</span>' : ""}
        </button>
      `).join("");
    }

    function renderFacetBar() {
      const facetConfigs = getFacetConfigs();
      facetBarNode.innerHTML = facetConfigs.map(config => renderFacetButton(config)).join("");
    }

    function renderFacetButton(config) {
      const count = getFacetCount(config.key);
      const isActive = count > 0;
      const isOpen = state.openFacetKey === config.key;

      return `
        <button
          class="mini-v2-facet-btn ${isActive ? "is-active" : ""} ${isOpen ? "is-open" : ""}"
          type="button"
          data-action="toggle-facet"
          data-facet-key="${escapeHtml(config.key)}"
          aria-pressed="${isActive ? "true" : "false"}"
          aria-expanded="${isOpen ? "true" : "false"}"
        >
          <span class="mini-v2-facet-label">${escapeHtml(config.label)}</span>
          ${count > 1 ? `<span class="mini-v2-facet-count">${count}</span>` : ""}
        </button>
      `;
    }

    function getFacetCount(facetKey) {
      if (facetKey === "more") {
        return state.filtersApplied.roles.length
          + (state.filtersApplied.paintedOnly ? 1 : 0)
          + (state.filtersApplied.needsStickersOnly ? 1 : 0);
      }

      const values = state.filtersApplied[facetKey];
      return Array.isArray(values) ? values.length : 0;
    }

    function clearOpenFacetSelections() {
      if (state.openFacetKey === "more") {
        state.filtersApplied.roles = [];
        state.filtersApplied.paintedOnly = false;
        state.filtersApplied.needsStickersOnly = false;
        return;
      }

      if (!state.openFacetKey) return;
      if (Array.isArray(state.filtersApplied[state.openFacetKey])) {
        state.filtersApplied[state.openFacetKey] = [];
      }
    }

    function toggleAppliedFacetValue(kind, value) {
      if (!kind || !value || !Array.isArray(state.filtersApplied[kind])) return;
      const nextValues = state.filtersApplied[kind].slice();
      const existingIndex = nextValues.indexOf(value);
      if (existingIndex >= 0) {
        nextValues.splice(existingIndex, 1);
      } else {
        nextValues.push(value);
      }
      state.filtersApplied[kind] = nextValues;
    }

    function toggleAppliedFacetFlag(flagKey) {
      if (!(flagKey in state.filtersApplied)) return;
      state.filtersApplied[flagKey] = !state.filtersApplied[flagKey];
    }

    function renderFacetFlyout() {
      if (!facetPopoverNode) return;

      const activeConfig = getFacetConfigs().find(config => config.key === state.openFacetKey) || null;
      facetShellNode.classList.toggle("has-open-facet", !!activeConfig);

      if (activeConfig) {
        const wasHidden = facetPopoverNode.hidden;
        const previousFacetKey = facetPopoverNode.getAttribute("data-facet-key") || "";
        const startHeight = !wasHidden ? facetPopoverNode.getBoundingClientRect().height : 0;
        const activeCount = getFacetCount(activeConfig.key);
        facetPopoverTitleNode.textContent = activeConfig.label;
        facetPopoverClearNode.disabled = !activeCount;
        facetPopoverBodyNode.innerHTML = renderFacetFlyoutBody(activeConfig);
        facetPopoverNode.setAttribute("data-facet-key", activeConfig.key);
        if (previousFacetKey !== activeConfig.key) {
          facetPopoverBodyNode.scrollTop = 0;
        }

        if (facetHideTimer) {
          clearTimeout(facetHideTimer);
          facetHideTimer = null;
        }

        if (wasHidden) {
          facetPopoverNode.style.height = "";
          facetPopoverNode.hidden = false;
          requestAnimationFrame(() => {
            facetPopoverNode.classList.add("is-visible");
          });
        } else {
          facetPopoverNode.classList.add("is-visible");
          animateFacetPopoverHeight(startHeight);
          if (previousFacetKey && previousFacetKey !== activeConfig.key) {
            animateFacetPopoverSwap();
          }
        }
        return;
      }

      facetPopoverNode.classList.remove("is-visible");
      facetPopoverNode.style.height = "";
      if (facetHideTimer) {
        clearTimeout(facetHideTimer);
      }
      facetHideTimer = setTimeout(() => {
        if (!state.openFacetKey) {
          facetPopoverNode.hidden = true;
          facetPopoverNode.removeAttribute("data-facet-key");
        }
        facetHideTimer = null;
      }, 180);
    }

    function animateFacetPopoverHeight(startHeight) {
      if (!facetPopoverNode || !startHeight) return;

      facetPopoverNode.style.height = "auto";
      const endHeight = facetPopoverNode.getBoundingClientRect().height;

      if (!endHeight || Math.abs(endHeight - startHeight) < 2) {
        facetPopoverNode.style.height = "";
        return;
      }

      facetPopoverNode.style.height = `${Math.round(startHeight)}px`;
      facetPopoverNode.getBoundingClientRect();
      requestAnimationFrame(() => {
        facetPopoverNode.style.height = `${Math.round(endHeight)}px`;
      });
    }

    function animateFacetPopoverSwap() {
      if (!facetPopoverBodyNode) return;

      facetPopoverBodyNode.classList.remove("is-swapping");
      facetPopoverBodyNode.getBoundingClientRect();
      facetPopoverBodyNode.classList.add("is-swapping");

      if (facetSwapTimer) {
        clearTimeout(facetSwapTimer);
      }
      facetSwapTimer = setTimeout(() => {
        facetPopoverBodyNode.classList.remove("is-swapping");
        facetSwapTimer = null;
      }, 170);
    }

    function renderFacetFlyoutBody(config) {
      if (config.key === "sizes") {
        return renderFacetTileGrid("sizes", FILTER_OPTIONS.sizes, state.filtersApplied.sizes, "is-three-col");
      }

      if (config.key === "creatureTypes") {
        return renderFacetTileGrid("creatureTypes", FILTER_OPTIONS.creatureTypes, state.filtersApplied.creatureTypes, "is-three-col");
      }

      if (config.key === "races") {
        return renderFacetTileGrid("races", FILTER_OPTIONS.races, state.filtersApplied.races, "is-three-col");
      }

      if (config.key === "sexes") {
        return renderFacetTileGrid("sexes", FILTER_OPTIONS.sexes, state.filtersApplied.sexes, "is-three-col");
      }

      if (config.key === "more") {
        return `
          <div class="mini-v2-facet-more">
            ${renderFacetGroup("Role", renderFacetTileGrid("roles", FILTER_OPTIONS.roles, state.filtersApplied.roles, "is-three-col"))}
            ${renderFacetGroup("Collection", `
              <div class="mini-v2-facet-tile-grid is-two-col">
                ${renderFacetFlagTile("paintedOnly", "Painted only", state.filtersApplied.paintedOnly)}
                ${renderFacetFlagTile("needsStickersOnly", "Needs stickers only", state.filtersApplied.needsStickersOnly)}
              </div>
            `)}
          </div>
        `;
      }

      return "";
    }

    function getFacetConfigs() {
      return [
        { key: "sizes", label: "Size" },
        { key: "creatureTypes", label: "Type" },
        { key: "races", label: "Race" },
        { key: "sexes", label: "Sex" },
        { key: "more", label: "More" }
      ];
    }

    function renderFacetGroup(label, bodyMarkup) {
      return `
        <section class="mini-v2-facet-group">
          <div class="mini-v2-facet-group-label">${escapeHtml(label)}</div>
          ${bodyMarkup}
        </section>
      `;
    }

    function renderFacetTileGrid(kind, options, selectedValues, layoutClass) {
      return `
        <div class="mini-v2-facet-tile-grid ${layoutClass}">
          ${options.map(option => renderFacetTile(kind, option, selectedValues.includes(option))).join("")}
        </div>
      `;
    }

    function renderFacetTile(kind, value, isSelected) {
      return `
        <button
          class="mini-v2-facet-tile ${isSelected ? "is-selected" : ""}"
          type="button"
          data-action="toggle-facet-value"
          data-facet-kind="${escapeHtml(kind)}"
          data-facet-value="${escapeHtml(value)}"
          aria-pressed="${isSelected ? "true" : "false"}"
        >
          <span class="mini-v2-facet-tile-check" aria-hidden="true">${isSelected ? "x" : ""}</span>
          <span class="mini-v2-facet-tile-label">${escapeHtml(value)}</span>
        </button>
      `;
    }

    function renderFacetFlagTile(flagKey, label, enabled) {
      return `
        <button
          class="mini-v2-facet-tile ${enabled ? "is-selected" : ""}"
          type="button"
          data-action="toggle-facet-flag"
          data-facet-flag="${escapeHtml(flagKey)}"
          aria-pressed="${enabled ? "true" : "false"}"
        >
          <span class="mini-v2-facet-tile-check" aria-hidden="true">${enabled ? "x" : ""}</span>
          <span class="mini-v2-facet-tile-label">${escapeHtml(label)}</span>
        </button>
      `;
    }

    function renderTable(browseRows) {
      const individuals = state.browseMode === "individuals";

      if (!browseRows.length) {
        tableScrollNode.innerHTML = `
          <div class="mini-v2-list-wrap">
            <div class="mini-v2-empty">No ${getBrowseUnit(0)} match those filters.</div>
          </div>
        `;
        return;
      }

      const rows = browseRows.map(({ group, copy }) => {
        const status = getStatusKey(group);
        const selected = group.rootId === state.selectedRootId && (!copy || copy.id === state.selectedCopyId);
        const dirty = copy && isDirty(copy);
        const copyLabel = copy ? `${copy.sticker || `No sticker, copy ${copy.miniNumber}`}, ${group.name}` : "";
        return `
          <tr class="mini-v2-row ${selected ? "is-selected" : ""} ${dirty ? "has-pending-copy" : ""}" data-group-id="${escapeHtml(group.rootId)}"${copy ? ` data-copy-id="${escapeHtml(copy.id)}" aria-label="${escapeHtml(copyLabel)}${dirty ? ", unsaved location change" : ""}"` : ""}${selected ? ' aria-current="true"' : ""} tabindex="0">
            <td class="mini-v2-cell mini-v2-cell-avail${!copy && group.total >= 100 ? " has-wide-count" : ""}">
              ${copy
                ? `<span class="mini-v2-individual-id" title="${escapeHtml(copyLabel)}${dirty ? "; unsaved location change" : ""}">${escapeHtml(copy.sticker || "No ID")}</span>`
                : `<span class="mini-v2-count mini-v2-count--browse ${statusClass(status)}" title="${group.available} of ${group.total} available">${group.available}/${group.total}</span>`}
            </td>
            <td class="mini-v2-cell mini-v2-cell-name"><div class="mini-v2-name" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</div></td>
            <td class="mini-v2-cell mini-v2-cell-home">${copy ? renderBrowseCopyLocation(copy) : `<span title="${escapeHtml(group.home)}">${escapeHtml(group.home)}</span>`}</td>
            <td class="mini-v2-cell mini-v2-cell-size" title="${escapeHtml(group.size)}">${escapeHtml(group.size)}</td>
            <td class="mini-v2-cell mini-v2-cell-type" title="${escapeHtml(group.creatureType)}">${escapeHtml(group.creatureType)}</td>
            <td class="mini-v2-cell mini-v2-cell-race" title="${escapeHtml(group.race || "n/a")}">${escapeHtml(group.race || "n/a")}</td>
            <td class="mini-v2-cell mini-v2-cell-sex" title="${escapeHtml(group.sex || "n/a")}">${escapeHtml(group.sex || "n/a")}</td>
            <td class="mini-v2-cell mini-v2-cell-role" title="${escapeHtml(group.role || "n/a")}">${escapeHtml(group.role || "n/a")}</td>
          </tr>
        `;
      }).join("");

      tableScrollNode.innerHTML = `
        <div class="mini-v2-list-wrap">
          <table class="mini-v2-table mini-v2-browse-table${individuals ? " is-individuals" : ""}" aria-label="${individuals ? "Individual miniatures" : "Miniature groups"}">
            <thead>
              <tr>
                ${renderSortHeader("mini-v2-cell-avail", individuals ? "sticker" : "avail", individuals ? "ID" : "#", individuals ? "Sticker ID" : "Available")}
                ${renderSortHeader("mini-v2-cell-name", "name", "Name")}
                ${renderSortHeader("mini-v2-cell-home", individuals ? "currentLocation" : "home", individuals ? "Current Location" : "Home")}
                ${renderSortHeader("mini-v2-cell-size", "size", "Size")}
                ${renderSortHeader("mini-v2-cell-type", "type", "Type")}
                ${renderSortHeader("mini-v2-cell-race", "race", "Race")}
                ${renderSortHeader("mini-v2-cell-sex", "sex", "Sex")}
                ${renderSortHeader("mini-v2-cell-role", "role", "Role")}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderBrowseCopyLocation(copy) {
      const away = copy.currentLocation !== copy.home;
      const label = away ? "Away" : "Home";
      const title = `${copy.currentLocation} (${label}); home: ${copy.home}${isDirty(copy) ? `; pending move to ${getEffectiveLocation(copy)} (not saved)` : ""}`;
      return `
        <div class="mini-v2-individual-location" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}">
          <span class="mini-v2-individual-location-label">${escapeHtml(copy.currentLocation)}</span>
          <span class="mini-v2-copy-status ${away ? "is-away" : "is-home"}">${label}</span>
        </div>
      `;
    }

    function renderDetail() {
      const group = getSelectedGroup();
      const editing = !!state.editor;
      const editButton = root.querySelector('.mini-v2-detail-header-actions button:first-child');
      editButton.hidden = !group;
      editButton.textContent = editing ? "Discard" : "Edit";
      editButton.dataset.action = editing ? "discard-edit" : "edit-mini";
      editButton.title = editing ? "Discard this editor draft and return to details" : "Edit this miniature";
      detailCloseButtonNode.textContent = "Close";
      detailCloseButtonNode.dataset.action = "close-detail";
      detailCloseButtonNode.title = editing ? "Close and keep your draft until reload" : "Close details";
      detailPanelNode.classList.toggle("is-editing", editing);
      detailHeaderTitleNode.hidden = editing;
      const nameInput = document.getElementById("miniV2EditName");
      nameInput.hidden = !editing;

      if (group && editing) {
        detailEmptyNode.hidden = true;
        detailContentNode.hidden = false;
        detailCloseButtonNode.disabled = false;
        // Preserve live controls and caret positions across browse/filter rerenders.
        if (detailContentNode.querySelector(".mini-v2-editor")?.dataset.editorRoot !== group.rootId) {
          nameInput.removeAttribute("aria-invalid");
          nameInput.removeAttribute("aria-describedby");
          nameInput.value = state.editor.fields.name;
          renderEditor(group);
        }
        syncEditorFeedback();
        return;
      }

      if (!group) {
        detailHeaderTitleNode.textContent = "Mini Details";
        detailHeaderTagsNode.innerHTML = "";
        detailEmptyNode.hidden = false;
        detailContentNode.hidden = true;
        detailCloseButtonNode.disabled = true;
        return;
      }

      const dirtyCount = group.copies.filter(isDirty).length;
      const missingFieldLabels = getMissingFieldLabels(group);
      const missingFieldCount = missingFieldLabels.length;
      const canSetAllHome = group.copies.some(copy => getEffectiveLocation(copy) !== copy.home);
      const collectionSummary = getCollectionSummary(group);
      detailHeaderTitleNode.textContent = group.name;
      detailHeaderTagsNode.innerHTML = [
        missingFieldCount
          ? renderDetailTag(
            `${missingFieldCount} missing field${missingFieldCount === 1 ? "" : "s"}`,
            "is-warn",
            `Missing: ${missingFieldLabels.join(", ")}`
          )
          : renderDetailTag("Ready", "is-success"),
        dirtyCount ? renderDetailTag(`Unsaved ${dirtyCount}`, "is-warn") : ""
      ].join("");
      detailCloseButtonNode.disabled = false;
      detailEmptyNode.hidden = true;
      detailContentNode.hidden = false;

      detailContentNode.innerHTML = `
        <div class="mini-v2-detail-panel">
          <section class="mini-v2-detail-group">
            <div class="mini-v2-detail-group-title">Details</div>
            <div class="mini-v2-detail-grid">
              ${renderReadCard("Size", group.size)}
              ${renderReadCard("Creature Type", group.creatureType)}
              ${renderReadCard("Race", group.race || "n/a")}
              ${renderReadCard("Sex", group.sex)}
              ${renderReadCard("Role", group.role || "n/a")}
            </div>
          </section>

          <section class="mini-v2-detail-group">
            <div class="mini-v2-detail-group-title">Miniature</div>
            <div class="mini-v2-product-grid">
              ${renderReadCard("Set", collectionSummary, { marquee: true, wide: true })}
              ${renderReadCard("Paint", typeof group.paint === "boolean" ? (group.paint ? "Painted" : "Unpainted") : "Not specified")}
            </div>
          </section>

          <section class="mini-v2-detail-group mini-v2-inventory-block">
            <div class="mini-v2-detail-group-title">Inventory</div>
            ${renderCopyGrid(group)}
            <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
              <button class="button mini-v2-copy-btn" type="button" data-action="reset-changes" title="Discard pending location changes for this entire group"${dirtyCount ? "" : " disabled"}>Reset</button>
              <button class="button mini-v2-copy-btn mini-v2-secondary" type="button" data-action="set-all-home" title="Stage all ${group.total} copies in this group home, including copies outside the browse filter"${canSetAllHome ? "" : " disabled"}>Set All Home</button>
              <button class="button mini-v2-copy-btn mini-v2-primary" type="button" data-action="save-changes" title="Apply all pending location changes for this group in mock memory only"${dirtyCount ? "" : " disabled"}>Save Changes</button>
            </div>
          </section>

          <section class="mini-v2-detail-group">
            <div class="mini-v2-note-card">
              <div class="mini-v2-note-label">Notes</div>
              <div class="mini-v2-note-body" title="${escapeHtml(group.notes || "No notes yet.")}">${escapeHtml(group.notes || "No notes yet.")}</div>
            </div>
          </section>
        </div>
      `;

      scheduleDetailMarqueeSync(260);
    }

    function editorSnapshot(editor = state.editor) {
      return editor ? JSON.stringify({ fields: editor.fields, copies: editor.copies }) : "";
    }

    function editorHasChanges() {
      return !!state.editor && editorSnapshot() !== state.editor.initial;
    }

    function editorDraftIds() {
      return Array.from(new Set([...Object.keys(state.editorDrafts), ...(editorHasChanges() ? [state.editor.rootId] : [])]));
    }

    function beginEditor() {
      const group = getSelectedGroup();
      if (!group || state.editor) return;
      clearTimeout(copyRevealTimer);
      clearTimeout(detailMarqueeSyncTimer);
      detailPanelNode.style.setProperty("--mini-v2-editor-header-height", `${detailPanelNode.querySelector(".mini-v2-detail-header").getBoundingClientRect().height}px`);
      document.getElementById("miniV2EditName").removeAttribute("aria-invalid");
      document.getElementById("miniV2EditName").removeAttribute("aria-describedby");
      state.editor = {
        rootId: group.rootId,
        fields: Object.fromEntries(EDIT_FIELDS.map(key => [key, key === "paint"
          ? (typeof group.paint === "boolean" ? String(group.paint) : "") : String(group[key] ?? "")])),
        copies: Object.fromEntries(group.copies.map(copy => [copy.id, {
          note: copy.note || "", currentLocation: getEffectiveLocation(copy)
        }])),
        hasPendingLocations: group.copies.some(isDirty),
        readScroll: captureScrollState()
      };
      state.editor.initial = editorSnapshot();
      const scroll = captureScrollState();
      scroll.detailTop = 0;
      renderAllPreservingScroll(scroll, { keepSelection: true });
      document.getElementById("miniV2EditName").focus({ preventScroll: true });
    }

    function leaveEditor() {
      if (!state.editor) return true;
      if (editorHasChanges()) {
        state.editor.editScroll = captureScrollState();
        state.editor.selectedCopyId = state.selectedCopyId;
        state.editorDrafts[state.editor.rootId] = state.editor;
      } else {
        delete state.editorDrafts[state.editor.rootId];
      }
      state.editor = null;
      return true;
    }

    function discardEditor() {
      const scroll = state.editor?.readScroll;
      if (!state.editor) return;
      delete state.editorDrafts[state.editor.rootId];
      state.editor = null;
      const currentScroll = captureScrollState();
      if (scroll) {
        currentScroll.detailTop = scroll.detailTop;
        currentScroll.detailTableLeft = scroll.detailTableLeft;
      }
      renderAllPreservingScroll(currentScroll, { keepSelection: true });
      root.querySelector('[data-action="edit-mini"]').focus({ preventScroll: true });
    }

    function renderEditSelect(key, label, options) {
      return `<label class="mini-v2-edit-field">
        <span class="mini-v2-field-label">${escapeHtml(label)}</span>
        <select data-edit-field="${key}" aria-label="${escapeHtml(label)}">${renderEditOptions(key, options)}</select>
      </label>`;
    }

    function renderEditOptions(key, options) {
      const value = state.editor.fields[key];
      const choices = Array.from(new Set([...(key === "home" && value ? [] : [""]), ...options, value]));
      return choices.map(option =>
        `<option value="${escapeHtml(option)}"${option === value ? " selected" : ""}>${escapeHtml(option || "Not specified")}</option>`).join("");
    }

    function renderEditor(group) {
      const fields = state.editor.fields;
      detailContentNode.innerHTML = `<div class="mini-v2-detail-panel mini-v2-editor" data-editor-root="${escapeHtml(group.rootId)}">
        <section class="mini-v2-detail-group">
          <div class="mini-v2-editor-section-heading">
            <div class="mini-v2-detail-group-title">Details</div>
            <span class="mini-v2-editor-scope">Shared by all ${group.total} ${group.total === 1 ? "copy" : "copies"}</span></div>
          <div class="mini-v2-detail-grid">
            ${renderEditSelect("size", "Size", FILTER_OPTIONS.sizes)}
            ${renderEditSelect("creatureType", "Creature Type", FILTER_OPTIONS.creatureTypes)}
            ${renderEditSelect("race", "Race", FILTER_OPTIONS.races)}
            ${renderEditSelect("sex", "Sex", FILTER_OPTIONS.sexes)}
            ${renderEditSelect("role", "Role", FILTER_OPTIONS.roles)}
          </div>
        </section>
        <section class="mini-v2-detail-group">
          <div class="mini-v2-detail-group-title">Miniature</div>
          <div class="mini-v2-product-grid">
            <div class="mini-v2-edit-field mini-v2-set-field">
              <div class="mini-v2-editor-set-labels"><label class="mini-v2-field-label" for="miniV2EditSet">Set</label><label class="mini-v2-field-label" for="miniV2EditSetNumber">#</label></div>
              <div class="mini-v2-editor-set"><select id="miniV2EditSet" data-edit-field="set" title="Set name">${renderEditOptions("set", state.sets)}</select>
                <input id="miniV2EditSetNumber" data-edit-field="setNumber" aria-label="Set number" inputmode="numeric" maxlength="3" value="${escapeHtml(fields.setNumber)}"></div>
            </div>
            <div class="mini-v2-edit-field">
              <span class="mini-v2-field-label">Paint</span>
              <label class="mini-v2-editor-paint"><input type="checkbox" data-edit-field="paint" aria-label="Painted"${fields.paint === "true" ? " checked" : ""}>
                <span class="mini-v2-editor-paint-value">Painted</span></label>
            </div>
          </div>
        </section>
        <section class="mini-v2-detail-group mini-v2-inventory-block">
          <div class="mini-v2-detail-group-title">Inventory</div>
          ${renderCopyGrid(group)}
          <p class="mini-v2-editor-home-note" hidden>Changing Home does not move copies. Current locations stay as shown.</p>
          <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
            <button class="button mini-v2-copy-btn mini-v2-secondary" type="button" data-action="edit-all-home">Set All Home</button>
          </div>
        </section>
        <section class="mini-v2-detail-group">
          <label class="mini-v2-edit-field"><span class="mini-v2-note-label">Notes</span>
            <textarea data-edit-field="notes" aria-label="Group notes" rows="3">${escapeHtml(fields.notes)}</textarea></label>
        </section>
        <div class="mini-v2-editor-footer">
          <p id="miniV2EditorError" class="mini-v2-editor-error" role="alert" hidden></p>
          <div class="mini-v2-editor-save-row"><span class="mini-v2-editor-save-note">Applies details, copy notes &amp; locations</span>
            <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
              <button class="button mini-v2-copy-btn mini-v2-primary" type="button" data-action="save-edit" title="Apply all shown details, copy notes, and locations for this group, including earlier pending locations, in mock memory only">Save Changes</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function editorCopy(copy) {
      const draft = state.editor.copies[copy.id];
      const group = getSelectedGroup();
      return { ...copy, ...draft, home: state.editor.fields.home !== group.home ? state.editor.fields.home : copy.home };
    }

    function syncEditorFeedback() {
      if (!state.editor) return;
      const changed = editorHasChanges();
      const paint = detailContentNode.querySelector('[data-edit-field="paint"]');
      paint.checked = state.editor.fields.paint === "true";
      paint.indeterminate = state.editor.fields.paint === "";
      paint.setAttribute("aria-checked", paint.indeterminate ? "mixed" : String(paint.checked));
      paint.title = paint.indeterminate ? "Paint status is not specified; check to mark painted" : "Paint status for all copies in this group";
      detailContentNode.querySelector('.mini-v2-editor-paint-value').textContent = paint.indeterminate
        ? "Not specified" : "Painted";
      detailContentNode.querySelector('[data-edit-field="set"]').title = state.editor.fields.set || "Set not specified";
      detailHeaderTagsNode.innerHTML = renderDetailTag(changed || state.editor.hasPendingLocations ? "Editing *" : "Editing", "is-neutral");
      const save = detailContentNode.querySelector('[data-action="save-edit"]');
      if (save) save.disabled = !changed && !state.editor.hasPendingLocations;
      renderSummaryLane(getBrowseRows().length);
      const group = getSelectedGroup();
      detailContentNode.querySelector('.mini-v2-availability-wrap').outerHTML = renderInventoryAvailability(group);
      const homeNote = detailContentNode.querySelector(".mini-v2-editor-home-note");
      if (homeNote) homeNote.hidden = state.editor.fields.home === group.home;
      const allHome = detailContentNode.querySelector('[data-action="edit-all-home"]');
      if (allHome) allHome.disabled = !state.editor.fields.home || !group.copies.some(copy => {
        const draft = editorCopy(copy);
        return draft.currentLocation !== draft.home;
      });
      detailContentNode.querySelectorAll("[data-detail-copy-id]").forEach(row => {
        const copy = group.copies.find(copy => copy.id === row.dataset.detailCopyId);
        const draft = editorCopy(copy);
        const away = draft.currentLocation !== draft.home;
        const dirty = draft.currentLocation !== copy.currentLocation || draft.note !== (copy.note || "");
        row.classList.toggle("is-away", away);
        row.classList.toggle("is-dirty", dirty);
        const badge = row.querySelector(".mini-v2-copy-status");
        badge.className = `mini-v2-copy-status ${dirty ? "is-dirty" : away ? "is-away" : "is-home"}`;
        badge.textContent = dirty ? "Unsaved" : away ? "Away" : "Home";
      });
    }

    function updateEditorInput(target) {
      if (!state.editor) return false;
      const field = target.dataset.editField;
      const copyId = target.dataset.editCopyNote;
      if (field && EDIT_FIELDS.includes(field)) {
        state.editor.fields[field] = field === "paint" && target.type === "checkbox" ? String(target.checked) : target.value;
        if (field === "home") {
          getSelectedGroup().copies.forEach(copy => {
            const draft = editorCopy(copy);
            const select = Array.from(detailContentNode.querySelectorAll("select[data-copy-id]"))
              .find(node => node.dataset.copyId === copy.id);
            select.innerHTML = renderCopyLocationOptions(draft, draft.currentLocation);
          });
        }
        if (field === "name" || field === "setNumber") {
          target.removeAttribute("aria-invalid");
          target.removeAttribute("aria-describedby");
          const error = document.getElementById("miniV2EditorError");
          if (error) error.hidden = true;
        }
      } else if (copyId && state.editor.copies[copyId]) {
        state.editor.copies[copyId].note = target.value;
      } else return false;
      syncEditorFeedback();
      return true;
    }

    function saveEditor() {
      const editor = state.editor;
      if (!editor) return;
      if (!editor.fields.name.trim()) {
        const error = document.getElementById("miniV2EditorError");
        error.hidden = false;
        error.textContent = "Enter a miniature name before saving.";
        const name = document.getElementById("miniV2EditName");
        name.setAttribute("aria-invalid", "true");
        name.setAttribute("aria-describedby", "miniV2EditorError");
        name.focus({ preventScroll: true });
        return;
      }
      const setNumber = editor.fields.setNumber.trim();
      if (setNumber !== JSON.parse(editor.initial).fields.setNumber && !/^\d{0,3}$/.test(setNumber)) {
        const error = document.getElementById("miniV2EditorError");
        error.hidden = false;
        error.textContent = "Use up to three digits for Set #.";
        const number = document.getElementById("miniV2EditSetNumber");
        number.setAttribute("aria-invalid", "true");
        number.setAttribute("aria-describedby", "miniV2EditorError");
        number.focus({ preventScroll: true });
        return;
      }
      const group = getSelectedGroup();
      const fields = { ...editor.fields, name: editor.fields.name.trim(), setNumber,
        paint: editor.fields.paint === "" ? null : editor.fields.paint === "true" };
      const updated = enrichGroup({ ...group, ...fields, copies: group.copies.map(editorCopy) });
      state.groups = state.groups.map(item => item.rootId === group.rootId ? updated : item);
      group.copies.forEach(copy => { delete state.draftLocations[copy.id]; });
      delete state.editorDrafts[group.rootId];
      state.editor = null;
      state.browseScroll = { groups: null, individuals: null };
      const scroll = captureScrollState();
      scroll.detailTop = editor.readScroll.detailTop;
      scroll.detailTableLeft = editor.readScroll.detailTableLeft;
      renderAllPreservingScroll(scroll, { keepSelection: true });
      root.querySelector('[data-action="edit-mini"]').focus({ preventScroll: true });
    }

    function renderStatusBadge(group) {
      const status = getStatusKey(group);
      return `<span class="mini-v2-badge ${statusClass(status)}">${escapeHtml(getStatusLabel(group))}</span>`;
    }

    function renderDetailTag(label, className, titleText) {
      return `<span class="mini-v2-detail-tag ${className || ""}"${titleText ? ` title="${escapeHtml(titleText)}"` : ""}>${escapeHtml(label)}</span>`;
    }

    function renderStatCard(label, valueMarkup) {
      return `
        <div class="mini-v2-stat-card">
          <div class="mini-v2-stat-label">${escapeHtml(label)}</div>
          <div class="mini-v2-stat-value">${valueMarkup}</div>
        </div>
      `;
    }

    function renderReadCard(label, value, options) {
      const config = options || {};
      return `
        <div class="mini-v2-read-card${config.wide ? " mini-v2-set-field" : ""}">
          <div class="mini-v2-field-label">${escapeHtml(label)}</div>
          ${renderReadValue(value, config)}
        </div>
      `;
    }

    function renderInventoryAvailability(group) {
      let available = 0;
      let pending = false;
      group.copies.forEach(copy => {
        const displayed = state.editor ? editorCopy(copy) : { ...copy, currentLocation: getEffectiveLocation(copy) };
        if (displayed.currentLocation === displayed.home) available++;
        if (displayed.currentLocation !== copy.currentLocation || displayed.home !== copy.home) pending = true;
      });
      const tone = statusClass(getStatusKey({ available, total: group.total }));
      const explanation = pending ? "Includes unsaved Home or location changes." : "Copies at their home location.";
      return `<span class="mini-v2-availability-wrap" title="${explanation}">
        <span class="mini-v2-badge mini-v2-inventory-availability ${tone}"
          aria-label="${available} of ${group.total} available. ${explanation}">
          <span class="mini-v2-availability-size" aria-hidden="true">${group.total} / ${group.total}</span>
          <span class="mini-v2-availability-count">${available} / ${group.total}</span>
        </span>
        <span class="mini-v2-availability-pending${pending ? " is-visible" : ""}" aria-hidden="true">*</span>
      </span>`;
    }

    function renderInventorySummary(group) {
      return `<div class="mini-v2-inventory-summary">
        <div class="mini-v2-inventory-available">
          <span class="mini-v2-field-label">Available</span>
          <div class="mini-v2-inventory-summary-value">${renderInventoryAvailability(group)}</div>
        </div>
        <div class="mini-v2-inventory-home">
          ${state.editor ? '<label class="mini-v2-field-label" for="miniV2EditHome">Home</label>' : '<span class="mini-v2-field-label">Home</span>'}
          <div class="mini-v2-inventory-summary-value">
            ${state.editor
              ? `<select id="miniV2EditHome" class="mini-v2-inventory-home-select" data-edit-field="home">${renderEditOptions("home", state.locations)}</select>`
              : renderReadValue(group.home || "Not specified", { marquee: true })}
          </div>
        </div>
      </div>`;
    }

    function renderReadValue(value, options) {
      const config = options || {};
      const className = ["mini-v2-read-value", config.extraClass || "", config.marquee ? "mini-v2-marquee-value" : ""]
        .filter(Boolean)
        .join(" ");
      const safeValue = escapeHtml(value);

      if (!config.marquee) {
        return `<div class="${className}">${safeValue}</div>`;
      }

      return `
        <div class="${className}" title="${safeValue}">
          <span class="mini-v2-marquee-track">
            <span class="mini-v2-marquee-text">${safeValue}</span>
          </span>
        </div>
      `;
    }

    function renderCopyRow(copy) {
      const displayedCopy = state.editor ? editorCopy(copy) : copy;
      const effectiveLocation = state.editor ? displayedCopy.currentLocation : getEffectiveLocation(copy);
      const away = effectiveLocation !== displayedCopy.home;
      const dirty = effectiveLocation !== copy.currentLocation || (displayedCopy.note || "") !== (copy.note || "");
      const noteValue = displayedCopy.note || "";
      const statusMarkup = dirty
        ? '<span class="mini-v2-copy-status is-dirty">Unsaved</span>'
        : away
          ? '<span class="mini-v2-copy-status is-away">Away</span>'
          : '<span class="mini-v2-copy-status is-home">Home</span>';

      return `
        <tr class="mini-v2-copy-row ${away ? "is-away" : ""} ${dirty ? "is-dirty" : ""}" data-detail-copy-id="${escapeHtml(copy.id)}">
          <td>${escapeHtml(copy.sticker || "Needs sticker")}</td>
          <td>${statusMarkup}</td>
          <td>
            <select class="mini-v2-copy-select" data-copy-id="${escapeHtml(copy.id)}" aria-label="Current location for ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}">
              ${renderCopyLocationOptions(displayedCopy, effectiveLocation)}
            </select>
          </td>
          <td class="mini-v2-copy-note-cell" title="${escapeHtml(noteValue || "No individual note")}">${state.editor
            ? `<input class="mini-v2-editor-copy-note" data-edit-copy-note="${escapeHtml(copy.id)}" aria-label="Note for ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}" value="${escapeHtml(noteValue)}" placeholder="Add note...">`
            : escapeHtml(noteValue || "—")}</td>
        </tr>
      `;
    }

    function syncDetailCopyTarget() {
      detailContentNode.querySelectorAll("[data-detail-copy-id]").forEach(row => {
        if (state.browseMode === "individuals") row.tabIndex = 0;
        else row.removeAttribute("tabindex");
        const selected = state.browseMode === "individuals" && !!state.selectedRootId
          && row.dataset.detailCopyId === state.selectedCopyId;
        row.classList.toggle("is-target", selected);
        if (selected) {
          row.setAttribute("aria-current", "true");
          row.setAttribute("aria-label", "Selected miniature copy");
        } else {
          row.removeAttribute("aria-current");
          row.removeAttribute("aria-label");
        }
      });
    }

    function renderCopyGrid(group) {
      return `
        <div class="mini-v2-copy-grid">
          <div class="mini-v2-copy-table-shell">
            <div class="mini-v2-copy-table-content">
              ${renderInventorySummary(group)}
              <table class="mini-v2-table mini-v2-copy-table" aria-label="Individual miniature copies">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Status</th>
                    <th>Current Location</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody>${group.copies.map(renderCopyRow).join("")}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderCopyLocationOptions(copy, effectiveLocation) {
      return [`<option value="__RETURN_HOME__"${effectiveLocation === copy.home ? " selected" : ""}>Return Home</option>`]
        .concat(Array.from(new Set([...state.locations, effectiveLocation, copy.home])).filter(Boolean).map(location => `
          <option value="${escapeHtml(location)}"${effectiveLocation === location ? " selected" : ""}>${escapeHtml(location)}</option>
        `))
        .join("");
    }

    function hasNamedSet(group) {
      return hasMeaningfulValue(group.set) && String(group.set).trim().toLowerCase() !== "n/a";
    }

    function getCollectionSummary(group) {
      const hasSet = hasNamedSet(group);
      const hasSetNumber = hasMeaningfulValue(group.setNumber);
      if (hasSet && hasSetNumber) return `${group.set} (${group.setNumber})`;
      if (hasSet) return String(group.set);
      if (hasSetNumber) return `#${group.setNumber}`;
      return "n/a";
    }

    function renderSortHeader(cellClassName, sortKey, visibleLabel, spokenLabel) {
      const isActive = state.sort.key === sortKey && !!state.sort.direction;
      const direction = isActive ? state.sort.direction : "";
      const indicator = direction === "desc" ? "▼" : direction === "asc" ? "▲" : "";
      const ariaSort = direction === "desc" ? "descending" : direction === "asc" ? "ascending" : "none";
      const label = spokenLabel || visibleLabel;

      return `
        <th class="${cellClassName}" aria-sort="${ariaSort}">
          <button
            class="mini-v2-sort-button ${isActive ? "is-active" : ""} ${cellClassName === "mini-v2-cell-avail" ? "is-avail" : ""}"
            type="button"
            data-action="toggle-sort"
            data-sort-key="${escapeHtml(sortKey)}"
            aria-label="Sort by ${escapeHtml(label)}${direction ? `, currently ${ariaSort}` : ""}"
          >
            <span class="mini-v2-sort-label">${escapeHtml(visibleLabel)}</span>
            <span class="mini-v2-sort-indicator" aria-hidden="true">${indicator}</span>
          </button>
        </th>
      `;
    }

    function handleRootClick(event) {
      const clickTarget = event.target instanceof Element ? event.target : null;
      const viewButton = clickTarget && clickTarget.closest("button[data-browse-mode]");
      if (viewButton && root.contains(viewButton)) {
        event.stopPropagation();
        switchBrowseMode(viewButton.dataset.browseMode);
        return;
      }
      // Dismissing a popover must not also trigger document-level inspector dismissal.
      if (dismissOutsidePopovers(clickTarget)) event.stopPropagation();

      const actionButton = event.target.closest("button[data-action]");
      if (actionButton && root.contains(actionButton)) {
        event.stopPropagation();
        const action = actionButton.getAttribute("data-action");

        if (action === "edit-mini") { beginEditor(); return; }
        if (action === "discard-edit") { discardEditor(); return; }
        if (action === "save-edit") { saveEditor(); return; }
        if (action === "review-editor-drafts") {
          const ids = editorDraftIds();
          if (!ids.length) return;
          const next = ids[(ids.indexOf(state.selectedRootId) + 1) % ids.length];
          if (state.editor && next !== state.editor.rootId) leaveEditor();
          if (next !== state.selectedRootId) state.selectedCopyId = "";
          state.selectedRootId = next;
          renderAllPreservingScroll(null, { keepSelection: true });
          document.getElementById("miniV2EditName").focus({ preventScroll: true });
          return;
        }
        if (action === "edit-all-home" && state.editor) {
          getSelectedGroup().copies.forEach(copy => {
            const home = editorCopy(copy).home;
            state.editor.copies[copy.id].currentLocation = home;
            const select = Array.from(detailContentNode.querySelectorAll("select[data-copy-id]"))
              .find(node => node.dataset.copyId === copy.id);
            select.innerHTML = renderCopyLocationOptions(editorCopy(copy), home);
          });
          syncEditorFeedback();
          return;
        }

        if (action === "toggle-facet") {
          const restoreFocus = captureFocus();
          const facetKey = actionButton.getAttribute("data-facet-key") || "";
          state.openFacetKey = state.openFacetKey === facetKey ? "" : facetKey;
          renderFacetBar();
          renderFacetFlyout();
          restoreFocus();
          return;
        }

        if (action === "review-changes") {
          const dirtyGroups = state.groups.filter(group => group.copies.some(isDirty));
          const currentIndex = dirtyGroups.findIndex(group => group.rootId === state.selectedRootId);
          const group = dirtyGroups[(currentIndex + 1) % dirtyGroups.length];
          if (!group) return;
          if (state.editor && group.rootId !== state.editor.rootId && !leaveEditor()) return;
          const dirtyCopy = group.copies.find(isDirty);
          if (!getBrowseRows().some(row => row.group.rootId === group.rootId && (!row.copy || row.copy.id === dirtyCopy.id))) {
            state.search = "";
            state.locationFilter = "all";
            state.filtersApplied = createEmptyFilterState();
          }
          state.selectedRootId = group.rootId;
          state.selectedCopyId = state.browseMode === "individuals" ? dirtyCopy.id : "";
          renderAllPreservingScroll(null, { keepSelection: true });
          if (state.selectedCopyId) scheduleCopyReveal(state.selectedCopyId);
          return;
        }

        if (action === "toggle-facet-value") {
          toggleAppliedFacetValue(
            actionButton.getAttribute("data-facet-kind") || "",
            actionButton.getAttribute("data-facet-value") || ""
          );
          renderAllPreservingScroll();
          return;
        }

        if (action === "toggle-facet-flag") {
          toggleAppliedFacetFlag(actionButton.getAttribute("data-facet-flag") || "");
          renderAllPreservingScroll();
          return;
        }

        if (action === "clear-open-facet") {
          clearOpenFacetSelections();
          renderAllPreservingScroll();
          return;
        }

        if (action === "toggle-location-menu") {
          state.locationMenuOpen = !state.locationMenuOpen;
          if (!state.locationMenuOpen) {
            state.locationMenuSearch = "";
          }
          renderLocationFilter();
          if (state.locationMenuOpen) {
            requestAnimationFrame(() => {
              locationSearchNode.focus();
              locationSearchNode.select();
            });
          }
          return;
        }

        if (action === "clear-location") {
          state.locationFilter = "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          renderAllPreservingScroll();
          return;
        }

        if (action === "set-location-filter") {
          state.locationFilter = actionButton.getAttribute("data-location-value") || "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          renderAllPreservingScroll();
          return;
        }

        if (action === "clear-filters") {
          state.search = "";
          state.locationFilter = "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          state.filtersApplied = createEmptyFilterState();
          state.openFacetKey = "";
          renderAllPreservingScroll();
          return;
        }

        if (action === "toggle-sort") {
          toggleSortState(actionButton.getAttribute("data-sort-key") || "");
          renderAllPreservingScroll();
          return;
        }

        if (action === "close-detail") {
          clearSelectedGroup();
          return;
        }

        if (action === "reset-changes") {
          resetSelectedDraftChanges();
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }

        if (action === "set-all-home") {
          stageSelectedCopiesHome();
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }

        if (action === "save-changes") {
          saveSelectedDraftChanges();
          state.browseScroll = { groups: null, individuals: null };
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }
      }

      const detailRow = clickTarget && clickTarget.closest("[data-detail-copy-id]");
      if (detailRow && state.browseMode === "individuals"
        && !clickTarget.closest("button, input, select, textarea, a, label")) {
        event.stopPropagation();
        selectDetailCopy(detailRow.dataset.detailCopyId);
        return;
      }

      const clickedRow = event.target.closest("tr[data-group-id]");
      if (clickedRow && root.contains(clickedRow)) {
        event.stopPropagation();
        const rootId = clickedRow.getAttribute("data-group-id");
        const copyId = clickedRow.getAttribute("data-copy-id") || "";
        if (!rootId) return;
        if (rootId !== state.selectedRootId || (copyId && copyId !== state.selectedCopyId)) {
          if (state.editor && rootId !== state.editor.rootId && !leaveEditor()) return;
          clearTimeout(copyRevealTimer);
          state.selectedRootId = rootId;
          state.selectedCopyId = copyId;
          renderAllPreservingScroll();
          if (copyId) scheduleCopyReveal(copyId);
          return;
        }
        clearSelectedGroup();
      }
    }

    function handleRootInput(event) {
      if (updateEditorInput(event.target)) return;
      if (event.target === searchInputNode) {
        state.search = searchInputNode.value;
        renderAllPreservingScroll();
        return;
      }

      if (event.target === locationSearchNode) {
        state.locationMenuSearch = locationSearchNode.value;
        renderLocationFilter();
        return;
      }

    }

    function handleRootChange(event) {
      if (updateEditorInput(event.target)) return;
      const copySelect = event.target.closest("select[data-copy-id]");
      if (copySelect) {
        const group = getSelectedGroup();
        if (!group) return;
        const copy = group.copies.find(item => item.id === copySelect.getAttribute("data-copy-id"));
        if (!copy) return;

        const nextLocation = copySelect.value === "__RETURN_HOME__" ? (state.editor ? editorCopy(copy).home : copy.home) : copySelect.value;
        if (state.editor) {
          state.editor.copies[copy.id].currentLocation = nextLocation;
          copySelect.innerHTML = renderCopyLocationOptions(editorCopy(copy), nextLocation);
          syncEditorFeedback();
          return;
        }
        if (nextLocation === copy.currentLocation) {
          delete state.draftLocations[copy.id];
        } else {
          state.draftLocations[copy.id] = nextLocation;
        }
        renderAllPreservingScroll(null, { keepSelection: true });
      }
    }

    function handleRootKeydown(event) {
      if (event.key === "Escape" && state.openFacetKey) {
        const currentFacetKey = state.openFacetKey;
        state.openFacetKey = "";
        renderFacetBar();
        renderFacetFlyout();
        requestAnimationFrame(() => {
          const button = root.querySelector(`button[data-facet-key="${currentFacetKey}"]`);
          if (button instanceof HTMLElement) {
            button.focus();
          }
        });
        return;
      }

      if (event.key === "Escape" && state.locationMenuOpen) {
        state.locationMenuOpen = false;
        state.locationMenuSearch = "";
        renderLocationFilter();
        locationTriggerNode.focus();
        return;
      }

      if (state.editor && event.key === "Escape") {
        // Escape on a native select belongs to its popup, not to the whole editor.
        if (event.target instanceof HTMLSelectElement) return;
        event.preventDefault();
        clearSelectedGroup();
        return;
      }

      if (event.target === locationTriggerNode && (event.key === "Enter" || event.key === " " || event.key === "ArrowDown")) {
        event.preventDefault();
        state.locationMenuOpen = true;
        renderLocationFilter();
        requestAnimationFrame(() => {
          locationSearchNode.focus();
          locationSearchNode.select();
        });
        return;
      }

      const detailRow = event.target.closest("[data-detail-copy-id]");
      if (detailRow && event.target === detailRow && state.browseMode === "individuals"
        && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectDetailCopy(detailRow.dataset.detailCopyId);
        return;
      }

      const row = event.target.closest("tr[data-group-id]");
      if (!row) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        row.click();
      }
    }

    function dismissOutsidePopovers(target) {
      let dismissed = false;
      if (state.locationMenuOpen && target instanceof Element && !target.closest("#miniV2LocationCombobox")) {
        dismissed = true;
        state.locationMenuOpen = false;
        state.locationMenuSearch = "";
        renderLocationFilter();
      }
      if (state.openFacetKey && target instanceof Element && !target.closest("#miniV2FacetShell")) {
        dismissed = true;
        state.openFacetKey = "";
        renderFacetBar();
        renderFacetFlyout();
      }
      return dismissed;
    }

    function handleDocumentClick(event) {
      const target = event && event.target;
      const dismissed = dismissOutsidePopovers(target);
      const detailPointerDownInside = state.detailPointerDownInside;
      state.detailPointerDownInside = false;
      if (dismissed || detailPointerDownInside) return;
      if (!root.classList.contains("mini-v2-has-detail")) return;
      if (isDetailPersistentClickTarget(target)) return;
      clearSelectedGroup();
    }

    function handleDocumentPointerDown(event) {
      const target = event && event.target;
      state.detailPointerDownInside = !!(target instanceof Element && target.closest("#miniV2DetailPanel"));
    }

    function handleFacetPopoverTransitionEnd(event) {
      if (event.target !== facetPopoverNode) return;
      if (event.propertyName !== "height") return;
      if (!state.openFacetKey) return;
      facetPopoverNode.style.height = "";
    }

    function isDetailPersistentClickTarget(target) {
      if (!target || !(target instanceof Element)) return false;
      if (target.closest("#miniV2DetailPanel")) return true;
      if (target.closest("#miniV2FacetShell")) return true;
      if (target.closest("tr[data-group-id]")) return true;
      if (target.closest(".mini-v2-top-card :is(button, input, select, textarea, a, label, [data-action])")) return true;
      if (target.closest(".mini-v2-controls :is(button, input, select, textarea, a, label, [data-action])")) return true;
      return false;
    }

    function captureScrollState() {
      const host = getPrimaryScrollHost();
      return {
        host: host,
        hostTop: host ? host.scrollTop : 0,
        hostLeft: host ? host.scrollLeft : 0,
        tableTop: tableScrollNode ? tableScrollNode.scrollTop : null,
        tableLeft: tableScrollNode?.querySelector(".mini-v2-list-wrap")?.scrollLeft || 0,
        detailTop: detailScrollNode ? detailScrollNode.scrollTop : null,
        detailTableLeft: detailContentNode?.querySelector(".mini-v2-copy-table-shell")?.scrollLeft || 0
      };
    }

    function restoreScrollState(scrollState) {
      if (!scrollState) return;
      const version = ++scrollRestoreVersion;

      const apply = function () {
        if (version !== scrollRestoreVersion) return;
        const host = scrollState.host || getPrimaryScrollHost();
        if (host) {
          if (Math.abs((host.scrollTop || 0) - (scrollState.hostTop || 0)) > 1) {
            host.scrollTop = scrollState.hostTop || 0;
          }
          if (Math.abs((host.scrollLeft || 0) - (scrollState.hostLeft || 0)) > 1) {
            host.scrollLeft = scrollState.hostLeft || 0;
          }
        }

        if (tableScrollNode && scrollState.tableTop !== null) {
          tableScrollNode.scrollTop = scrollState.tableTop;
        }

        if (detailScrollNode && scrollState.detailTop !== null) {
          detailScrollNode.scrollTop = scrollState.detailTop;
        }
        const listWrap = tableScrollNode?.querySelector(".mini-v2-list-wrap");
        if (listWrap) listWrap.scrollLeft = scrollState.tableLeft || 0;
        const copyShell = detailContentNode?.querySelector(".mini-v2-copy-table-shell");
        if (copyShell) copyShell.scrollLeft = scrollState.detailTableLeft || 0;
      };

      apply();
      requestAnimationFrame(apply);
    }

    function browseScrollKey() {
      return JSON.stringify([state.search, state.locationFilter, state.filtersApplied, state.sort]);
    }

    function switchBrowseMode(mode) {
      if (!["groups", "individuals"].includes(mode) || mode === state.browseMode) return;
      clearTimeout(copyRevealTimer);
      const scroll = captureScrollState();
      state.browseScroll[state.browseMode] = { key: browseScrollKey(), top: scroll.tableTop, left: scroll.tableLeft };
      state.browseMode = mode;
      if (!["name", "size", "type", "race", "sex", "role"].includes(state.sort.key)) {
        state.sort = { key: "", direction: "" };
      }
      const previous = state.browseScroll[mode];
      const restorePrevious = previous && previous.key === browseScrollKey();
      scroll.tableTop = restorePrevious ? previous.top : 0;
      scroll.tableLeft = restorePrevious ? previous.left : 0;
      state.openFacetKey = "";
      state.locationMenuOpen = false;
      state.locationMenuSearch = "";
      if (mode === "individuals" && state.selectedRootId) {
        const candidates = getBrowseRows().filter(row => row.group.rootId === state.selectedRootId);
        const selected = candidates.find(row => row.copy.id === state.selectedCopyId) || candidates[0];
        state.selectedCopyId = selected ? selected.copy.id : "";
      }
      renderAllPreservingScroll(scroll, { keepSelection: true, keepDetail: true });
      if (mode === "individuals" && state.selectedCopyId) revealBrowseCopy(state.selectedCopyId, true);
    }

    function selectDetailCopy(copyId) {
      if (!getSelectedGroup()?.copies.some(copy => copy.id === copyId)) return;
      clearTimeout(copyRevealTimer);
      state.selectedCopyId = copyId;
      renderAllPreservingScroll(null, { keepSelection: true, keepDetail: true });
      revealBrowseCopy(copyId);
    }

    function revealBrowseCopy(copyId, positionWithContext = false) {
      const row = Array.from(tableScrollNode.querySelectorAll("tr[data-copy-id]"))
        .find(node => node.dataset.copyId === copyId);
      if (!row) return; // Keep filters intact when the inspector selects a hidden sibling.
      const bounds = row.getBoundingClientRect();
      const viewport = tableScrollNode.getBoundingClientRect();
      if (!positionWithContext && bounds.top >= viewport.top && bounds.bottom <= viewport.bottom) return;
      const context = Math.min(bounds.height * 4, Math.max(0, tableScrollNode.clientHeight - bounds.height));
      const scroll = captureScrollState();
      scroll.tableTop += bounds.top - viewport.top - context;
      // Use the existing restoration mechanism so a pending frame cannot undo the reveal.
      restoreScrollState(scroll);
    }

    function scheduleCopyReveal(copyId) {
      clearTimeout(copyRevealTimer);
      // Wait for the pane slide and the normal scroll restoration to finish.
      copyRevealTimer = setTimeout(() => {
        if (state.selectedCopyId !== copyId || !getSelectedGroup()) return;
        const row = Array.from(detailContentNode.querySelectorAll("[data-detail-copy-id]"))
          .find(node => node.dataset.detailCopyId === copyId);
        if (!row || !desktopMq.matches) return;
        const bounds = row.getBoundingClientRect();
        const viewport = detailScrollNode.getBoundingClientRect();
        if (bounds.bottom > viewport.bottom - 8) detailScrollNode.scrollTop += bounds.bottom - viewport.bottom + 8;
        else if (bounds.top < viewport.top + 8) detailScrollNode.scrollTop += bounds.top - viewport.top - 8;
      }, 260);
    }

    function getPrimaryScrollHost() {
      return document.scrollingElement || document.documentElement || document.body;
    }

    function syncDesktopLayoutMetrics() {
      if (!desktopMq.matches) {
        root.style.removeProperty("--mini-v2-browse-table-width");
        scheduleDetailMarqueeSync(0);
        return;
      }

      const listWrap = tableScrollNode ? tableScrollNode.querySelector(".mini-v2-list-wrap") : null;
      if (!listWrap) return;

      // Measure the full workspace, not the shrinking pane during its slide.
      const tableCard = root.querySelector(".mini-v2-table-card");
      const insets = tableCard.getBoundingClientRect().width - listWrap.getBoundingClientRect().width;
      const detailStyle = getComputedStyle(detailPanelNode);
      const closedBorder = parseFloat(detailStyle.borderLeftWidth) + parseFloat(detailStyle.borderRightWidth);
      const width = Math.round(workspaceNode.getBoundingClientRect().width - insets - closedBorder);
      if (width > 0) {
