<script>
  (function () {
    if (INITIAL_STATE.loadError) {
      document.getElementById("app").innerHTML = `<div class="mini-v2"><section class="v2-card mini-v2-top-card">
        <div class="v2-card-header">Collection preview unavailable</div>
        <div class="v2-card-body"><p>The imported collection could not be loaded. No data was changed.</p>
          <p>Try reloading. If this continues, check the Apps Script authorization and the 2.0 storage tabs.</p>
          <button type="button" class="button" id="miniV2RetryLoad">Reload preview</button>
        </div></section></div>`;
      document.getElementById("miniV2RetryLoad").addEventListener("click", () => window.location.reload());
      return;
    }
    const previewMode = INITIAL_STATE.previewMode === true;
    const stickerCatalog = Array.isArray(INITIAL_STATE.stickerCatalog) ? INITIAL_STATE.stickerCatalog : null;
    const desktopMq = window.matchMedia("(min-width: 980px)");
    const reducedMotionMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    const FILTER_OPTIONS = {
      sizes: ["Tiny", "Small", "Medium", "Large", "Huge", "Gargantuan"],
      creatureTypes: [
        "Aberration",
        "Beast",
        "Celestial",
        "Construct",
        "Dragon",
        "Elemental",
        "Fey",
        "Fiend",
        "Giant",
        "Humanoid",
        "Monstrosity",
        "Ooze",
        "Plant",
        "Undead",
        "n/a"
      ],
      roles: ["Melee", "Ranged", "Spellcaster", "Support", "Tank", "Boss", "Minion", "NPC", "Other", "Various", "n/a"],
      sexes: ["Female", "Male", "n/a"],
      races: [
        "Aasimar",
        "Bugbear",
        "Dragonborn",
        "Drow",
        "Dwarf",
        "Elf",
        "Gnoll",
        "Gnome",
        "Goblin",
        "Goliath",
        "Half-Elf",
        "Half-Orc",
        "Halfling",
        "Hobgoblin",
        "Human",
        "Kobold",
        "Lizardfolk",
        "Orc",
        "Tiefling",
        "Tortle",
        "Yuan-ti",
        "other",
        "n/a"
      ]
    };

    const EDIT_FIELDS = ["name", "size", "creatureType", "race", "sex", "role", "set", "setNumber", "home", "paint", "notes"];
    const UNSPECIFIED_VALUE = "Not specified";
    const MISSING_VALUE_LABEL = "Not entered";
    const FACET_FIELDS = { sizes: "size", creatureTypes: "creatureType", races: "race", sexes: "sex", roles: "role" };
    Object.entries(FACET_FIELDS).forEach(([kind, field]) => {
      if (Array.isArray(INITIAL_STATE.catalogs?.[field])) FILTER_OPTIONS[kind] = INITIAL_STATE.catalogs[field].slice();
    });
    const PAINT_OPTIONS = (INITIAL_STATE.catalogs?.paint || ["Painted", "Unpainted", "Work in Progress"]).slice();
    const LIST_DEFINITIONS = [
      { key: "size", label: "Size", title: "Sizes", kind: "sizes" },
      { key: "creatureType", label: "Creature Type", title: "Creature Types", kind: "creatureTypes" },
      { key: "race", label: "Race", title: "Races", kind: "races" },
      { key: "sex", label: "Sex", title: "Sex", kind: "sexes" },
      { key: "role", label: "Role", title: "Roles", kind: "roles" },
      { key: "set", label: "Set", title: "Sets" },
      { key: "paint", label: "Paint", title: "Paint Status" },
      { key: "locations", label: "Locations", title: "Locations" }
    ];
    const STICKER_FILTER_OPTIONS = ["Assigned", "Missing"];
    const RECORD_STATUS_OPTIONS = ["Complete", "Incomplete"];
    const EDIT_REQUIRED_CHOICES = {
      size: "Size", creatureType: "Creature Type", race: "Race", sex: "Sex", role: "Role", set: "Set", paint: "Paint"
    };
    const NEXT_STICKER_STORAGE_KEY = `ppq-miniature-tracker:${INITIAL_STATE.prototypeMode ? "mock" : "collection"}:next-sticker:v1`;

    const state = {
      groups: INITIAL_STATE.groups.map((group, index) => enrichGroup({ ...group, originalOrder: index })),
      locations: INITIAL_STATE.locations.slice(),
      homeLocations: (INITIAL_STATE.homeLocations || INITIAL_STATE.locations).slice(),
      sets: Array.from(new Set(INITIAL_STATE.catalogs?.set || INITIAL_STATE.groups.map(group => group.set).filter(hasMeaningfulValue))).sort(compareText),
      browseMode: "groups",
      browseScroll: { groups: null, individuals: null },
      collectionView: "",
      previousBrowse: null,
      pendingReturn: null,
      pendingSaved: false,
      summaryPanel: "",
      search: "",
      locationFilter: "all",
      locationMenuOpen: false,
      locationMenuSearch: "",
      filtersApplied: createEmptyFilterState(),
      sort: {
        key: "",
        direction: ""
      },
      openFacetKey: "",
      selectedRootId: "",
      selectedCopyId: "",
      draftLocations: {},
      editor: null,
      editorDrafts: Object.create(null),
      newGroups: Object.create(null),
      deletedGroups: [],
      nextStickerStart: null,
      nextStickerRevision: 0,
      stickerCursorRevision: 0,
      nextMockId: 1,
      detailPointerDownInside: false
    };
    const listManager = { key: "set", query: "", forms: Object.create(null), undo: [], notice: "",
      catalogs: Object.create(null), nextId: 1, pageStyles: null };
    LIST_DEFINITIONS.forEach(definition => {
      const values = definition.kind ? FILTER_OPTIONS[definition.kind]
        : definition.key === "set" ? state.sets : definition.key === "paint" ? PAINT_OPTIONS
          : [...state.locations, ...state.homeLocations];
      const choices = definition.kind || definition.key === "set" ? [...values, UNSPECIFIED_VALUE] : values;
      listManager.catalogs[definition.key] = [...new Set(choices)].map(value => ({
        id: `choice-${listManager.nextId++}`, value, hidden: false,
        home: definition.key === "locations" && state.homeLocations.includes(value),
        locked: ["n/a", UNSPECIFIED_VALUE.toLowerCase()].includes(value.toLowerCase())
      }));
    });

    const saveTransport = MiniSaveFlow.createSimulator([
      ...state.groups.map(group => ({ table: "groups", id: group.rootId, value: saveGroupRecord(group) })),
      ...Object.entries(listManager.catalogs).flatMap(([key, choices]) => choices.map(choice => ({ table: `lists:${key}`, id: choice.id, value: choice })))
    ]);
    let saveJob = null;
    let nextSaveOutcome = "success";
    if (INITIAL_STATE.saveTestMode === true) window.__miniSaveTest = {
      transport: saveTransport, job: () => saveJob && MiniSaveFlow.clone({ request: saveJob.request, status: saveJob.status })
    };

    let root;
    let listDialogNode;
    let workspaceNode;
    let summaryLaneNode;
    let summaryMarkup = "";
    let listHeaderNoteNode;
    let searchInputNode;
    let locationComboboxNode;
    let locationTriggerNode;
    let locationLabelNode;
    let locationClearNode;
    let locationPopoverNode;
    let locationSearchNode;
    let locationOptionsNode;
    let facetShellNode;
    let facetBarNode;
    let facetPopoverNode;
    let facetPopoverTitleNode;
    let facetPopoverClearNode;
    let facetPopoverBodyNode;
    let listStageNode;
    let tableScrollNode;
    let detailPanelNode;
    let detailStageNode;
    let detailHeaderTitleNode;
    let detailHeaderTagsNode;
    let detailStatusTipNode;
    let detailStatusTipPinned = false;
    let detailStatusTipHideTimer = null;
    let detailCloseButtonNode;
    let detailScrollNode;
    let detailEmptyNode;
    let detailContentNode;
    let facetHideTimer = null;
    let facetSwapTimer = null;
    let detailWidthSyncTimer = null;
    let detailMarqueeSyncTimer = null;
    let copyRevealTimer = null;
    let scrollRestoreVersion = 0;

    state.nextStickerStart = loadNextStickerStart();
    initMiniV2();

    function initMiniV2() {
      buildShell();
      bindNodes();
      renderLocationFilter();
      renderAll();
      syncDesktopLayoutMetrics();
      bindEvents();
      window.addEventListener("resize", () => {
        hideDetailStatusTip();
        syncDesktopLayoutMetrics();
      });
      new ResizeObserver(() => syncDesktopLayoutMetrics()).observe(workspaceNode);
      reducedMotionMq.addEventListener("change", () => scheduleDetailMarqueeSync(0));
      window.addEventListener("beforeunload", event => {
        if (!saveJob && !editorDraftIds().length && !state.groups.some(group => group.copies.some(isDirty))
          && !Object.entries(listManager.forms).some(([key, form]) => {
            const choice = listManager.catalogs[key].find(item => item.id === form.id);
            return form.mode !== "remove" && (choice ? form.name !== choice.value || form.home !== choice.home : !!form.name.trim());
          })) return;
        event.preventDefault();
        event.returnValue = "";
      });
    }

    function buildShell() {
      document.getElementById("app").innerHTML = `
        <div id="miniV2Root" class="mini-v2">
          <section class="v2-card mini-v2-top-card">
            <div class="v2-card-header mini-v2-app-header">
              <span>PPQ Miniature Tracker</span>
              <button type="button" class="mini-v2-demo-note" data-action="toggle-summary" data-summary-panel="demo"
                aria-label="${previewMode ? "Collection preview" : "Demo data"}: changes reset on reload. More information" aria-expanded="false" aria-controls="miniV2DemoNotice">
                ${previewMode ? "Preview" : "Demo"}<span>: ${previewMode ? "changes reset on reload" : "resets on reload"}</span>
              </button>
            </div>
            <div class="v2-card-body mini-v2-top-card-body">
              <div id="miniV2SummaryLane" class="mini-v2-summary-lane"></div>
            </div>
          </section>

          <dialog id="miniV2ListsDialog" class="mini-v2-lists-dialog" aria-labelledby="miniV2ListsTitle"
            aria-describedby="miniV2ListsScope">
            <div class="mini-v2-lists-header">
              <h2 id="miniV2ListsTitle">Manage Lists</h2>
              <button type="button" class="button mini-v2-copy-btn" data-list-action="close">Done</button>
            </div>
            <div class="mini-v2-lists-body">
              <nav class="mini-v2-lists-nav" aria-label="Dropdown lists"></nav>
              <div class="mini-v2-lists-content">
                <label class="mini-v2-lists-mobile-picker">List<select id="miniV2ListsPicker"></select></label>
                <div class="mini-v2-lists-toolbar">
                  <div><h3 id="miniV2ListsHeading"></h3><p id="miniV2ListsCount"></p></div>
                  <button type="button" class="button mini-v2-copy-btn mini-v2-secondary" data-list-action="add">+ Add</button>
                </div>
                <input id="miniV2ListsSearch" class="mini-v2-lists-input" type="search" placeholder="Search choices..." aria-label="Search list choices">
                <div id="miniV2ListsForm" hidden></div>
                <div id="miniV2ListsRows" class="mini-v2-lists-rows" role="region" aria-labelledby="miniV2ListsHeading" tabindex="0"></div>
              </div>
            </div>
            <div class="mini-v2-lists-footer">
              <div><p id="miniV2ListsNotice" role="status" aria-live="polite"></p>
                <p id="miniV2ListsScope">Preview only. List changes reset on reload.</p></div>
              <button type="button" class="button mini-v2-copy-btn" data-list-action="undo" hidden>Undo removal</button>
            </div>
          </dialog>
          <div id="miniV2DetailStatusTip" class="mini-v2-detail-status-tip" role="tooltip" hidden></div>
          <div class="mini-v2-workspace">
            <section class="v2-card mini-v2-table-card">
              <div id="miniV2ListStage" class="mini-v2-list-stage">
                <div class="v2-card-header mini-v2-list-header">
                  <span class="mini-v2-browse-heading">
                    <button id="miniV2BrowseBack" type="button" class="button mini-v2-browse-back" data-action="leave-pending" aria-label="Back to previous browse view" title="Back to previous browse view" hidden>
                      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10H4m6-6-6 6 6 6"/></svg>
                    </button>
                    <span id="miniV2BrowseTitle">Browse<span class="mini-v2-browse-title-tail"> Minis</span></span>
                  </span>
                  <span id="miniV2ListHeaderNote" class="mini-v2-list-header-note" hidden></span>
                  <div class="mini-v2-view-switch" role="group" aria-label="Browse view">
                    <button type="button" data-browse-mode="groups" aria-pressed="true">Groups</button>
                    <button type="button" data-browse-mode="individuals" aria-pressed="false">Individuals</button>
                  </div>
                  <button class="button mini-v2-new-button" type="button" data-action="new-group" aria-label="Create a new miniature group" title="Create a new miniature group">+<span> New</span></button>
                </div>
                <div class="v2-card-body mini-v2-table-body">
                  <div class="mini-v2-controls">
                    <div class="mini-v2-search-row">
                      <div class="mini-v2-field">
                        <input id="miniV2SearchInput" type="search" placeholder="Search name, sticker, or details...">
                      </div>
                      <div class="mini-v2-field">
                        <div id="miniV2LocationCombobox" class="mini-v2-combobox">
                          <button
                            id="miniV2LocationTrigger"
                            class="mini-v2-combobox-trigger"
                            type="button"
                            data-action="toggle-location-menu"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-controls="miniV2LocationPopover"
                          >
                            <span id="miniV2LocationLabel" class="mini-v2-combobox-label">All locations</span>
                            <span class="mini-v2-combobox-caret" aria-hidden="true">▾</span>
                          </button>
                          <button
                            id="miniV2LocationClear"
                            class="mini-v2-combobox-clear"
                            type="button"
                            data-action="clear-location"
                            aria-label="Clear location filter"
                            hidden
                          >
                            ×
                          </button>
                          <div id="miniV2LocationPopover" class="mini-v2-combobox-popover" hidden>
                            <div class="mini-v2-combobox-search-wrap">
                              <input id="miniV2LocationSearch" class="mini-v2-combobox-search" type="search" placeholder="Search locations...">
                            </div>
                            <div id="miniV2LocationOptions" class="mini-v2-combobox-options" role="listbox" aria-label="Locations"></div>
                          </div>
                        </div>
                      </div>
                      <button class="button mini-v2-action-btn" type="button" data-action="clear-filters">Clear</button>
                    </div>
                    <div id="miniV2FacetShell" class="mini-v2-facet-shell">
                      <div id="miniV2FacetBar" class="mini-v2-facet-row"></div>
                      <span id="miniV2BrowseCount" class="mini-v2-browse-count"></span>
                      <div id="miniV2FacetPopover" class="mini-v2-facet-popover" hidden>
                        <div class="mini-v2-facet-popover-header">
                          <div id="miniV2FacetPopoverTitle" class="mini-v2-facet-popover-title"></div>
                          <button
                            id="miniV2FacetPopoverClear"
                            class="button mini-v2-facet-popover-link"
                            type="button"
                            data-action="clear-open-facet"
                            disabled
                          >
                            Clear
                          </button>
                        </div>
                        <div id="miniV2FacetPopoverBody" class="mini-v2-facet-popover-body"></div>
                      </div>
                    </div>
                  </div>
                  <div id="miniV2TableScroll" class="mini-v2-table-scroll"></div>
                </div>
              </div>
            </section>

            <aside id="miniV2DetailPanel" class="v2-card mini-v2-detail-card">
              <div id="miniV2DetailStage" class="mini-v2-detail-stage">
                <div class="v2-card-header mini-v2-detail-header">
                  <div class="mini-v2-detail-header-main">
                    <span id="miniV2DetailHeaderTitle" class="mini-v2-marquee-value"><span class="mini-v2-marquee-track"><span class="mini-v2-marquee-text">Mini Details</span></span></span>
                    <input id="miniV2EditName" class="mini-v2-editor-name" data-edit-field="name" aria-label="Miniature name" hidden>
                    <div id="miniV2DetailHeaderTags" class="mini-v2-detail-tag-row"></div>
                  </div>
                  <div class="mini-v2-detail-header-actions">
                    <button class="button mini-v2-detail-close" type="button" data-action="edit-mini" hidden>Edit</button>
                    <button id="miniV2DetailCloseButton" class="button mini-v2-detail-close" type="button" data-action="close-detail">Close</button>
                  </div>
                </div>
                <div class="v2-card-body">
                  <div id="miniV2DetailScroll" class="mini-v2-detail-scroll">
                    <div id="miniV2DetailEmpty" class="mini-v2-detail-empty">Select a miniature to view its details and move individual copies.</div>
                    <div id="miniV2DetailContent" hidden></div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function bindNodes() {
      root = document.getElementById("miniV2Root");
      listDialogNode = document.getElementById("miniV2ListsDialog");
      workspaceNode = root.querySelector(".mini-v2-workspace");
      summaryLaneNode = document.getElementById("miniV2SummaryLane");
      listHeaderNoteNode = document.getElementById("miniV2ListHeaderNote");
      searchInputNode = document.getElementById("miniV2SearchInput");
      locationComboboxNode = document.getElementById("miniV2LocationCombobox");
      locationTriggerNode = document.getElementById("miniV2LocationTrigger");
      locationLabelNode = document.getElementById("miniV2LocationLabel");
      locationClearNode = document.getElementById("miniV2LocationClear");
      locationPopoverNode = document.getElementById("miniV2LocationPopover");
      locationSearchNode = document.getElementById("miniV2LocationSearch");
      locationOptionsNode = document.getElementById("miniV2LocationOptions");
      facetShellNode = document.getElementById("miniV2FacetShell");
      facetBarNode = document.getElementById("miniV2FacetBar");
      facetPopoverNode = document.getElementById("miniV2FacetPopover");
      facetPopoverTitleNode = document.getElementById("miniV2FacetPopoverTitle");
      facetPopoverClearNode = document.getElementById("miniV2FacetPopoverClear");
      facetPopoverBodyNode = document.getElementById("miniV2FacetPopoverBody");
      locationTriggerNode.querySelector(".mini-v2-combobox-caret").textContent = "";
      locationClearNode.textContent = "x";
      listStageNode = document.getElementById("miniV2ListStage");
      tableScrollNode = document.getElementById("miniV2TableScroll");
      detailPanelNode = document.getElementById("miniV2DetailPanel");
      detailStageNode = document.getElementById("miniV2DetailStage");
      detailHeaderTitleNode = document.getElementById("miniV2DetailHeaderTitle");
      detailHeaderTagsNode = document.getElementById("miniV2DetailHeaderTags");
      detailStatusTipNode = document.getElementById("miniV2DetailStatusTip");
      detailCloseButtonNode = document.getElementById("miniV2DetailCloseButton");
      detailScrollNode = document.getElementById("miniV2DetailScroll");
      detailEmptyNode = document.getElementById("miniV2DetailEmpty");
      detailContentNode = document.getElementById("miniV2DetailContent");
    }

    function bindEvents() {
      listDialogNode.addEventListener("cancel", event => { event.preventDefault(); closeListManager(); });
      listDialogNode.addEventListener("click", handleListManagerClick);
      listDialogNode.addEventListener("input", handleListManagerInput);
      listDialogNode.addEventListener("change", handleListManagerInput);
      listDialogNode.addEventListener("keydown", event => {
        event.stopPropagation();
        if (event.key === "Tab") {
          const focusable = [...listDialogNode.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), [tabindex="0"]')]
            .filter(node => node.getClientRects().length);
          const edge = event.shiftKey ? focusable[0] : focusable.at(-1);
          if (document.activeElement === edge) {
            event.preventDefault(); (event.shiftKey ? focusable.at(-1) : focusable[0]).focus();
          }
        }
        if (event.key === "Enter" && event.target.id === "miniV2ListName" && !event.isComposing) {
          event.preventDefault(); saveListChoice();
        }
      });
      root.addEventListener("click", handleRootClick);
      root.addEventListener("input", handleRootInput);
      root.addEventListener("change", handleRootChange);
      root.addEventListener("keydown", handleRootKeydown);
      detailHeaderTagsNode.addEventListener("pointerover", event => {
        const button = event.target.closest(".mini-v2-detail-status");
        if (button && !button.contains(event.relatedTarget) && event.pointerType !== "touch") showDetailStatusTip();
      });
      detailHeaderTagsNode.addEventListener("pointerout", scheduleDetailStatusTipHide);
      detailHeaderTagsNode.addEventListener("focusin", event => {
        if (event.target.matches(".mini-v2-detail-status")) showDetailStatusTip();
      });
      detailHeaderTagsNode.addEventListener("focusout", scheduleDetailStatusTipHide);
      detailStatusTipNode.addEventListener("pointerenter", () => clearTimeout(detailStatusTipHideTimer));
      detailStatusTipNode.addEventListener("pointerleave", scheduleDetailStatusTipHide);
      document.addEventListener("scroll", hideDetailStatusTip, true);
      facetPopoverNode.addEventListener("transitionend", handleFacetPopoverTransitionEnd);
      const facetLayoutObserver = new ResizeObserver(syncFacetPopoverMetrics);
      facetLayoutObserver.observe(facetPopoverBodyNode);
      facetLayoutObserver.observe(facetShellNode);
      facetLayoutObserver.observe(workspaceNode);
      new ResizeObserver(() => scheduleDetailMarqueeSync(80)).observe(detailHeaderTitleNode);
      detailPanelNode.addEventListener("transitionend", handleDetailPanelTransitionEnd);
      document.addEventListener("click", handleDocumentClick);
      document.addEventListener("pointerdown", handleDocumentPointerDown, true);
    }

    function enrichGroup(group) {
      const copies = group.copies.map(copy => ({ ...copy }));
      const available = copies.filter(copy => copy.currentLocation === copy.home).length;
      const total = copies.length;
      const checkedOut = total - available;
      const needsStickers = copies.some(copy => getStickerStatus(copy.sticker) === "Missing");
      const sharedSearchText = [
        group.name,
        group.rootId,
        group.home,
        group.size,
        group.creatureType,
        group.sex,
        group.race,
        group.role,
        group.set,
        group.setNumber,
        group.notes
      ].join(" ").toLowerCase();
      const searchText = [sharedSearchText]
        .concat(copies.map(copy => [copy.id, copy.sticker, copy.currentLocation, copy.note || ""].join(" ")))
        .join(" ")
        .toLowerCase();

      return { ...group, copies, available, total, checkedOut, needsStickers, sharedSearchText, searchText };
    }

    function getPaintValue(value) {
      if (value === true || value === "true") return "Painted";
      if (value === false || value === "false") return "Unpainted";
      const status = String(value ?? "").trim();
      return PAINT_OPTIONS.includes(status) ? status : "";
    }

    function getStickerStatus(value) {
      return String(value ?? "").trim() ? "Assigned" : "Missing";
    }

    function renderAll(options = {}) {
      releaseSaveLocks();
      const resumedEditor = !state.editor && state.editorDrafts[state.selectedRootId];
      if (resumedEditor) {
        state.editor = resumedEditor;
        delete state.editorDrafts[state.selectedRootId];
        if (!state.selectedCopyId) state.selectedCopyId = state.editor.selectedCopyId || "";
      }
      const rows = getBrowseRows();
      if (!options.keepSelection) ensureSelectionVisibility(rows);
      const selectedGroup = getSelectedGroup();
      root.classList.toggle("mini-v2-has-detail", !!selectedGroup);
      renderSummaryLane();
      renderListHeader(rows.length);
      renderLocationFilter();
      renderFacetBar();
      renderFacetFlyout();
      renderTable(rows);
      if (!options.keepDetail) renderDetail();
      syncDetailCopyTarget();
      syncSaveUI();
      return !!resumedEditor;
    }

    function renderAllPreservingScroll(existingState, options = {}) {
      const scrollState = existingState || captureScrollState();
      const restoreFocus = captureFocus();
      const resumedEditor = renderAll(options);
      if (resumedEditor && state.editor.editScroll) {
        scrollState.detailTop = state.editor.editScroll.detailTop;
        scrollState.detailTableLeft = state.editor.editScroll.detailTableLeft;
      }
      restoreFocus();
      restoreScrollState(scrollState);
      return scrollState;
    }

    function captureFocus() {
      const active = document.activeElement;
      if (!active || !root.contains(active)) return () => {};
      const identity = Array.from(active.attributes).filter(attribute =>
        attribute.name === "id" || attribute.name.startsWith("data-")
      );
      return () => {
        if (active.isConnected && !active.disabled && active.getClientRects().length) return;
        const replacement = identity.length && Array.from(root.querySelectorAll(active.tagName))
          .find(node => identity.every(attribute => node.getAttribute(attribute.name) === attribute.value));
        if (replacement && !replacement.disabled && replacement.getClientRects().length) {
          replacement.focus({ preventScroll: true });
        } else {
          (getSelectedGroup() ? detailCloseButtonNode : searchInputNode).focus({ preventScroll: true });
        }
      };
    }

    function activeListValues(key) {
      return listManager.catalogs[key].filter(choice => !choice.hidden).map(choice => choice.value);
    }

    function syncListChoices() {
      LIST_DEFINITIONS.filter(definition => definition.kind).forEach(definition => {
        FILTER_OPTIONS[definition.kind] = activeListValues(definition.key).filter(value => value !== UNSPECIFIED_VALUE);
      });
      state.sets = activeListValues("set").sort(compareText);
      // Retired values remain valid for existing assignments and browse filters.
      state.locations = listManager.catalogs.locations.map(choice => choice.value);
      state.homeLocations = listManager.catalogs.locations.filter(choice => !choice.hidden && choice.home).map(choice => choice.value);
      PAINT_OPTIONS.splice(0, PAINT_OPTIONS.length, ...listManager.catalogs.paint.map(choice => choice.value));
      // Keep the editor's live controls, refreshing choices without replacing its draft.
      if (state.editor) {
        const options = { ...Object.fromEntries(LIST_DEFINITIONS.filter(item => item.kind).map(item => [item.key, FILTER_OPTIONS[item.kind]])),
          set: state.sets, paint: PAINT_OPTIONS, home: state.homeLocations };
        Object.entries(options).forEach(([key, values]) => {
          const select = detailContentNode.querySelector(`select[data-edit-field="${key}"]`);
          if (select) select.innerHTML = renderEditOptions(key, values);
        });
        detailContentNode.querySelectorAll("select[data-copy-id]").forEach(select => {
          const copy = editorBaseCopies().find(item => item.id === select.dataset.copyId);
          if (copy) { const draft = editorCopy(copy); select.innerHTML = renderCopyLocationOptions(draft, draft.currentLocation); }
        });
      } else detailContentNode.querySelector(".mini-v2-editor")?.removeAttribute("data-editor-root");
    }

    function listEditors() {
      return [state.editor, ...Object.values(state.editorDrafts), ...state.deletedGroups.map(record => record.editor)].filter(Boolean);
    }

    function listObjectUses(object, key, value) {
      return key === "locations" ? object.home === value || object.currentLocation === value
        : (key === "paint" ? getPaintValue(object.paint) : object[key]) === value;
    }

    function listGroupUses(group, key, value) {
      return listObjectUses(group, key, value) || (key === "locations" && group.copies.some(copy => listObjectUses(copy, key, value)));
    }

    function listDraftUses(editor, key, value) {
      const initial = JSON.parse(editor.initial);
      return [editor, initial].some(draft => listObjectUses(draft.fields, key, value)
        || (key === "locations" && Object.values(draft.copies).some(copy => listObjectUses(copy, key, value))));
    }

    function listChoiceUsage(key, value) {
      const groups = state.groups.filter(group => listGroupUses(group, key, value)).length;
      const drafts = listEditors().some(editor => listDraftUses(editor, key, value));
      const history = state.deletedGroups.some(record => listGroupUses(record.group, key, value));
      const pending = key === "locations" && Object.values(state.draftLocations).includes(value);
      return { used: !!(groups || drafts || history || pending), label: groups ? `Used by ${groups} ${groups === 1 ? "group" : "groups"}`
        : drafts || pending ? "Used in a draft" : history ? "Kept for Undo" : "Unused" };
    }

    function listHomeInUse(value) {
      return [...state.groups, ...Object.values(state.newGroups), ...state.deletedGroups.map(record => record.group)]
        .some(group => group.home === value) || listEditors().some(editor => editor.fields.home === value || JSON.parse(editor.initial).fields.home === value);
    }

    function renameListReferences(key, before, after) {
      const patch = object => {
        if (key === "locations") {
          if (object.home === before) object.home = after;
          if (object.currentLocation === before) object.currentLocation = after;
        } else if (listObjectUses(object, key, before)) object[key] = after;
      };
      const patchGroup = group => {
        patch(group); group.copies.forEach(patch); return enrichGroup(group);
      };
      state.groups = state.groups.map(patchGroup);
      Object.keys(state.newGroups).forEach(id => { state.newGroups[id] = patchGroup(state.newGroups[id]); });
      state.deletedGroups.forEach(record => { record.group = patchGroup(record.group); });
      // Relabel both draft and baseline so a global rename is never a miniature edit.
      listEditors().forEach(editor => {
        const initial = JSON.parse(editor.initial);
        [editor, initial].forEach(draft => {
          patch(draft.fields); Object.values(draft.copies).forEach(patch); draft.addedCopies.forEach(patch);
        });
        editor.initial = JSON.stringify(initial);
      });
      if (key === "locations") {
        [state.draftLocations, ...state.deletedGroups.map(record => record.draftLocations)].forEach(locations => {
          Object.keys(locations).forEach(id => { if (locations[id] === before) locations[id] = after; });
        });
      }
      const browseContexts = [state, state.pendingReturn];
      for (const context of browseContexts.slice()) {
        for (let previous = context?.previousBrowse; previous; previous = previous.previousBrowse) browseContexts.push(previous);
      }
      [...new Set(browseContexts)].filter(Boolean).forEach(browse => {
        if (key === "locations" && browse.locationFilter === before) browse.locationFilter = after;
        if (key === "set" && browse.filtersApplied.set === before) browse.filtersApplied.set = after;
        const kind = LIST_DEFINITIONS.find(definition => definition.key === key).kind || (key === "paint" ? "paints" : "");
        if (kind) browse.filtersApplied[kind] = browse.filtersApplied[kind].map(value => value === before ? after : value);
      });
    }

    function openListManager() {
      hideDetailStatusTip();
      if (listDialogNode.open) return;
      state.summaryPanel = ""; state.openFacetKey = ""; state.locationMenuOpen = false;
      renderSummaryLane(); renderFacetBar(); renderFacetFlyout(); renderLocationFilter();
      const html = document.documentElement;
      listManager.pageStyles = { overflow: html.style.overflow, gutter: html.style.scrollbarGutter, x: window.scrollX, y: window.scrollY };
      if (window.innerWidth > html.clientWidth) html.style.scrollbarGutter = "stable";
      html.style.overflow = "hidden";
      renderListManager();
      listDialogNode.showModal();
      listDialogNode.querySelector('[data-list-action="close"]').focus({ preventScroll: true });
    }

    function closeListManager() {
      if (!listDialogNode.open) return;
      listDialogNode.close();
      const saved = listManager.pageStyles;
      document.documentElement.style.overflow = saved.overflow;
      document.documentElement.style.scrollbarGutter = saved.gutter;
      renderAllPreservingScroll(null, { keepSelection: true });
      window.scrollTo(saved.x, saved.y);
      const trigger = [...root.querySelectorAll('[data-action="open-lists"]')].find(button => button.getClientRects().length);
      (trigger || root.querySelector('[data-summary-panel="collection"]')).focus({ preventScroll: true });
    }

    function renderListManager() {
      releaseSaveLocks();
      const definition = LIST_DEFINITIONS.find(item => item.key === listManager.key);
      listDialogNode.querySelector(".mini-v2-lists-nav").innerHTML = LIST_DEFINITIONS.map(item =>
        `<button type="button" data-list-key="${item.key}" aria-current="${item.key === definition.key ? "true" : "false"}">${item.label}</button>`).join("");
      document.getElementById("miniV2ListsPicker").innerHTML = LIST_DEFINITIONS.map(item =>
        `<option value="${item.key}"${item.key === definition.key ? " selected" : ""}>${item.label}</option>`).join("");
      document.getElementById("miniV2ListsHeading").textContent = definition.title;
      const count = activeListValues(definition.key).length;
      document.getElementById("miniV2ListsCount").textContent = `${count} ${count === 1 ? "choice" : "choices"}`;
      document.getElementById("miniV2ListsSearch").value = listManager.query;
      renderListChoiceForm(); renderListChoiceRows(); renderListNotice();
      syncSaveUI();
    }

    function renderListChoiceRows() {
      const key = listManager.key;
      const query = listManager.query.trim().toLowerCase();
      const choices = listManager.catalogs[key].filter(choice => !choice.hidden && choice.value.toLowerCase().includes(query));
      document.getElementById("miniV2ListsRows").innerHTML = choices.length ? choices.map(choice => {
        const usage = listChoiceUsage(key, choice.value);
        return `<div class="mini-v2-list-choice" data-list-choice="${choice.id}">
          <div class="mini-v2-list-choice-text"><span class="mini-v2-list-choice-name">${escapeHtml(choice.value)}</span>
            <span class="mini-v2-list-choice-meta">${choice.locked ? "Built-in choice" : usage.label}</span>
            ${key === "locations" ? `<span class="mini-v2-list-choice-context">${choice.home ? "Home + current location" : "Current location only"}</span>` : ""}</div>
          <div class="mini-v2-list-choice-actions">${choice.locked ? '<span class="mini-v2-list-protected">Built-in</span>' : `
            <button type="button" data-list-action="rename" data-choice-id="${choice.id}" aria-label="${key === "locations" ? "Edit" : "Rename"} ${escapeHtml(choice.value)}"${listManager.forms[key] ? " disabled" : ""}>${key === "locations" ? "Edit" : "Rename"}</button>
            <button type="button" data-list-action="remove" data-choice-id="${choice.id}" aria-label="Remove ${escapeHtml(choice.value)}"${listManager.forms[key] ? " disabled" : ""}>Remove</button>`}</div></div>`;
      }).join("") : '<p class="mini-v2-list-empty">No matching choices. Use Add to create one.</p>';
    }

    function listFormError() {
      const form = listManager.forms[listManager.key];
      if (!form || form.mode === "remove") return "";
      const name = form.name.trim();
      if (!name) return "Enter a name.";
      const duplicate = listManager.catalogs[listManager.key].find(choice => choice.id !== form.id && choice.value.toLowerCase() === name.toLowerCase());
      if (duplicate && !duplicate.hidden) return "This choice already exists.";
      const reserved = ["n/a", UNSPECIFIED_VALUE.toLowerCase(),
        ...(listManager.key === "locations" ? ["__return_home__", "all"] : []),
        ...(listManager.key === "paint" ? ["true", "false"] : [])];
      if (reserved.includes(name.toLowerCase())) return "This name is reserved by the app.";
      if (duplicate?.hidden && form.id) return "This choice was removed. Restore it using Add instead of renaming another choice to it.";
      return "";
    }

    function renderListChoiceForm() {
      const key = listManager.key, form = listManager.forms[key];
      const node = document.getElementById("miniV2ListsForm");
      listDialogNode.querySelector('[data-list-action="add"]').disabled = !!form;
      node.hidden = !form;
      if (!form) { node.innerHTML = ""; return; }
      const definition = LIST_DEFINITIONS.find(item => item.key === key);
      const choice = listManager.catalogs[key].find(item => item.id === form.id);
      const used = choice && listChoiceUsage(key, choice.value).used;
      const removing = form.mode === "remove";
      node.innerHTML = `<div class="mini-v2-list-form">
        <label class="mini-v2-field-label"${removing ? "" : ' for="miniV2ListName"'}>${removing ? "Remove choice" : `${choice ? "Edit" : "New"} ${definition.label === "Locations" ? "location" : definition.label}`}</label>
        ${removing ? `<p>Remove ${escapeHtml(choice.value)} from future selections?</p><p class="mini-v2-list-form-help">${used ? "Existing miniatures and drafts keep this value. It remains filterable while used. You can undo this removal." : "This choice is unused. You can undo this removal."}</p>` : `
          <input id="miniV2ListName" class="mini-v2-lists-input" value="${escapeHtml(form.name)}" aria-describedby="miniV2ListFormError" autocomplete="off">
          ${key === "locations" ? `<label class="mini-v2-list-home"><input id="miniV2ListHome" type="checkbox"${form.home ? " checked" : ""}${choice?.home && listHomeInUse(choice.value) ? " disabled" : ""}> Also offer as a Home location</label>
            ${choice?.home && listHomeInUse(choice.value) ? '<p class="mini-v2-list-form-help">Home is in use. Change those assignments before turning this off.</p>' : ""}` : ""}
          <p id="miniV2ListFormError" class="mini-v2-list-form-error" role="status"></p>`}
        <div class="mini-v2-list-form-actions">
          <button class="button mini-v2-copy-btn" type="button" data-list-action="cancel">Cancel</button>
          <button class="button mini-v2-copy-btn ${removing ? "mini-v2-secondary" : "mini-v2-primary"}" type="button" data-list-action="save">${removing ? "Remove choice" : choice ? "Save name" : "Add"}</button>
        </div></div>`;
      syncListForm();
    }

    function syncListForm() {
      releaseSaveLocks();
      const form = listManager.forms[listManager.key];
      if (!form || form.mode === "remove") return;
      const error = listFormError();
      const message = document.getElementById("miniV2ListFormError");
      message.textContent = form.name.trim() ? error : "";
      const duplicate = listManager.catalogs[listManager.key].find(choice => choice.id !== form.id && choice.value.toLowerCase() === form.name.trim().toLowerCase());
      const button = listDialogNode.querySelector('[data-list-action="save"]');
      button.disabled = !!error;
      button.textContent = duplicate?.hidden ? "Restore choice" : form.id ? "Save changes" : "Add";
      button.title = error;
      document.getElementById("miniV2ListName").setAttribute("aria-invalid", String(!!error && !!form.name.trim()));
      syncSaveUI();
    }

    function renderListNotice() {
      listManager.undo = listManager.undo.filter(record =>
        listManager.catalogs[record.key].some(choice => choice.id === record.id && choice.hidden));
      document.getElementById("miniV2ListsNotice").textContent = listManager.notice || "Shared choices for your miniature dropdowns.";
      listDialogNode.querySelector('[data-list-action="undo"]').hidden = !listManager.undo.length;
    }

    function saveListChoice() {
      const key = listManager.key, form = listManager.forms[key];
      if (!form || listFormError() || saveJob) return;
      const choice = listManager.catalogs[key].find(item => item.id === form.id);
      if (choice?.locked) return;
      let target = choice, value;
      if (form.mode === "remove") {
        if (!choice || choice.hidden) return;
        value = { ...choice, hidden: true };
      } else {
        const name = form.name.trim();
        const duplicate = listManager.catalogs[key].find(item => item.id !== form.id && item.value.toLowerCase() === name.toLowerCase());
        if (duplicate?.hidden) {
          if (choice) { listManager.notice = "Restore the removed choice using Add before making this rename."; renderListNotice(); return; }
          target = duplicate; value = { ...duplicate, hidden: false, home: duplicate.home || !!form.home };
        } else if (choice) {
          if (key === "locations" && choice.home && !form.home && listHomeInUse(choice.value)) return;
          value = { ...choice, value: name, home: !!form.home };
        } else {
          value = { id: `choice-${listManager.nextId++}`, value: name, home: !!form.home, hidden: false, locked: false };
        }
      }
      startSave([{ table: `lists:${key}`, id: value.id, before: target || null, value }], {
        listKey: key, action: "save", apply: records => applyListSave(key, records[0].value, true)
      });
    }

    function applyListSave(key, value, clearForm = false) {
      const previous = listManager.catalogs[key].find(choice => choice.id === value.id);
      if (previous && previous.value !== value.value) renameListReferences(key, previous.value, value.value);
      if (value.hidden && !previous?.hidden) listManager.undo.push({ key, id: value.id });
      listManager.catalogs[key] = previous ? listManager.catalogs[key].map(choice => choice.id === value.id ? value : choice)
        : listManager.catalogs[key].concat(value);
      listManager.notice = value.hidden ? `Removed ${value.value} from future choices.` : `Saved ${value.value}. Available in your dropdowns.`;
      if (clearForm) delete listManager.forms[key];
      listManager.query = ""; syncListChoices();
    }

    function handleListManagerClick(event) {
      event.stopPropagation();
      const feedback = event.target.closest('[data-save-action]');
      if (feedback) { if (!feedback.disabled) handleSaveAction(feedback.dataset.saveAction); return; }
      const category = event.target.closest("button[data-list-key]");
      if (category) {
        listManager.key = category.dataset.listKey; listManager.query = "";
        renderListManager();
        listDialogNode.querySelector(`[data-list-key="${listManager.key}"]`).focus();
        return;
      }
      const button = event.target.closest("button[data-list-action]");
      if (!button || button.disabled) return;
      const action = button.dataset.listAction, key = listManager.key;
      if (saveJob && ["save", "undo"].includes(action)) { handleSaveAction("retry"); return; }
      if (action === "close") { closeListManager(); return; }
      if (action === "save") { saveListChoice(); return; }
      if (action === "undo") {
        let record, choice;
        while (listManager.undo.length && !choice) {
          record = listManager.undo.at(-1);
          choice = listManager.catalogs[record.key].find(item => item.id === record.id && item.hidden);
          if (!choice) listManager.undo.pop();
        }
        if (!choice) { renderListNotice(); return; }
        startSave([{ table: `lists:${record.key}`, id: choice.id, before: choice, value: { ...choice, hidden: false } }], {
          listKey: record.key, action: "undo", apply: records => applyListSave(record.key, records[0].value)
        });
        return;
      }
      if (action === "cancel") delete listManager.forms[key];
      else if (action === "add") listManager.forms[key] = listManager.forms[key] || { mode: "add", name: "", home: false };
      else {
        const choice = listManager.catalogs[key].find(item => item.id === button.dataset.choiceId);
        if (!choice || choice.locked) return;
        listManager.forms[key] = { mode: action, id: choice.id, name: choice.value, home: choice.home };
      }
      renderListChoiceForm();
      renderListChoiceRows();
      syncSaveUI();
      (document.getElementById("miniV2ListName") || listDialogNode.querySelector(`[data-list-action="${action === "cancel" ? "add" : "cancel"}"]`)).focus({ preventScroll: true });
    }

    function handleListManagerInput(event) {
      event.stopPropagation();
      if (event.target.disabled) return;
      if (handleSaveInput(event.target)) return;
      const node = event.target;
      if (node.id === "miniV2ListsSearch") { listManager.query = node.value; renderListChoiceRows(); return; }
      if (node.id === "miniV2ListsPicker") {
        listManager.key = node.value; listManager.query = ""; renderListManager();
        document.getElementById("miniV2ListsPicker").focus(); return;
      }
      const form = listManager.forms[listManager.key];
      if (!form) return;
      if (node.id === "miniV2ListName") form.name = node.value;
      if (node.id === "miniV2ListHome") form.home = node.checked;
      syncListForm();
    }

    function saveGroupRecord(group) {
      return { rootId: group.rootId, originalOrder: group.originalOrder,
        ...Object.fromEntries(EDIT_FIELDS.map(field => [field, group[field] ?? ""])),
        copies: Object.fromEntries(group.copies.map(copy => [copy.id, {
          id: copy.id, miniNumber: copy.miniNumber, sticker: copy.sticker || "", note: copy.note || "", currentLocation: copy.currentLocation
        }])) };
    }

    function savedRecordGroup(value) {
      return enrichGroup({ ...value, copies: Object.values(value.copies).map(copy => ({ ...copy, rootId: value.rootId, home: value.home })) });
    }

    function groupSaveTarget(group, value) {
      const existing = state.groups.find(item => item.rootId === group.rootId);
      return { table: "groups", id: group.rootId, before: existing ? saveGroupRecord(existing) : null,
        value: value ? saveGroupRecord(value) : null };
    }

    function startSave(targets, options) {
      if (saveJob) return;
      saveJob = { ...options, request: MiniSaveFlow.clone({ requestId: newMockId("request"), targets }),
        status: "saving", error: null };
      saveTransport.setOutcome(nextSaveOutcome); nextSaveOutcome = "success";
      sendSave();
    }

    async function sendSave() {
      const job = saveJob;
      if (!job || job.sending) return;
      job.sending = true; job.status = "saving";
      syncSaveUI();
      let response, timer;
      try {
        response = await Promise.race([saveTransport.send(job.request), new Promise(resolve => {
          timer = setTimeout(() => resolve({ ok: false, code: "SAVE_UNCERTAIN", message: "Save is taking too long to confirm. Your draft is safe. Retry to check the same save." }), 15000);
        })]);
      }
      catch (_) { response = { ok: false, code: "SAVE_UNCERTAIN", message: "Save wasn't confirmed. Your draft is safe. Retry to check the same save." }; }
      finally { clearTimeout(timer); }
      if (response?.ok && (!Array.isArray(response.result?.records) || response.result.records.length !== job.request.targets.length
        || response.result.records.some((record, index) => !record || record.value === undefined || record.table !== job.request.targets[index].table || record.id !== job.request.targets[index].id))) {
        response = { ok: false, code: "SAVE_UNCERTAIN", message: "Save wasn't confirmed. Your draft is safe. Retry to check the same save." };
      }
      job.sending = false;
      if (!response?.ok) {
        job.status = "error";
        job.error = response || { code: "SAVE_UNCERTAIN", message: "Save wasn't confirmed. Retry to check it safely." };
        syncSaveUI();
        if (job.listKey && listDialogNode.open && job.listKey === listManager.key) listDialogNode.querySelector('[data-save-notice]')?.scrollIntoView({ block: "nearest" });
        else if (job.request.targets.some(target => target.table === "groups" && target.id === state.selectedRootId)) detailContentNode.querySelector('[data-save-notice]')?.scrollIntoView({ block: "nearest" });
        return;
      }
      // A successful save clears its submitted draft only after acknowledgment, even if its sidebar was closed.
      const restoreFocus = captureFocus();
      releaseSaveLocks(); saveJob = null;
      job.apply(response.result.records);
      renderAllPreservingScroll(null, { keepSelection: true });
      if (listDialogNode.open) renderListManager();
      syncSaveUI();
      restoreFocus();
      if (job.listKey && listDialogNode.open && job.listKey === listManager.key) {
        (document.getElementById("miniV2ListName") || listDialogNode.querySelector('[data-list-action="add"]'))?.focus({ preventScroll: true });
      }
    }

    function applyMiniSave(records, entries, kind = "save", restoreRecord = null) {
      const scroll = captureScrollState();
      records.forEach(record => {
        const entry = entries.find(item => item.group.rootId === record.id);
        const selected = state.selectedRootId === record.id;
        if (kind === "delete" && !record.value) state.deletedGroups.push({ group: entry.group, editor: entry.editor,
          selectedCopyId: entry.selectedCopyId, draftLocations: entry.locations });
        state.groups = state.groups.filter(group => group.rootId !== record.id);
        if (record.value) state.groups.push(savedRecordGroup(record.value));
        entry.group.copies.forEach(copy => { delete state.draftLocations[copy.id]; });
        delete state.editorDrafts[record.id]; delete state.newGroups[record.id];
        if (state.editor?.rootId === record.id) {
          state.editor = null;
          if (entry.editor?.readScroll) Object.assign(scroll, { detailTop: entry.editor.readScroll.detailTop, detailTableLeft: entry.editor.readScroll.detailTableLeft });
        }
        if (kind !== "discard" && entry.editor && record.value) rememberNextStickerStart(entry.editor);
        if (selected && !record.value) { state.selectedRootId = ""; state.selectedCopyId = ""; }
        if (selected && record.value && !record.value.copies[state.selectedCopyId]) {
          state.selectedCopyId = state.browseMode === "individuals" ? Object.keys(record.value.copies)[0] || "" : "";
        }
      });
      state.groups.sort((a, b) => a.originalOrder - b.originalOrder);
      if (restoreRecord && records[0].value) {
        state.deletedGroups = state.deletedGroups.filter(record => record !== restoreRecord);
        Object.assign(state.draftLocations, restoreRecord.draftLocations);
        if (restoreRecord.editor) state.editorDrafts[restoreRecord.group.rootId] = restoreRecord.editor;
      }
      state.pendingSaved = kind !== "discard";
      state.browseScroll = { groups: null, individuals: null };
      renderAllPreservingScroll(scroll, { keepSelection: true });
    }

    function releaseSaveLocks() {
      if (!root) return;
      root.querySelectorAll('[data-save-disabled]').forEach(node => {
        node.disabled = node.dataset.saveDisabled === "true"; delete node.dataset.saveDisabled;
      });
      root.querySelectorAll('[data-save-label]').forEach(node => {
        node.innerHTML = node.dataset.saveLabel; delete node.dataset.saveLabel;
      });
    }

    function saveMessageMarkup(place) {
      if (!saveJob) return "";
      const job = saveJob, error = job.error, pending = job.status === "saving";
      let markup = `<p role="status">${pending ? "Saving..." : escapeHtml(error.message)}</p>`;
      if (pending) return markup;
      if (error.code === "STALE") {
        const changed = staleSaveTargets(job);
        const bulk = job.request.targets.length > 1;
        const deleting = job.action === "confirm-delete-group";
        const prompt = deleting ? "Delete this group anyway?" : bulk ? "Save all your changes anyway?" : "Save your changes anyway?";
        const names = changed.map(({ target }) => target.before?.name || target.before?.value || target.value?.name || "New entry");
        return `<p role="status">${changed.length === 1 ? "This entry changed" : `${changed.length} entries changed`} since you opened ${changed.length === 1 ? "it" : "them"}.<br>${prompt}</p>
          ${bulk ? `<p>Discard only affects: ${escapeHtml(names.join(", "))}.</p>` : ""}
          <button type="button" class="button mini-v2-copy-btn mini-v2-primary" data-save-action="overwrite">${deleting ? "Delete Anyway" : "Save Anyway"}</button>
          <button type="button" class="button mini-v2-copy-btn" data-save-action="discard">Discard My Changes</button>`;
      } else if (place === "summary" && !["save-all-pending", "undo-delete-group"].includes(job.action)) {
        markup += '<button type="button" class="button mini-v2-copy-btn mini-v2-primary" data-save-action="retry">Retry save</button>';
      }
      if (!["SAVE_UNCERTAIN", "REQUEST_REUSED"].includes(error.code)) markup += '<button type="button" class="button mini-v2-copy-btn" data-save-action="edit">Keep Editing</button>';
      return markup;
    }

    function syncSaveUI() {
      if (!root) return;
      releaseSaveLocks();
      root.dataset.saveState = saveJob?.status || "idle";
      const job = saveJob;
      const lock = node => { if (!node || Object.hasOwn(node.dataset, "saveDisabled")) return; node.dataset.saveDisabled = String(node.disabled); node.disabled = true; };
      const label = (node, text) => { node.dataset.saveLabel = node.innerHTML; node.textContent = text; };
      const affected = job?.request.targets.some(target => target.table === "groups" && target.id === state.selectedRootId);
      if (job) {
        root.querySelectorAll('[data-action="save-edit"], [data-action="save-changes"], [data-action="save-all-pending"], [data-action="confirm-delete-group"], [data-action="undo-delete-group"], [data-list-action="save"], [data-list-action="undo"]').forEach(lock);
        if (affected) {
          detailPanelNode.querySelectorAll('input, select, textarea, [data-action="discard-edit"], [data-action="reset-changes"], [data-action="set-all-home"], [data-action="edit-all-home"], [data-action="add-copy"], [data-action="remove-copy"], [data-action="undo-remove-copy"], [data-action="apply-next-sticker"], [data-action="delete-group"]').forEach(lock);
        }
        if (job.listKey === listManager.key) listDialogNode.querySelectorAll('#miniV2ListName, #miniV2ListHome, [data-list-action="cancel"]').forEach(lock);
        const primary = job.listKey ? listDialogNode.querySelector(`[data-list-action="${job.action}"]`)
          : job.action === "save-all-pending" || job.action === "undo-delete-group" ? root.querySelector(`[data-action="${job.action}"]`)
            : affected && detailPanelNode.querySelector(`[data-action="${job.action}"]`);
        if (primary && (!job.listKey || job.listKey === listManager.key)) {
          // A stale save is resolved only through the explicit choices in its notice.
          if (job.status === "saving" || job.error.code !== "STALE") {
            label(primary, job.status === "saving" ? "Saving..." : "Retry");
            primary.disabled = job.status === "saving";
          }
        }
      }
      const hosts = [[detailContentNode, "detail", affected], [document.getElementById("miniV2ChangesMenu"), "summary", !!job],
        [document.getElementById("miniV2ListsForm"), "list", !!job?.listKey && job.listKey === listManager.key]];
      hosts.forEach(([host, place, show]) => {
        if (!host) return;
        let node = host.querySelector(`:scope > [data-save-notice="${place}"]`);
        if (!show) { node?.remove(); return; }
        if (!node) { node = document.createElement("div"); node.dataset.saveNotice = place; node.className = "mini-v2-save-notice"; host.appendChild(node); }
        const markup = saveMessageMarkup(place);
        if (node.innerHTML !== markup) node.innerHTML = markup;
      });
    }

    function handleSaveAction(action) {
      if (!saveJob || saveJob.sending) return;
      if (action === "retry") { if (saveJob.error.code !== "STALE") sendSave(); return; }
      if (action === "edit") {
        if (["SAVE_UNCERTAIN", "REQUEST_REUSED", "STALE"].includes(saveJob.error.code)) return;
        releaseSaveLocks(); saveJob = null; renderAllPreservingScroll(null, { keepSelection: true });
        if (listDialogNode.open) renderListManager();
        return;
      }
      if (action === "discard" && saveJob.error?.code === "STALE") { discardStaleChanges(); return; }
      if (action === "overwrite" && saveJob.error?.code === "STALE") {
        const targets = saveJob.request.targets.map((target, index) => {
          const latest = saveJob.error.latest[index].value;
          return { ...target, before: latest, value: MiniSaveFlow.overwriteEdits(target.before, target.value, latest) };
        });
        saveJob.request = MiniSaveFlow.clone({ requestId: newMockId("request"), targets });
        sendSave();
      }
    }

    function staleSaveTargets(job) {
      return job.request.targets.flatMap((target, index) => MiniSaveFlow.equal(target.before, job.error.latest[index].value)
        ? [] : [{ target, latest: job.error.latest[index] }]);
    }

    function discardStaleChanges() {
      const changed = staleSaveTargets(saveJob);
      releaseSaveLocks(); saveJob = null;
      const groups = changed.filter(({ target }) => target.table === "groups");
      if (groups.length) {
        const entries = groups.map(({ target }) => ({
          group: state.groups.find(group => group.rootId === target.id) || state.newGroups[target.id] || savedRecordGroup(target.before || target.value),
          editor: state.editor?.rootId === target.id ? state.editor : state.editorDrafts[target.id]
        }));
        // Explicit discard adopts saved records without recording a save, deletion, or sticker allocation.
        applyMiniSave(groups.map(({ latest }) => latest), entries, "discard");
      }
      changed.filter(({ target }) => target.table.startsWith("lists:")).forEach(({ target, latest }) => {
        const key = target.table.slice(6), value = latest.value;
        const previous = listManager.catalogs[key].find(choice => choice.id === target.id);
        if (previous && value && previous.value !== value.value) renameListReferences(key, previous.value, value.value);
        listManager.catalogs[key] = value
          ? previous ? listManager.catalogs[key].map(choice => choice.id === target.id ? value : choice) : listManager.catalogs[key].concat(value)
          : listManager.catalogs[key].filter(choice => choice.id !== target.id);
        delete listManager.forms[key];
        listManager.notice = "";
        syncListChoices();
      });
      renderAllPreservingScroll(null, { keepSelection: true });
      if (listDialogNode.open) renderListManager();
      syncSaveUI();
    }

    function handleSaveInput(node) {
      if (node.matches('[data-save-outcome]')) {
        nextSaveOutcome = node.value; return true;
      }
      return false;
    }

    function pendingEntries() {
      return state.groups.concat(Object.values(state.newGroups)).flatMap(group => {
        const editor = (state.editor?.rootId === group.rootId ? state.editor : state.editorDrafts[group.rootId]) || null;
        return editorHasChanges(editor) || group.copies.some(isDirty) ? [{ group, editor }] : [];
      });
    }

    function editedGroup(group, editor) {
      const paintChanged = editor.fields.paint !== JSON.parse(editor.initial).fields.paint;
      const fields = { ...editor.fields, name: editor.fields.name.trim(),
        setNumber: hasNamedSet(editor.fields) ? editor.fields.setNumber.trim() : "",
        paint: paintChanged ? editor.fields.paint || null : group.paint ?? null };
      return enrichGroup({ ...group, ...fields, copies: retainedEditorCopies(group, editor).map(copy => {
        const { followsHome, ...value } = editorCopy(copy, editor, group);
        return { ...value, sticker: (value.sticker || "").trim() };
      }) });
    }

    function pendingGroup(entry) {
      return entry.editor ? editedGroup(entry.group, entry.editor)
        : enrichGroup({ ...entry.group, copies: entry.group.copies.map(copy => ({ ...copy, currentLocation: getEffectiveLocation(copy) })) });
    }

    function preparePendingBatch() {
      const entries = pendingEntries();
      const candidates = new Map(entries.map(entry => [entry.group.rootId, pendingGroup(entry)]));
      const issues = new Map();
      entries.forEach(({ group, editor }) => {
        const error = editor && getEditorValidationError(editor, group, { skipStickerCheck: true });
        if (error) issues.set(group.rootId, { rootId: group.rootId, ...error });
        candidates.get(group.rootId).copies.forEach(copy => {
          const original = group.copies.find(item => item.id === copy.id);
          if ((!original || original.currentLocation !== copy.currentLocation) && !state.locations.includes(copy.currentLocation)) {
            if (!issues.has(group.rootId)) issues.set(group.rootId, { rootId: group.rootId,
              message: "Choose a current location for each copy before saving.", selector: `select[data-copy-id="${copy.id}"]` });
          }
        });
      });
      const groups = state.groups.map(group => candidates.get(group.rootId) || group)
        .concat(entries.filter(entry => entry.editor?.isNew).map(entry => candidates.get(entry.group.rootId)));
      // Validate the final collection, not a sequence of partial saves. This also
      // permits deliberate sticker swaps between groups in the same batch.
      const stickers = new Map();
      groups.forEach(group => group.copies.forEach(copy => {
        const sticker = String(copy.sticker || "").trim().toUpperCase();
        if (!sticker || sticker === "N/A") return;
        const other = stickers.get(sticker);
        if (other) {
          [{ group, copy }, other].forEach(item => {
            if (candidates.has(item.group.rootId) && !issues.has(item.group.rootId)) {
              issues.set(item.group.rootId, { rootId: item.group.rootId,
                message: `Sticker ${sticker} is assigned more than once. Change one assignment before saving.`,
                selector: `[data-edit-copy-sticker="${item.copy.id}"]` });
            }
          });
        } else stickers.set(sticker, { group, copy });
      }));
      return { entries, groups, issues: Array.from(issues.values()) };
    }

    function refreshPendingBrowse() {
      const scroll = captureScrollState();
      const rows = getBrowseRows();
      renderListHeader(rows.length);
      renderTable(rows);
      restoreScrollState(scroll);
    }

    function reviewPendingIssue() {
      const issues = preparePendingBatch().issues;
      if (!issues.length) return;
      const issue = issues[(issues.findIndex(item => item.rootId === state.selectedRootId) + 1) % issues.length];
      openPendingReview();
      leaveEditor();
      state.selectedRootId = issue.rootId;
      state.selectedCopyId = "";
      renderAllPreservingScroll(null, { keepSelection: true });
      if (!state.editor) beginEditor();
      showEditorError(issue.message, detailPanelNode.querySelector(issue.selector));
      revealDetailOnSmallScreen();
    }

    function saveAllPending() {
      if (saveJob) return;
      const batch = preparePendingBatch();
      if (batch.issues.length) { reviewPendingIssue(); return; }
      if (!batch.entries.length) return;
      startSave(batch.entries.map(entry => groupSaveTarget(entry.group, batch.groups.find(group => group.rootId === entry.group.rootId))), {
        action: "save-all-pending", apply: records => applyMiniSave(records, batch.entries)
      });
    }

    function renderSummaryLane() {
      const copies = state.groups.flatMap(group => group.copies);
      const missing = copies.filter(copy => getStickerStatus(copy.sticker) === "Missing").length;
      const away = copies.filter(copy => copy.currentLocation !== copy.home).length;
      const dirtyCount = copies.filter(isDirty).length;
      const draftCount = editorDraftIds().length;
      const hasWork = dirtyCount || draftCount || state.deletedGroups.length || saveJob;
      const pending = preparePendingBatch();
      const reviewing = state.collectionView === "pending";
      const shownGroups = reviewing ? new Set(getBrowseRows().map(row => row.group.rootId)).size : null;
      const expanded = panel => String(state.summaryPanel === panel);
      const dashboard = `<button type="button" class="mini-v2-dashboard" disabled aria-label="Dashboard, coming soon">
        Dashboard <span>Soon</span></button>`;

        data-action="collection-view" data-collection-view="${view}" aria-pressed="${state.collectionView === view}"
        title="${state.collectionView === view ? "Return to your previous browse view" : `Browse individual miniatures: ${label} (applied collection only)`}">
        <strong>${count}</strong> ${label}</button>`;
      const shortcuts = shortcut("away", away, "away") + shortcut("missing", missing, missing === 1 ? "missing sticker" : "missing stickers");

      const markup = `
        <div class="mini-v2-collection-overview">
          <span class="mini-v2-collection-total" title="${copies.length} miniatures across ${state.groups.length} groups. Unapplied drafts are excluded.">

            <span class="mini-v2-total-groups"><strong>${state.groups.length}</strong> ${state.groups.length === 1 ? "group" : "groups"}</span>
          </span>

            aria-label="Collection shortcuts${state.collectionView ? `, viewing ${state.collectionView === "pending" ? "pending changes" : state.collectionView === "away" ? "away from home" : "missing stickers"}` : ""}"
            aria-expanded="${expanded("collection")}" aria-controls="miniV2CollectionMenu">${state.collectionView === "pending" ? "Pending" : state.collectionView === "away" ? "Away" : state.collectionView === "missing" ? "Stickers" : "Collection"}<span class="mini-v2-summary-caret" aria-hidden="true"></span></button>
          <div id="miniV2CollectionMenu" class="mini-v2-summary-popover" ${state.summaryPanel === "collection" ? "" : "hidden"}>
            <p class="mini-v2-summary-heading">Whole collection</p>
            <p class="mini-v2-summary-empty">${copies.length} miniatures / ${state.groups.length} ${state.groups.length === 1 ? "group" : "groups"}</p>${shortcuts}
            <div class="mini-v2-summary-tools">${dashboard}${lists}</div>
          </div>
        </div>
        <div class="mini-v2-summary-recovery">
          <button type="button" class="mini-v2-summary-control ${hasWork ? "has-work" : ""}" data-action="toggle-summary" data-summary-panel="changes"
            aria-expanded="${expanded("changes")}" aria-controls="miniV2ChangesMenu"
            aria-label="Review changes${hasWork ? ", unfinished work or undo available" : ", no pending edits"}">
            <span class="mini-v2-work-indicator" aria-hidden="true"></span><span class="mini-v2-summary-wide">Review </span>Changes<span class="mini-v2-summary-caret" aria-hidden="true"></span>
          </button>
          <div id="miniV2ChangesMenu" class="mini-v2-summary-popover mini-v2-changes-menu" ${state.summaryPanel === "changes" ? "" : "hidden"}>
            <p class="mini-v2-summary-heading">Review changes</p>
            <p class="mini-v2-pending-scope">${pending.entries.length ? `${pending.entries.length} ${pending.entries.length === 1 ? "group" : "groups"} ${reviewing ? `total / ${shownGroups} shown` : "with unsaved changes"}` : "No pending edits."}</p>
            <button type="button" class="mini-v2-review-pending" data-action="review-pending"${!pending.entries.length && !reviewing ? " disabled" : ""}>${reviewing ? "Show all pending" : "Show pending changes"}<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12m-6-6 6 6-6 6"/></svg></button>
            ${reviewing ? '<button type="button" data-action="leave-pending">Back to previous view</button>' : ""}
            ${pending.issues.length ? `<button type="button" class="mini-v2-pending-issues" data-action="review-pending-issue">${pending.issues.length} ${pending.issues.length === 1 ? "group needs" : "groups need"} attention <span>Review</span></button>` : ""}
            <button type="button" class="mini-v2-save-all" data-action="save-all-pending" title="Apply all pending miniature changes in this page, including groups hidden by filters. Preview only; no spreadsheet changes."${!pending.entries.length || pending.issues.length ? " disabled" : ""}>Save All Changes <span>${pending.entries.length} ${pending.entries.length === 1 ? "group" : "groups"}</span></button>
            ${dirtyCount && !reviewing ? `<button type="button" data-action="review-changes">Pending locations <span>${dirtyCount} ${dirtyCount === 1 ? "copy" : "copies"}</span></button>` : ""}
            ${draftCount && !reviewing ? `<button type="button" data-action="review-editor-drafts">Resume drafts <span>${draftCount} ${draftCount === 1 ? "group" : "groups"}</span></button>` : ""}
            ${state.deletedGroups.length ? `<button type="button" data-action="undo-delete-group">Undo deletion <span>${escapeHtml(state.deletedGroups.at(-1).group.name)}</span></button>` : ""}
            ${state.deletedGroups.at(-1)?.restoreError ? `<p class="mini-v2-summary-empty" role="status">${escapeHtml(state.deletedGroups.at(-1).restoreError)}</p>` : ""}
          </div>
        </div>
        <div id="miniV2DemoNotice" class="mini-v2-summary-popover mini-v2-demo-popover" ${state.summaryPanel === "demo" ? "" : "hidden"}>
          <p class="mini-v2-summary-heading">${previewMode ? "Real collection, temporary changes" : "Mock data only"}</p>
          <p>${previewMode ? "This preview reads the imported snapshot in 2.0. Save, Create, Delete, and location changes only affect this browser session. Reload restores the imported collection; neither spreadsheet is changed by the app. The old tracker is not synchronized." : "Save applies changes in this browser until reload. Your Google Sheet is not read or changed."}</p>
          <details class="mini-v2-save-trials"><summary>Try save feedback</summary><label>Next save
            <select data-save-outcome aria-label="Next simulated save">
              ${[["success", "Normal"], ["failure", "Connection problem"], ["lost", "Lost confirmation"], ["conflict", "Changed in another tab"]].map(([value, text]) => `<option value="${value}"${nextSaveOutcome === value ? " selected" : ""}>${text}</option>`).join("")}
            </select></label><p>One simulated result, then back to normal. Nothing writes to your sheet.</p></details>
        </div>
      `;
      // Editor blur/change can follow pointerdown on the banner; keep unchanged buttons alive.

      syncSaveUI();
    }

    function toggleSummaryPanel(panel) {
      state.summaryPanel = state.summaryPanel === panel ? "" : panel;
      renderSummaryLane();
      focusSummaryTrigger(panel);
    }

    function focusSummaryTrigger(panel) {
      const trigger = root.querySelector(`[data-summary-panel="${panel}"]`);
      if (trigger?.getClientRects().length) trigger.focus({ preventScroll: true });
      else root.querySelector('[data-summary-panel="changes"]').focus({ preventScroll: true });
    }

    function matchesCollectionView(copy) {
      if (state.collectionView === "away") return copy.currentLocation !== copy.home;
      if (state.collectionView === "missing") return getStickerStatus(copy.sticker) === "Missing";
      return true;
    }

    function openCollectionView(view) {
      if (!["away", "missing"].includes(view)) return;
      if (state.collectionView === "pending") restorePendingBrowse();
      if (state.collectionView === view) { restorePreviousBrowse(); return; }
      // Keep the original browse context even when moving between collection shortcuts.
      if (!state.previousBrowse) state.previousBrowse = {
        browseMode: state.browseMode, search: state.search, locationFilter: state.locationFilter,
        filtersApplied: JSON.parse(JSON.stringify(state.filtersApplied)), sort: { ...state.sort },
        selectedRootId: state.selectedRootId, selectedCopyId: state.selectedCopyId,
        browseScroll: { ...state.browseScroll }, scroll: captureScrollState()
      };
      leaveEditor();
      state.collectionView = view;
      state.browseMode = "individuals";
      state.search = "";
      state.locationFilter = "all";
      state.filtersApplied = createEmptyFilterState();
      state.sort = { key: "", direction: "" };
      state.openFacetKey = "";
      state.locationMenuOpen = false;
      state.locationMenuSearch = "";
      state.summaryPanel = "";
      clearTimeout(copyRevealTimer);
      const candidates = getBrowseRows().filter(row => row.group.rootId === state.selectedRootId);
      const selected = candidates.find(row => row.copy.id === state.selectedCopyId) || candidates[0];
      state.selectedCopyId = selected?.copy.id || "";
      if (!selected) state.selectedRootId = "";
      const scroll = captureScrollState();
      scroll.tableTop = 0;
      scroll.tableLeft = 0;
      renderAllPreservingScroll(scroll);
      searchInputNode.focus({ preventScroll: true });
    }

    function restorePreviousBrowse() {
      if (state.collectionView === "pending") { restorePendingBrowse(); return; }
      const previous = state.previousBrowse;
      if (!previous) return;
      leaveEditor();
      clearTimeout(copyRevealTimer);
      const { scroll, ...browse } = previous;
      Object.assign(state, browse, { previousBrowse: null, collectionView: "", summaryPanel: "",
        openFacetKey: "", locationMenuOpen: false, locationMenuSearch: "" });
      reconcileBrowseSelection();
      renderAllPreservingScroll(scroll, { keepSelection: true });
      searchInputNode.focus({ preventScroll: true });
    }

    function openPendingReview() {
      if (state.collectionView !== "pending") {
        state.pendingReturn = {
          browseMode: state.browseMode, search: state.search, locationFilter: state.locationFilter,
          filtersApplied: JSON.parse(JSON.stringify(state.filtersApplied)), sort: { ...state.sort },
          collectionView: state.collectionView, previousBrowse: state.previousBrowse,
          selectedRootId: state.selectedRootId, selectedCopyId: state.selectedCopyId,
          browseScroll: { ...state.browseScroll }, scroll: captureScrollState()
        };
        state.pendingSaved = false;
      }
      leaveEditor();
      state.collectionView = "pending";
      state.browseMode = "groups";
      state.search = "";
      state.locationFilter = "all";
      state.filtersApplied = createEmptyFilterState();
      state.sort = { key: "", direction: "" };
      state.openFacetKey = "";
      state.locationMenuOpen = false;
      state.locationMenuSearch = "";
      state.summaryPanel = "";
      clearTimeout(copyRevealTimer);
      const scroll = captureScrollState();
      scroll.tableTop = 0; scroll.tableLeft = 0;
      renderAllPreservingScroll(scroll, { keepSelection: true });
      searchInputNode.focus({ preventScroll: true });
    }

    function restorePendingBrowse() {
      const previous = state.pendingReturn;
      if (!previous) return;
      leaveEditor();
      clearTimeout(copyRevealTimer);
      const { scroll, ...browse } = previous;
      Object.assign(state, browse, { pendingReturn: null, summaryPanel: "", openFacetKey: "",
        locationMenuOpen: false, locationMenuSearch: "" });
      reconcileBrowseSelection();
      renderAllPreservingScroll(scroll, { keepSelection: true });
      searchInputNode.focus({ preventScroll: true });
    }

    function reconcileBrowseSelection() {
      const group = getSelectedGroup();
      if (!group) { state.selectedRootId = ""; state.selectedCopyId = ""; return; }
      const editor = (state.editor?.rootId === group.rootId ? state.editor : state.editorDrafts[group.rootId]) || null;
      if (!retainedEditorCopies(group, editor).some(copy => copy.id === state.selectedCopyId)) state.selectedCopyId = "";
    }

    function getBrowseUnit(count) {
      const unit = state.browseMode === "individuals" ? "individual" : "group";
      return `${unit}${count === 1 ? "" : "s"}`;
    }

    function renderListHeader(visibleCount) {
      listStageNode.classList.toggle("is-pending-review", state.collectionView === "pending");

      document.getElementById("miniV2BrowseTitle").innerHTML = state.collectionView === "pending"
        ? 'Pending<span class="mini-v2-browse-title-tail"> Changes</span>' : 'Browse<span class="mini-v2-browse-title-tail"> Minis</span>';
      listHeaderNoteNode.textContent = `${visibleCount} ${getBrowseUnit(visibleCount)} shown`;

      countNode.textContent = scope ? `${scope}: ${visibleCount}` : `${visibleCount} ${getBrowseUnit(visibleCount)}`;

      searchInputNode.setAttribute("aria-label", scope ? `Search within ${scope.toLowerCase()}` : "Search name, sticker, or details");
      root.querySelectorAll("button[data-browse-mode]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.browseMode === state.browseMode));
      });
    }

    function renderLocationFilter() {
      searchInputNode.value = state.search;
      locationComboboxNode.classList.toggle("is-open", state.locationMenuOpen);
      locationLabelNode.textContent = state.locationFilter === "all" ? "All locations" : state.locationFilter;
      const locationMeaning = state.browseMode === "individuals" ? "Current location" : "Home or current location";
      locationTriggerNode.setAttribute("aria-label", `${locationMeaning}: ${locationLabelNode.textContent}`);
      locationTriggerNode.title = `Filter by ${locationMeaning.toLowerCase()} (${state.collectionView === "pending" ? "draft locations" : "last saved locations"})`;
      locationTriggerNode.setAttribute("aria-expanded", state.locationMenuOpen ? "true" : "false");
