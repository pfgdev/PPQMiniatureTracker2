      const editor = state.editor;
      if (!editor) return;
      clearEditorError();
      if (!editor.isNew && !state.groups.some(item => item.rootId === editor.rootId)) {
        showEditorError("This group is no longer in the collection. Close and reopen it before saving.");
        return;
      }
      const validationError = getEditorValidationError();
      if (validationError) {
        showEditorError(validationError.message, root.querySelector(validationError.selector));
        return;
      }
      const group = getSelectedGroup();
      const copies = retainedEditorCopies(group);
      const setNumber = editor.fields.setNumber.trim();
      // Unrelated edits must not reinterpret legacy paint values.
      const paintChanged = editor.fields.paint !== JSON.parse(editor.initial).fields.paint;
      const fields = { ...editor.fields, name: editor.fields.name.trim(), setNumber: hasNamedSet(editor.fields) ? setNumber : "",
        paint: paintChanged ? editor.fields.paint || null : group.paint ?? null };
      const updated = enrichGroup({ ...group, ...fields, copies: copies.map(copy => {
        const { followsHome, ...value } = editorCopy(copy);
        return { ...value, sticker: (value.sticker || "").trim() };
      }) });
      if (editor.isNew) state.groups.push(updated);
      else state.groups = state.groups.map(item => item.rootId === group.rootId ? updated : item);
      group.copies.forEach(copy => { delete state.draftLocations[copy.id]; });
      delete state.editorDrafts[group.rootId];
      delete state.newGroups[group.rootId];
      state.editor = null;
      rememberNextStickerStart(editor);
      if (!updated.copies.some(copy => copy.id === state.selectedCopyId)) {
        state.selectedCopyId = state.browseMode === "individuals" ? updated.copies[0].id : "";
      }
      state.browseScroll = { groups: null, individuals: null };
      const scroll = captureScrollState();
      scroll.detailTop = editor.readScroll.detailTop;
      scroll.detailTableLeft = editor.readScroll.detailTableLeft;
      renderAllPreservingScroll(scroll, { keepSelection: true });
      root.querySelector('[data-action="edit-mini"]').focus({ preventScroll: true });
    }

    function deleteSelectedGroup() {
      const group = getSelectedGroup();
      if (!group || state.editor?.isNew) return;
      state.deletedGroups.push({ group, editor: state.editor, selectedCopyId: state.selectedCopyId,
        draftLocations: Object.fromEntries(group.copies.filter(isDirty).map(copy => [copy.id, state.draftLocations[copy.id]])) });
      state.groups = state.groups.filter(item => item.rootId !== group.rootId);
      group.copies.forEach(copy => { delete state.draftLocations[copy.id]; });
      delete state.editorDrafts[group.rootId];
      state.editor = null;
      state.selectedRootId = "";
      state.selectedCopyId = "";
      renderAllPreservingScroll();
      focusSummaryTrigger("changes");
    }

    function undoGroupDeletion() {
      const record = state.deletedGroups.at(-1);
      if (!record) return;
      // A deleted group's stickers remain reserved while Undo can restore it.
      leaveEditor();
      state.deletedGroups.pop();
      state.groups.push(record.group);
      state.groups.sort((a, b) => a.originalOrder - b.originalOrder);
      Object.assign(state.draftLocations, record.draftLocations);
      state.editorDrafts[record.group.rootId] = record.editor;
      state.selectedRootId = record.group.rootId;
      state.selectedCopyId = record.selectedCopyId;
      renderAllPreservingScroll(null, { keepSelection: true });
      document.getElementById("miniV2EditName").focus({ preventScroll: true });
      revealDetailOnSmallScreen();
    }

    function renderStatusBadge(group) {
      const status = getStatusKey(group);
      return `<span class="mini-v2-badge ${statusClass(status)}">${escapeHtml(getStatusLabel(group))}</span>`;
    }

    function renderDetailTag(label, className, titleText) {
      return `<span class="mini-v2-detail-tag ${className || ""}"${titleText ? ` title="${escapeHtml(titleText)}"` : ""}>${escapeHtml(label)}</span>`;
    }

    function renderStatCard(label, valueMarkup) {
      return `
        <div class="mini-v2-stat-card">
          <div class="mini-v2-stat-label">${escapeHtml(label)}</div>
          <div class="mini-v2-stat-value">${valueMarkup}</div>
        </div>
      `;
    }

    function renderReadCard(label, value, options) {
      const config = options || {};
      return `
        <div class="mini-v2-read-card${config.wide ? " mini-v2-set-field" : ""}">
          <div class="mini-v2-field-label">${escapeHtml(label)}</div>
          ${renderReadValue(value, config)}
        </div>
      `;
    }

    function renderInventoryAvailability(group) {
      let available = 0;
      const copies = state.editor ? retainedEditorCopies(group) : group.copies;
      const total = copies.length;
      let pending = !!state.editor && (!!state.editor.addedCopies.length || !!state.editor.removedCopyIds.length);
      copies.forEach(copy => {
        const displayed = state.editor ? editorCopy(copy) : { ...copy, currentLocation: getEffectiveLocation(copy) };
        if (displayed.home && displayed.currentLocation === displayed.home) available++;
        if (displayed.currentLocation !== copy.currentLocation || displayed.home !== copy.home) pending = true;
      });
      const tone = statusClass(getStatusKey({ available, total }));
      const explanation = pending ? "Includes unsaved copy, Home or location changes." : "Copies at their home location.";
      return `<span class="mini-v2-availability-wrap" title="${explanation}">
        <span class="mini-v2-badge mini-v2-inventory-availability ${tone}"
          aria-label="${available} of ${total} available. ${explanation}">
          <span class="mini-v2-availability-size" aria-hidden="true">${total} / ${total}</span>
          <span class="mini-v2-availability-count">${available} / ${total}</span>
        </span>
        <span class="mini-v2-availability-pending${pending ? " is-visible" : ""}" aria-hidden="true">*</span>
      </span>`;
    }

    function renderInventorySummary(group) {
      return `<div class="mini-v2-inventory-summary">
        <div class="mini-v2-inventory-available">
          <span class="mini-v2-field-label">Available</span>
          <div class="mini-v2-inventory-summary-value">${renderInventoryAvailability(group)}</div>
        </div>
        <div class="mini-v2-inventory-home">
          ${state.editor ? '<label class="mini-v2-field-label" for="miniV2EditHome">Home</label>' : '<span class="mini-v2-field-label">Home</span>'}
          <div class="mini-v2-inventory-summary-value">
            ${state.editor
              ? `<select id="miniV2EditHome" class="mini-v2-inventory-home-select" data-edit-field="home">${renderEditOptions("home", state.homeLocations)}</select>`
              : renderReadValue(group.home || "Not specified", { marquee: true })}
          </div>
        </div>
      </div>`;
    }

    function renderReadValue(value, options) {
      const config = options || {};
      const className = [config.className || "mini-v2-read-value", config.extraClass || "", config.marquee ? "mini-v2-marquee-value" : ""]
        .filter(Boolean)
        .join(" ");
      const safeValue = escapeHtml(value);

      if (!config.marquee) {
        return `<div class="${className}">${safeValue}</div>`;
      }

      return `<div class="${className}" title="${safeValue}"><span class="mini-v2-marquee-track"><span class="mini-v2-marquee-text">${safeValue}</span></span></div>`;
    }

    function renderCopyRow(copy) {
      const added = !!state.editor?.addedCopies.includes(copy);
      const removed = !!state.editor?.removedCopyIds.includes(copy.id);
      if (removed) return `<tr class="mini-v2-copy-row is-removed" data-detail-copy-id="${escapeHtml(copy.id)}">
        <td>${escapeHtml(copy.sticker || "--")}</td><td><span class="mini-v2-editor-scope">Removed</span></td>
        <td><span class="mini-v2-copy-removed-text">Will be removed</span></td>
        <td><button class="mini-v2-copy-undo" type="button" data-action="undo-remove-copy" data-undo-copy="${escapeHtml(copy.id)}" aria-label="Undo removal of ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}">Undo</button></td></tr>`;
      const displayedCopy = state.editor ? editorCopy(copy) : copy;
      const effectiveLocation = state.editor ? displayedCopy.currentLocation : getEffectiveLocation(copy);
      const away = effectiveLocation !== displayedCopy.home;
      const dirty = added || effectiveLocation !== copy.currentLocation || (displayedCopy.note || "") !== (copy.note || "")
        || (displayedCopy.sticker || "") !== (copy.sticker || "");
      const noteValue = displayedCopy.note || "";
      const statusMarkup = dirty
        ? `<span class="mini-v2-copy-status is-dirty">${added ? "New" : "Unsaved"}</span>`
        : away
          ? '<span class="mini-v2-copy-status is-away">Away</span>'
          : '<span class="mini-v2-copy-status is-home">Home</span>';

      return `
        <tr class="mini-v2-copy-row ${away ? "is-away" : ""} ${dirty ? "is-dirty" : ""}" data-detail-copy-id="${escapeHtml(copy.id)}">
          <td>${state.editor ? `<input class="mini-v2-editor-sticker" data-edit-copy-sticker="${escapeHtml(copy.id)}" data-new-copy="${added}" aria-label="Sticker for ${added ? "new " : ""}copy ${copy.miniNumber}" title="${escapeHtml(displayedCopy.sticker || "Sticker not assigned")}" placeholder="--" value="${escapeHtml(displayedCopy.sticker || "")}" autocomplete="off" spellcheck="false">` : escapeHtml(copy.sticker || "Needs sticker")}</td>
          <td>${statusMarkup}</td>
          <td>
            <select class="mini-v2-copy-select" data-copy-id="${escapeHtml(copy.id)}" aria-label="Current location for ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}">
              ${renderCopyLocationOptions(displayedCopy, effectiveLocation)}
            </select>
          </td>
          <td class="mini-v2-copy-note-cell" title="${escapeHtml(noteValue || "No individual note")}">${state.editor
            ? `<div class="mini-v2-copy-note-editor"><input class="mini-v2-editor-copy-note" data-edit-copy-note="${escapeHtml(copy.id)}" aria-label="Note for ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}" value="${escapeHtml(noteValue)}" placeholder="Add note...">
              <button class="mini-v2-remove-copy" type="button" data-action="remove-copy" data-remove-copy="${escapeHtml(copy.id)}" aria-label="${added ? "Cancel addition of" : "Remove"} ${escapeHtml(copy.sticker || `copy ${copy.miniNumber}`)}" title="${added ? "Cancel this new copy" : "Remove this copy on Save"}"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 5.5h12M8 3h4l1 2.5M6 5.5l.7 11h6.6l.7-11M8.5 8v5.5M11.5 8v5.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`
            : renderReadValue(noteValue || "—", { marquee: true, className: "mini-v2-copy-note-value" })}</td>
        </tr>
      `;
    }

    function syncDetailCopyTarget() {
      detailContentNode.querySelectorAll("[data-detail-copy-id]").forEach(row => {
        const selectable = state.browseMode === "individuals" && !row.classList.contains("is-removed");
        if (selectable) row.tabIndex = 0;
        else row.removeAttribute("tabindex");
        const selected = selectable && !!state.selectedRootId
          && row.dataset.detailCopyId === state.selectedCopyId;
        row.classList.toggle("is-target", selected);
        if (selected) {
          row.setAttribute("aria-current", "true");
          row.setAttribute("aria-label", "Selected miniature copy");
        } else {
          row.removeAttribute("aria-current");
          row.removeAttribute("aria-label");
        }
      });
    }

    function renderCopyGrid(group) {
      return `
        <div class="mini-v2-copy-grid">
          <div class="mini-v2-copy-table-shell">
            <div class="mini-v2-copy-table-content">
              ${renderInventorySummary(group)}
              <table class="mini-v2-table mini-v2-copy-table" aria-label="Individual miniature copies">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Status</th>
                    <th>Current Location</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody>${editorBaseCopies(group).map(renderCopyRow).join("")}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderCopyLocationOptions(copy, effectiveLocation) {
      return [!effectiveLocation ? '<option value="" selected>Choose location</option>' : "",
        `<option value="__RETURN_HOME__"${effectiveLocation === copy.home && !!copy.home ? " selected" : ""}>Return Home</option>`]
        .concat(Array.from(new Set([...state.locations, effectiveLocation, copy.home])).filter(Boolean).map(location => `
          <option value="${escapeHtml(location)}"${effectiveLocation === location ? " selected" : ""}>${escapeHtml(location)}</option>
        `))
        .join("");
    }

    function hasNamedSet(group) {
      return hasMeaningfulValue(group.set) && !["n/a", UNSPECIFIED_VALUE.toLowerCase()].includes(String(group.set).trim().toLowerCase());
    }

    function getCollectionSummary(group) {
      if (String(group.set || "").trim().toLowerCase() === UNSPECIFIED_VALUE.toLowerCase()) return UNSPECIFIED_VALUE;
      if (String(group.set || "").trim().toLowerCase() === "n/a") return "n/a";
      const hasSet = hasNamedSet(group);
      const hasSetNumber = hasMeaningfulValue(group.setNumber);
      if (hasSet && hasSetNumber) return `${group.set} (${group.setNumber})`;
      if (hasSet) return String(group.set);
      if (hasSetNumber) return `#${group.setNumber}`;
      return "n/a";
    }

    function renderSortHeader(cellClassName, sortKey, visibleLabel, spokenLabel) {
      const isActive = state.sort.key === sortKey && !!state.sort.direction;
      const direction = isActive ? state.sort.direction : "";
      const indicator = direction === "desc" ? "▼" : direction === "asc" ? "▲" : "";
      const ariaSort = direction === "desc" ? "descending" : direction === "asc" ? "ascending" : "none";
      const label = spokenLabel || visibleLabel;

      return `
        <th class="${cellClassName}" aria-sort="${ariaSort}">
          <button
            class="mini-v2-sort-button ${isActive ? "is-active" : ""} ${cellClassName === "mini-v2-cell-avail" ? "is-avail" : ""}"
            type="button"
            data-action="toggle-sort"
            data-sort-key="${escapeHtml(sortKey)}"
            aria-label="Sort by ${escapeHtml(label)}${direction ? `, currently ${ariaSort}` : ""}"
          >
            <span class="mini-v2-sort-label">${escapeHtml(visibleLabel)}</span>
            <span class="mini-v2-sort-indicator" aria-hidden="true">${indicator}</span>
          </button>
        </th>
      `;
    }

    function handleRootClick(event) {
      const clickTarget = event.target instanceof Element ? event.target : null;
      const viewButton = clickTarget && clickTarget.closest("button[data-browse-mode]");
      if (viewButton && root.contains(viewButton)) {
        event.stopPropagation();
        switchBrowseMode(viewButton.dataset.browseMode);
        return;
      }
      // Dismissing a popover must not also trigger document-level inspector dismissal.
      if (dismissOutsidePopovers(clickTarget)) event.stopPropagation();

      const actionButton = event.target.closest("button[data-action]");
      if (actionButton && root.contains(actionButton)) {
        event.stopPropagation();
        const action = actionButton.getAttribute("data-action");

        if (action === "toggle-summary") { toggleSummaryPanel(actionButton.dataset.summaryPanel); return; }
        if (action === "collection-view") { openCollectionView(actionButton.dataset.collectionView); return; }
        if (["review-changes", "review-editor-drafts", "undo-delete-group"].includes(action)) state.summaryPanel = "";
        if (action === "new-group") { beginNewGroup(); return; }
        if (action === "edit-mini") { beginEditor(); return; }
        if (action === "discard-edit") { discardEditor(); return; }
        if (action === "save-edit") { saveEditor(); return; }
        if (action === "add-copy") { clearEditorError(); addEditorCopy(); return; }
        if (action === "apply-next-sticker") { applyNextSticker(); return; }
        if (action === "remove-copy") { clearEditorError(); removeEditorCopy(actionButton.dataset.removeCopy); return; }
        if (action === "undo-remove-copy") { clearEditorError(); undoEditorCopyRemoval(actionButton.dataset.undoCopy); return; }
        if (action === "delete-group" || action === "cancel-delete-group") {
          const confirmation = detailContentNode.querySelector('.mini-v2-delete-confirm');
          confirmation.hidden = action !== "delete-group";
          if (!confirmation.hidden) confirmation.querySelector('[data-action="cancel-delete-group"]').focus();
          else detailContentNode.querySelector('[data-action="delete-group"]').focus({ preventScroll: true });
          return;
        }
        if (action === "confirm-delete-group") { deleteSelectedGroup(); return; }
        if (action === "undo-delete-group") { undoGroupDeletion(); return; }
        if (action === "review-editor-drafts") {
          const ids = editorDraftIds();
          if (!ids.length) return;
          const next = ids[(ids.indexOf(state.selectedRootId) + 1) % ids.length];
          if (state.editor && next !== state.editor.rootId) leaveEditor();
          if (next !== state.selectedRootId) state.selectedCopyId = "";
          state.selectedRootId = next;
          renderAllPreservingScroll(null, { keepSelection: true });
          document.getElementById("miniV2EditName").focus({ preventScroll: true });
          revealDetailOnSmallScreen();
          return;
        }
        if (action === "edit-all-home" && state.editor) {
          retainedEditorCopies().forEach(copy => {
            const home = editorCopy(copy).home;
            state.editor.copies[copy.id].currentLocation = home;
            if (state.editor.addedCopies.includes(copy)) state.editor.copies[copy.id].followsHome = true;
            const select = Array.from(detailContentNode.querySelectorAll("select[data-copy-id]"))
              .find(node => node.dataset.copyId === copy.id);
            select.innerHTML = renderCopyLocationOptions(editorCopy(copy), home);
          });
          syncEditorFeedback();
          return;
        }

        if (action === "toggle-facet") {
          const restoreFocus = captureFocus();
          const facetKey = actionButton.getAttribute("data-facet-key") || "";
          state.openFacetKey = state.openFacetKey === facetKey ? "" : facetKey;
          renderFacetBar();
          renderFacetFlyout();
          restoreFocus();
          return;
        }

        if (action === "review-changes") {
          const dirtyGroups = state.groups.filter(group => group.copies.some(isDirty));
          const currentIndex = dirtyGroups.findIndex(group => group.rootId === state.selectedRootId);
          const group = dirtyGroups[(currentIndex + 1) % dirtyGroups.length];
          if (!group) return;
          if (state.editor && group.rootId !== state.editor.rootId && !leaveEditor()) return;
          const dirtyCopy = group.copies.find(isDirty);
          if (!getBrowseRows().some(row => row.group.rootId === group.rootId && (!row.copy || row.copy.id === dirtyCopy.id))) {
            state.search = "";
            state.locationFilter = "all";
            state.filtersApplied = createEmptyFilterState();
            state.collectionView = "";
            state.previousBrowse = null;
          }
          state.selectedRootId = group.rootId;
          state.selectedCopyId = state.browseMode === "individuals" ? dirtyCopy.id : "";
          renderAllPreservingScroll(null, { keepSelection: true });
          if (state.selectedCopyId) scheduleCopyReveal(state.selectedCopyId);
          revealDetailOnSmallScreen();
          return;
        }

        if (action === "toggle-facet-value") {
          toggleAppliedFacetValue(
            actionButton.getAttribute("data-facet-kind") || "",
            actionButton.getAttribute("data-facet-value") || ""
          );
          renderAllPreservingScroll();
          return;
        }

        if (action === "clear-open-facet") {
          clearOpenFacetSelections();
          renderAllPreservingScroll();
          return;
        }

        if (action === "toggle-location-menu") {
          state.locationMenuOpen = !state.locationMenuOpen;
          if (!state.locationMenuOpen) {
            state.locationMenuSearch = "";
          }
          renderLocationFilter();
          if (state.locationMenuOpen) {
            requestAnimationFrame(() => {
              locationSearchNode.focus();
              locationSearchNode.select();
            });
          }
          return;
        }

        if (action === "clear-location") {
          state.locationFilter = "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          renderAllPreservingScroll();
          return;
        }

        if (action === "set-location-filter") {
          state.locationFilter = actionButton.getAttribute("data-location-value") || "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          renderAllPreservingScroll();
          return;
        }

        if (action === "clear-filters") {
          if (state.previousBrowse) { restorePreviousBrowse(); return; }
          state.search = "";
          state.locationFilter = "all";
          state.locationMenuSearch = "";
          state.locationMenuOpen = false;
          state.filtersApplied = createEmptyFilterState();
          state.openFacetKey = "";
          renderAllPreservingScroll();
          return;
        }

        if (action === "toggle-sort") {
          toggleSortState(actionButton.getAttribute("data-sort-key") || "");
          renderAllPreservingScroll();
          return;
        }

        if (action === "close-detail") {
          clearSelectedGroup();
          return;
        }

        if (action === "reset-changes") {
          resetSelectedDraftChanges();
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }

        if (action === "set-all-home") {
          stageSelectedCopiesHome();
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }

        if (action === "save-changes") {
          saveSelectedDraftChanges();
          state.browseScroll = { groups: null, individuals: null };
          renderAllPreservingScroll(null, { keepSelection: true });
          return;
        }
      }

      const detailRow = clickTarget && clickTarget.closest("[data-detail-copy-id]");
      if (detailRow && state.browseMode === "individuals"
        && !clickTarget.closest("button, input, select, textarea, a, label")) {
        event.stopPropagation();
        selectDetailCopy(detailRow.dataset.detailCopyId);
        return;
      }

      const clickedRow = event.target.closest("tr[data-group-id]");
      if (clickedRow && root.contains(clickedRow)) {
        event.stopPropagation();
        const rootId = clickedRow.getAttribute("data-group-id");
        const copyId = clickedRow.getAttribute("data-copy-id") || "";
        if (!rootId) return;
        if (rootId !== state.selectedRootId || (copyId && copyId !== state.selectedCopyId)) {
          if (state.editor && rootId !== state.editor.rootId && !leaveEditor()) return;
          clearTimeout(copyRevealTimer);
          state.selectedRootId = rootId;
          state.selectedCopyId = copyId;
          renderAllPreservingScroll();
          if (copyId) scheduleCopyReveal(copyId);
          revealDetailOnSmallScreen();
          return;
        }
        clearSelectedGroup();
      }
    }

    function handleRootInput(event) {
      if (updateEditorInput(event.target)) return;
      if (event.target === searchInputNode) {
        state.search = searchInputNode.value;
        renderAllPreservingScroll();
        return;
      }

      if (event.target === locationSearchNode) {
        state.locationMenuSearch = locationSearchNode.value;
        renderLocationFilter();
        return;
      }

    }

    function handleRootChange(event) {
      if (updateEditorInput(event.target)) return;
      if (event.target instanceof HTMLSelectElement && event.target.hasAttribute("data-filter-set")) {
        state.filtersApplied.set = event.target.value;
        renderAllPreservingScroll();
        return;
      }
      const copySelect = event.target.closest("select[data-copy-id]");
      if (copySelect) {
        const group = getSelectedGroup();
        if (!group) return;
        const copy = editorBaseCopies(group).find(item => item.id === copySelect.getAttribute("data-copy-id"));
        if (!copy) return;

        const nextLocation = copySelect.value === "__RETURN_HOME__" ? (state.editor ? editorCopy(copy).home : copy.home) : copySelect.value;
        if (state.editor) {
          state.editor.copies[copy.id].currentLocation = nextLocation;
          if (state.editor.addedCopies.includes(copy)) state.editor.copies[copy.id].followsHome = false;
          copySelect.innerHTML = renderCopyLocationOptions(editorCopy(copy), nextLocation);
          clearEditorError();
          syncEditorFeedback();
          return;
        }
        if (nextLocation === copy.currentLocation) {
          delete state.draftLocations[copy.id];
        } else {
          state.draftLocations[copy.id] = nextLocation;
        }
        renderAllPreservingScroll(null, { keepSelection: true });
      }
    }

    function handleRootKeydown(event) {
      if (event.key === "Escape" && state.summaryPanel) {
        event.preventDefault();
        const panel = state.summaryPanel;
        state.summaryPanel = "";
        renderSummaryLane();
        focusSummaryTrigger(panel);
        return;
      }
      const summaryTrigger = event.target.closest('[data-action="toggle-summary"]');
      if (summaryTrigger && event.key === "ArrowDown") {
        event.preventDefault();
        state.summaryPanel = summaryTrigger.dataset.summaryPanel;
        renderSummaryLane();
        const panel = document.getElementById(summaryTrigger.getAttribute("aria-controls"));
        const first = panel?.querySelector("button:not(:disabled)");
        if (first) first.focus({ preventScroll: true });
        else focusSummaryTrigger(state.summaryPanel);
        return;
      }
      if (event.key === "Escape" && state.openFacetKey) {
        if (event.target instanceof HTMLSelectElement) return;
        const currentFacetKey = state.openFacetKey;
        state.openFacetKey = "";
        renderFacetBar();
        renderFacetFlyout();
        requestAnimationFrame(() => {
          const button = root.querySelector(`button[data-facet-key="${currentFacetKey}"]`);
          if (button instanceof HTMLElement) {
            button.focus();
          }
        });
        return;
      }

      if (event.key === "Escape" && state.locationMenuOpen) {
        state.locationMenuOpen = false;
        state.locationMenuSearch = "";
        renderLocationFilter();
        locationTriggerNode.focus();
        return;
      }

      if (state.editor && event.key === "Escape") {
        // Escape on a native select belongs to its popup, not to the whole editor.
        if (event.target instanceof HTMLSelectElement) return;
        event.preventDefault();
        const confirmation = detailContentNode.querySelector('.mini-v2-delete-confirm');
        if (confirmation && !confirmation.hidden) {
          confirmation.hidden = true;
          detailContentNode.querySelector('[data-action="delete-group"]').focus({ preventScroll: true });
          return;
        }
        clearSelectedGroup();
        return;
      }

      if (event.target === locationTriggerNode && (event.key === "Enter" || event.key === " " || event.key === "ArrowDown")) {
        event.preventDefault();
        state.locationMenuOpen = true;
        renderLocationFilter();
        requestAnimationFrame(() => {
          locationSearchNode.focus();
          locationSearchNode.select();
        });
        return;
      }

      const detailRow = event.target.closest("[data-detail-copy-id]");
      if (detailRow && event.target === detailRow && state.browseMode === "individuals"
        && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectDetailCopy(detailRow.dataset.detailCopyId);
        return;
      }

      const row = event.target.closest("tr[data-group-id]");
      if (!row) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        row.click();
      }
    }

    function dismissOutsidePopovers(target) {
      let dismissed = false;
      if (state.summaryPanel && target instanceof Element
        && !target.closest(".mini-v2-summary-popover, .mini-v2-top-card button")) {
        dismissed = true;
        state.summaryPanel = "";
        renderSummaryLane();
      }
      if (state.locationMenuOpen && target instanceof Element && !target.closest("#miniV2LocationCombobox")) {
        dismissed = true;
        state.locationMenuOpen = false;
        state.locationMenuSearch = "";
        renderLocationFilter();
      }
      if (state.openFacetKey && target instanceof Element && !target.closest("#miniV2FacetShell")) {
        dismissed = true;
        state.openFacetKey = "";
        renderFacetBar();
        renderFacetFlyout();
      }
      return dismissed;
    }

    function handleDocumentClick(event) {
      const target = event && event.target;
      const dismissed = dismissOutsidePopovers(target);
      const detailPointerDownInside = state.detailPointerDownInside;
      state.detailPointerDownInside = false;
      if (dismissed || detailPointerDownInside) return;
      if (!root.classList.contains("mini-v2-has-detail")) return;
      if (isDetailPersistentClickTarget(target)) return;
      clearSelectedGroup();
    }

    function handleDocumentPointerDown(event) {
      const target = event && event.target;
      state.detailPointerDownInside = !!(target instanceof Element && target.closest("#miniV2DetailPanel"));
    }

    function handleFacetPopoverTransitionEnd(event) {
      if (event.target !== facetPopoverNode) return;
      if (event.propertyName !== "height") return;
      if (!state.openFacetKey) return;
      facetPopoverNode.style.height = "";
    }

    function isDetailPersistentClickTarget(target) {
      if (!target || !(target instanceof Element)) return false;
      if (target.closest("#miniV2DetailPanel")) return true;
      if (target.closest("#miniV2FacetShell")) return true;
      if (target.closest(".mini-v2-summary-popover")) return true;
      if (target.closest("tr[data-group-id]")) return true;
      if (target.closest(".mini-v2-top-card :is(button, input, select, textarea, a, label, [data-action])")) return true;
      if (target.closest(".mini-v2-controls :is(button, input, select, textarea, a, label, [data-action])")) return true;
      return false;
    }

    function captureScrollState() {
      const host = getPrimaryScrollHost();
      return {
        host: host,
        hostTop: host ? host.scrollTop : 0,
        hostLeft: host ? host.scrollLeft : 0,
        tableTop: tableScrollNode ? tableScrollNode.scrollTop : null,
        tableLeft: tableScrollNode?.querySelector(".mini-v2-list-wrap")?.scrollLeft || 0,
        detailTop: detailScrollNode ? detailScrollNode.scrollTop : null,
        facetKey: state.openFacetKey,
        facetTop: facetPopoverBodyNode ? facetPopoverBodyNode.scrollTop : 0,
        detailTableLeft: detailContentNode?.querySelector(".mini-v2-copy-table-shell")?.scrollLeft || 0
      };
    }

    function restoreScrollState(scrollState) {
      if (!scrollState) return;
      const version = ++scrollRestoreVersion;

      const apply = function () {
        if (version !== scrollRestoreVersion) return;
        const host = scrollState.host || getPrimaryScrollHost();
        if (host) {
          if (Math.abs((host.scrollTop || 0) - (scrollState.hostTop || 0)) > 1) {
            host.scrollTop = scrollState.hostTop || 0;
          }
          if (Math.abs((host.scrollLeft || 0) - (scrollState.hostLeft || 0)) > 1) {
            host.scrollLeft = scrollState.hostLeft || 0;
          }
        }

        if (tableScrollNode && scrollState.tableTop !== null) {
          tableScrollNode.scrollTop = scrollState.tableTop;
        }

        if (detailScrollNode && scrollState.detailTop !== null) {
          detailScrollNode.scrollTop = scrollState.detailTop;
        }
        if (facetPopoverBodyNode && state.openFacetKey === scrollState.facetKey) {
          facetPopoverBodyNode.scrollTop = scrollState.facetTop || 0;
        }
        const listWrap = tableScrollNode?.querySelector(".mini-v2-list-wrap");
        if (listWrap) listWrap.scrollLeft = scrollState.tableLeft || 0;
        const copyShell = detailContentNode?.querySelector(".mini-v2-copy-table-shell");
        if (copyShell) copyShell.scrollLeft = scrollState.detailTableLeft || 0;
      };

      apply();
      requestAnimationFrame(apply);
    }

    function browseScrollKey() {
      return JSON.stringify([state.collectionView, state.search, state.locationFilter, state.filtersApplied, state.sort]);
    }

    function switchBrowseMode(mode) {
      if (!["groups", "individuals"].includes(mode) || mode === state.browseMode) return;
      clearTimeout(copyRevealTimer);
      const scroll = captureScrollState();
      state.browseScroll[state.browseMode] = { key: browseScrollKey(), top: scroll.tableTop, left: scroll.tableLeft };
      state.browseMode = mode;
      if (!["name", "size", "type", "race", "sex", "role"].includes(state.sort.key)) {
        state.sort = { key: "", direction: "" };
      }
      const previous = state.browseScroll[mode];
      const restorePrevious = previous && previous.key === browseScrollKey();
      scroll.tableTop = restorePrevious ? previous.top : 0;
      scroll.tableLeft = restorePrevious ? previous.left : 0;
      state.openFacetKey = "";
      state.locationMenuOpen = false;
      state.locationMenuSearch = "";
      if (mode === "individuals" && state.selectedRootId) {
        const candidates = getBrowseRows().filter(row => row.group.rootId === state.selectedRootId);
        const selected = candidates.find(row => row.copy.id === state.selectedCopyId) || candidates[0];
        state.selectedCopyId = selected ? selected.copy.id : "";
      }
      renderAllPreservingScroll(scroll, { keepSelection: true, keepDetail: true });
      if (mode === "individuals" && state.selectedCopyId) revealBrowseCopy(state.selectedCopyId, true);
    }

    function selectDetailCopy(copyId) {
      if (!getSelectedGroup() || !retainedEditorCopies().some(copy => copy.id === copyId)) return;
      clearTimeout(copyRevealTimer);
      state.selectedCopyId = copyId;
      renderAllPreservingScroll(null, { keepSelection: true, keepDetail: true });
      revealBrowseCopy(copyId);
    }

    function revealBrowseCopy(copyId, positionWithContext = false) {
      const row = Array.from(tableScrollNode.querySelectorAll("tr[data-copy-id]"))
        .find(node => node.dataset.copyId === copyId);
      if (!row) return; // Keep filters intact when the inspector selects a hidden sibling.
      const bounds = row.getBoundingClientRect();
      const viewport = tableScrollNode.getBoundingClientRect();
      if (!positionWithContext && bounds.top >= viewport.top && bounds.bottom <= viewport.bottom) return;
      const context = Math.min(bounds.height * 4, Math.max(0, tableScrollNode.clientHeight - bounds.height));
      const scroll = captureScrollState();
      scroll.tableTop += bounds.top - viewport.top - context;
      // Use the existing restoration mechanism so a pending frame cannot undo the reveal.
      restoreScrollState(scroll);
    }

    function scheduleCopyReveal(copyId) {
      clearTimeout(copyRevealTimer);
      // Wait for the pane slide and the normal scroll restoration to finish.
      copyRevealTimer = setTimeout(() => {
        if (state.selectedCopyId !== copyId || !getSelectedGroup()) return;
        const row = Array.from(detailContentNode.querySelectorAll("[data-detail-copy-id]"))
          .find(node => node.dataset.detailCopyId === copyId);
        if (!row || !desktopMq.matches) return;
        const bounds = row.getBoundingClientRect();
        const viewport = detailScrollNode.getBoundingClientRect();
        if (bounds.bottom > viewport.bottom - 8) detailScrollNode.scrollTop += bounds.bottom - viewport.bottom + 8;
        else if (bounds.top < viewport.top + 8) detailScrollNode.scrollTop += bounds.top - viewport.top - 8;
      }, 260);
    }

    function getPrimaryScrollHost() {
      if (!desktopMq.matches) return document.body;
      return document.scrollingElement || document.documentElement || document.body;
    }

    function revealDetailOnSmallScreen() {
      if (desktopMq.matches || !getSelectedGroup()) return;
      requestAnimationFrame(() => {
        if (!desktopMq.matches && getSelectedGroup()) detailPanelNode.scrollIntoView({ block: "start", behavior: "instant" });
      });
    }

    function syncDesktopLayoutMetrics() {
      if (!desktopMq.matches) {
        root.style.removeProperty("--mini-v2-browse-table-width");
        scheduleDetailMarqueeSync(0);
        return;
      }

      const listWrap = tableScrollNode ? tableScrollNode.querySelector(".mini-v2-list-wrap") : null;
      if (!listWrap) return;

      // Measure the full workspace, not the shrinking pane during its slide.
      const tableCard = root.querySelector(".mini-v2-table-card");
      const insets = tableCard.getBoundingClientRect().width - listWrap.getBoundingClientRect().width;
      const detailStyle = getComputedStyle(detailPanelNode);
      const closedBorder = parseFloat(detailStyle.borderLeftWidth) + parseFloat(detailStyle.borderRightWidth);
      const width = Math.round(workspaceNode.getBoundingClientRect().width - insets - closedBorder);
      if (width > 0) {
        root.style.setProperty("--mini-v2-browse-table-width", `${width}px`);
      }

      scheduleDetailMarqueeSync(0);
    }

    function handleDetailPanelTransitionEnd(event) {
      if (!event || event.target !== detailPanelNode) return;
      if (!["width", "max-width", "flex-basis", "transform"].includes(event.propertyName)) return;

      if (!root.classList.contains("mini-v2-has-detail") && desktopMq.matches) {
        if (detailWidthSyncTimer) {
          clearTimeout(detailWidthSyncTimer);
        }

        detailWidthSyncTimer = setTimeout(function () {
          syncDesktopLayoutMetrics();
          detailWidthSyncTimer = null;
        }, 0);
      }

      scheduleDetailMarqueeSync(80);
    }

    function scheduleDetailMarqueeSync(delayMs) {
      if (detailMarqueeSyncTimer) {
        clearTimeout(detailMarqueeSyncTimer);
      }

      detailMarqueeSyncTimer = setTimeout(function () {
        syncDetailMarquees();
        detailMarqueeSyncTimer = null;
      }, delayMs || 0);
    }

    function syncDetailMarquees() {
      if (!detailContentNode || detailContentNode.hidden) return;

      detailContentNode.querySelectorAll(".mini-v2-marquee-value").forEach(node => {
        const textNode = node.querySelector(".mini-v2-marquee-text");
        if (!textNode) return;

        if (node._miniV2MarqueeAnimation) {
          node._miniV2MarqueeAnimation.cancel();
          node._miniV2MarqueeAnimation = null;
        }

        textNode.style.transform = "translateX(0)";
        if (reducedMotionMq.matches) return;

        const overflowAmount = Math.ceil(textNode.scrollWidth - node.clientWidth);
        if (overflowAmount <= 1) return;

        const moveSeconds = Math.max(4, overflowAmount / 22);
        const totalSeconds = moveSeconds + 4;
        const startPauseOffset = 2 / totalSeconds;
        const endPauseOffset = (2 + moveSeconds) / totalSeconds;

        node._miniV2MarqueeAnimation = textNode.animate(
          [
            { transform: "translateX(0)", offset: 0 },
            { transform: "translateX(0)", offset: startPauseOffset },
            { transform: `translateX(${-overflowAmount}px)`, offset: endPauseOffset },
            { transform: `translateX(${-overflowAmount}px)`, offset: 1 }
          ],
          {
            duration: totalSeconds * 1000,
            iterations: Infinity,
            easing: "linear"
          }
        );
      });
    }

    function getFilteredGroups(filterStateOverride) {
      const search = state.search.trim().toLowerCase();
      const filterState = filterStateOverride || state.filtersApplied;

      const filteredGroups = state.groups.filter(group => {
        if (!group.copies.some(matchesCollectionView)) return false;
        if (search && !group.searchText.includes(search)) return false;

        if (state.locationFilter !== "all") {
          const matchesLocation = group.home === state.locationFilter
            || group.copies.some(copy => {
              return copy.currentLocation === state.locationFilter;
            });
          if (!matchesLocation) return false;
        }

        if (!matchesStructuredFilters(group, filterState)) return false;

        return true;
      });

      return sortGroups(filteredGroups);
    }

    function matchesStructuredFilters(group, filterState, copy = null) {
      if (filterState.sizes.length && !filterState.sizes.includes(group.size || "n/a")) return false;
      if (filterState.creatureTypes.length && !filterState.creatureTypes.includes(group.creatureType || "n/a")) return false;
      if (filterState.roles.length && !filterState.roles.includes(group.role || "n/a")) return false;
      if (filterState.sexes.length && !filterState.sexes.includes(group.sex || "n/a")) return false;
      if (filterState.races.length && !filterState.races.includes(group.race || "n/a")) return false;
      if (filterState.paints.length && !filterState.paints.includes(getPaintValue(group.paint))) return false;
      if (filterState.set && group.set !== filterState.set) return false;
      if (filterState.stickers.length) {
        const copies = copy ? [copy] : group.copies;
        if (!copies.some(item => filterState.stickers.includes(getStickerStatus(item.sticker)))) return false;
      }
      return true;
    }

    function getBrowseRows() {
      if (state.browseMode === "groups") return getFilteredGroups().map(group => ({ group, copy: null }));
      const search = state.search.trim().toLowerCase();
      const rows = [];
      state.groups.forEach(group => {
        group.copies.forEach((copy, copyOrder) => {
          if (!matchesCollectionView(copy)) return;
          if (!matchesStructuredFilters(group, state.filtersApplied, copy)) return;
          if (state.locationFilter !== "all" && copy.currentLocation !== state.locationFilter) return;
          const searchText = [group.sharedSearchText, copy.id, copy.sticker, copy.currentLocation, copy.note || ""].join(" ").toLowerCase();
          if (search && !searchText.includes(search)) return;
          rows.push({ group, copy, copyOrder });
        });
      });
      return sortIndividualRows(rows);
    }

    function sortIndividualRows(rows) {
      const { key, direction } = state.sort;
      if (!key || !direction) return rows;
      const multiplier = direction === "desc" ? -1 : 1;
      return rows.slice().sort((left, right) => {
        let comparison;
        if (key === "sticker") {
          // Unassigned copies stay last in either direction; sticker text is not identity.
          const missingDifference = Number(!left.copy.sticker) - Number(!right.copy.sticker);
          if (missingDifference) return missingDifference;
          comparison = compareText(left.copy.sticker, right.copy.sticker);
        } else if (key === "currentLocation") {
          comparison = compareText(left.copy.currentLocation, right.copy.currentLocation);
        } else {
          comparison = compareGroupsBySortKey(left.group, right.group, key);
        }
        return comparison * multiplier
          || compareText(left.group.name, right.group.name)
          || left.group.originalOrder - right.group.originalOrder
          || left.copyOrder - right.copyOrder;
      });
    }

    function createEmptyFilterState() {
      return {
        sizes: [],
        creatureTypes: [],
        roles: [],
        sexes: [],
        races: [],
        paints: [],
        set: "",
        stickers: []
      };
    }

    function toggleSortState(sortKey) {
      if (!sortKey) return;

      const defaultDirection = getDefaultSortDirection(sortKey);
      const alternateDirection = defaultDirection === "desc" ? "asc" : "desc";

      if (state.sort.key !== sortKey) {
        state.sort = { key: sortKey, direction: defaultDirection };
        return;
      }

      if (state.sort.direction === defaultDirection) {
        state.sort.direction = alternateDirection;
        return;
      }

      if (state.sort.direction === alternateDirection) {
        state.sort = { key: "", direction: "" };
        return;
      }

      state.sort = { key: sortKey, direction: defaultDirection };
    }

    function getDefaultSortDirection(sortKey) {
      return sortKey === "avail" ? "desc" : "asc";
    }

    function sortGroups(groups) {
      if (!state.sort.key || !state.sort.direction) {
        return groups.slice().sort((left, right) => (left.originalOrder || 0) - (right.originalOrder || 0));
      }

      const directionMultiplier = state.sort.direction === "asc" ? 1 : -1;
      return groups.slice().sort((left, right) => {
        const comparison = compareGroupsBySortKey(left, right, state.sort.key);
        if (comparison !== 0) return comparison * directionMultiplier;

        const nameTieBreak = compareText(left.name, right.name);
        if (nameTieBreak !== 0) return nameTieBreak;

        return (left.originalOrder || 0) - (right.originalOrder || 0);
      });
    }

    function compareGroupsBySortKey(left, right, sortKey) {
      if (sortKey === "avail") {
        return left.available - right.available;
      }

      if (sortKey === "name") return compareText(left.name, right.name);
      if (sortKey === "home") return compareText(left.home, right.home);
      if (sortKey === "size") return compareSizeValues(left.size, right.size);
      if (sortKey === "type") return compareText(left.creatureType, right.creatureType);
      if (sortKey === "race") return compareText(left.race || "n/a", right.race || "n/a");
      if (sortKey === "sex") return compareText(left.sex || "n/a", right.sex || "n/a");
      if (sortKey === "role") return compareText(left.role || "n/a", right.role || "n/a");

      return 0;
    }

    function compareSizeValues(left, right) {
      const leftRank = getSizeSortRank(left);
      const rightRank = getSizeSortRank(right);
      if (leftRank !== rightRank) return leftRank - rightRank;
      return compareText(left, right);
    }

    function getSizeSortRank(size) {
      switch (String(size || "").trim().toLowerCase()) {
        case "tiny":
          return 0;
        case "small":
          return 1;
        case "medium":
          return 2;
        case "large":
          return 3;
        case "huge":
          return 4;
        case "gargantuan":
          return 5;
        case "n/a":
          return 6;
        default:
          return 7;
      }
    }

    function compareText(left, right) {
      return String(left || "").localeCompare(String(right || ""), undefined, {
        sensitivity: "base",
        numeric: true
      });
    }

    function getSelectedGroup() {
      return state.groups.find(group => group.rootId === state.selectedRootId) || state.newGroups[state.selectedRootId] || null;
    }

    function ensureSelectionVisibility(rows) {
      if (!state.selectedRootId || state.editor) return;
      const selectedStillVisible = rows.some(row => row.group.rootId === state.selectedRootId
        && (!row.copy || !state.selectedCopyId || row.copy.id === state.selectedCopyId));
      if (!selectedStillVisible) {
        state.selectedRootId = "";
        state.selectedCopyId = "";
        clearTimeout(copyRevealTimer);
      }
    }

    function clearSelectedGroup() {
      if (!state.selectedRootId) return;
      if (!leaveEditor()) return;
      state.selectedRootId = "";
      state.selectedCopyId = "";
      clearTimeout(copyRevealTimer);
      renderAllPreservingScroll();
    }

    function getEffectiveLocation(copy) {
      return state.draftLocations[copy.id] || copy.currentLocation;
    }

    function isDirty(copy) {
      return getEffectiveLocation(copy) !== copy.currentLocation;
    }

    function resetSelectedDraftChanges() {
      const group = getSelectedGroup();
      if (!group) return;
      group.copies.forEach(copy => {
        delete state.draftLocations[copy.id];
      });
    }

    function stageSelectedCopiesHome() {
      const group = getSelectedGroup();
      if (!group) return;
      group.copies.forEach(copy => {
        if (copy.currentLocation !== copy.home) {
          state.draftLocations[copy.id] = copy.home;
        } else {
          delete state.draftLocations[copy.id];
        }
      });
    }

    function saveSelectedDraftChanges() {
      const group = getSelectedGroup();
      if (!group) return;

      state.groups = state.groups.map(existingGroup => {
        if (existingGroup.rootId !== group.rootId) return existingGroup;

        const updatedCopies = existingGroup.copies.map(copy => {
          const nextLocation = state.draftLocations[copy.id];
          if (!nextLocation) return copy;
          return { ...copy, currentLocation: nextLocation };
        });

        return enrichGroup({ ...existingGroup, copies: updatedCopies });
      });

      group.copies.forEach(copy => {
        delete state.draftLocations[copy.id];
      });
    }

    function getMissingFieldLabels(group) {
      const candidates = [
        { label: "Name", value: group.name },
        { label: "Home", value: group.home },
        { label: "Size", value: group.size },
        { label: "Creature Type", value: group.creatureType },
        { label: "Sex", value: group.sex },
        { label: "Race", value: group.race },
        { label: "Role", value: group.role },
        { label: "Paint", value: getPaintValue(group.paint) },
        { label: "Set", value: group.set },
        ...(hasNamedSet(group) ? [{ label: "Set #", value: group.setNumber }] : [])
      ];

      return candidates
        .filter(candidate => !hasMeaningfulValue(candidate.value))
        .map(candidate => candidate.label);
    }

    function hasMeaningfulValue(value) {
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function getStatusKey(group) {
      if (group.available === 0) return "checkedOut";
      if (group.available < group.total) return "partial";
      return "ready";
    }

    function getStatusLabel(group) {
      const status = getStatusKey(group);
      if (status === "checkedOut") return "Checked Out";
      if (status === "partial") return "Partial";
      return "Ready";
    }

    function statusClass(status) {
      if (status === "checkedOut") return "is-danger";
      if (status === "partial") return "is-warn";
      return "is-success";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  })();
</script>
