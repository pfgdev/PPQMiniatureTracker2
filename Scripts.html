<script>
  (function () {
    if (INITIAL_STATE.loadError) {
      document.getElementById("app").innerHTML = `<div class="mini-v2"><section class="v2-card mini-v2-top-card">
        <div class="v2-card-header">Collection preview unavailable</div>
        <div class="v2-card-body"><p>The imported collection could not be loaded. No data was changed.</p>
          <p>Try reloading. If this continues, check the Apps Script authorization and the 2.0 storage tabs.</p>
          <button type="button" class="button" id="miniV2RetryLoad">Reload preview</button>
        </div></section></div>`;
      document.getElementById("miniV2RetryLoad").addEventListener("click", () => window.location.reload());
      return;
    }
    const previewMode = INITIAL_STATE.previewMode === true;
    const stickerCatalog = Array.isArray(INITIAL_STATE.stickerCatalog) ? INITIAL_STATE.stickerCatalog : null;
    const desktopMq = window.matchMedia("(min-width: 980px)");
    const reducedMotionMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    const FILTER_OPTIONS = {
      sizes: ["Tiny", "Small", "Medium", "Large", "Huge", "Gargantuan"],
      creatureTypes: [
        "Aberration",
        "Beast",
        "Celestial",
        "Construct",
        "Dragon",
        "Elemental",
        "Fey",
        "Fiend",
        "Giant",
        "Humanoid",
        "Monstrosity",
        "Ooze",
        "Plant",
        "Undead",
        "n/a"
      ],
      roles: ["Melee", "Ranged", "Spellcaster", "Support", "Tank", "Boss", "Minion", "NPC", "Other", "Various", "n/a"],
      sexes: ["Female", "Male", "n/a"],
      races: [
        "Aasimar",
        "Bugbear",
        "Dragonborn",
        "Drow",
        "Dwarf",
        "Elf",
        "Gnoll",
        "Gnome",
        "Goblin",
        "Goliath",
        "Half-Elf",
        "Half-Orc",
        "Halfling",
        "Hobgoblin",
        "Human",
        "Kobold",
        "Lizardfolk",
        "Orc",
        "Tiefling",
        "Tortle",
        "Yuan-ti",
        "other",
        "n/a"
      ]
    };

    const EDIT_FIELDS = ["name", "size", "creatureType", "race", "sex", "role", "set", "setNumber", "home", "paint", "notes"];
    const UNSPECIFIED_VALUE = "Not specified";
    const FACET_FIELDS = { sizes: "size", creatureTypes: "creatureType", races: "race", sexes: "sex", roles: "role" };
    Object.entries(FACET_FIELDS).forEach(([kind, field]) => {
      if (Array.isArray(INITIAL_STATE.catalogs?.[field])) FILTER_OPTIONS[kind] = INITIAL_STATE.catalogs[field].slice();
    });
    const PAINT_OPTIONS = ["Painted", "Unpainted", "Work in Progress"];
    const STICKER_FILTER_OPTIONS = ["Assigned", "Missing"];
    const EDIT_REQUIRED_CHOICES = {
      size: "Size", creatureType: "Creature Type", race: "Race", sex: "Sex", role: "Role", set: "Set", paint: "Paint"
    };
    const NEXT_STICKER_STORAGE_KEY = `ppq-miniature-tracker:${INITIAL_STATE.prototypeMode ? "mock" : "collection"}:next-sticker:v1`;

    const state = {
      groups: INITIAL_STATE.groups.map((group, index) => enrichGroup({ ...group, originalOrder: index })),
      locations: INITIAL_STATE.locations.slice(),
      homeLocations: (INITIAL_STATE.homeLocations || INITIAL_STATE.locations).slice(),
      sets: Array.from(new Set(INITIAL_STATE.catalogs?.set || INITIAL_STATE.groups.map(group => group.set).filter(Boolean))).sort(compareText),
      browseMode: "groups",
      browseScroll: { groups: null, individuals: null },
      collectionView: "",
      previousBrowse: null,
      summaryPanel: "",
      search: "",
      locationFilter: "all",
      locationMenuOpen: false,
      locationMenuSearch: "",
      filtersApplied: createEmptyFilterState(),
      sort: {
        key: "",
        direction: ""
      },
      openFacetKey: "",
      selectedRootId: "",
      selectedCopyId: "",
      draftLocations: {},
      editor: null,
      editorDrafts: Object.create(null),
      newGroups: Object.create(null),
      deletedGroups: [],
      nextStickerStart: null,
      nextStickerRevision: 0,
      stickerCursorRevision: 0,
      nextMockId: 1,
      detailPointerDownInside: false
    };

    let root;
    let workspaceNode;
    let summaryLaneNode;
    let summaryMarkup = "";
    let listHeaderNoteNode;
    let searchInputNode;
    let locationComboboxNode;
    let locationTriggerNode;
    let locationLabelNode;
    let locationClearNode;
    let locationPopoverNode;
    let locationSearchNode;
    let locationOptionsNode;
    let facetShellNode;
    let facetBarNode;
    let facetPopoverNode;
    let facetPopoverTitleNode;
    let facetPopoverClearNode;
    let facetPopoverBodyNode;
    let listStageNode;
    let tableScrollNode;
    let detailPanelNode;
    let detailStageNode;
    let detailHeaderTitleNode;
    let detailHeaderTagsNode;
    let detailCloseButtonNode;
    let detailScrollNode;
    let detailEmptyNode;
    let detailContentNode;
    let facetHideTimer = null;
    let facetSwapTimer = null;
    let detailWidthSyncTimer = null;
    let detailMarqueeSyncTimer = null;
    let copyRevealTimer = null;
    let scrollRestoreVersion = 0;

    state.nextStickerStart = loadNextStickerStart();
    initMiniV2();

    function initMiniV2() {
      buildShell();
      bindNodes();
      renderLocationFilter();
      renderAll();
      syncDesktopLayoutMetrics();
      bindEvents();
      window.addEventListener("resize", () => syncDesktopLayoutMetrics());
      new ResizeObserver(() => syncDesktopLayoutMetrics()).observe(workspaceNode);
      reducedMotionMq.addEventListener("change", () => scheduleDetailMarqueeSync(0));
      window.addEventListener("beforeunload", event => {
        if (!editorDraftIds().length && !state.groups.some(group => group.copies.some(isDirty))) return;
        event.preventDefault();
        event.returnValue = "";
      });
    }

    function buildShell() {
      document.getElementById("app").innerHTML = `
        <div id="miniV2Root" class="mini-v2">
          <section class="v2-card mini-v2-top-card">
            <div class="v2-card-header mini-v2-app-header">
              <span>PPQ Miniature Tracker</span>
              <button type="button" class="mini-v2-demo-note" data-action="toggle-summary" data-summary-panel="demo"
                aria-label="${previewMode ? "Collection preview" : "Demo data"}: changes reset on reload. More information" aria-expanded="false" aria-controls="miniV2DemoNotice">
                ${previewMode ? "Preview" : "Demo"}<span>: ${previewMode ? "changes reset on reload" : "resets on reload"}</span>
              </button>
            </div>
            <div class="v2-card-body mini-v2-top-card-body">
              <div id="miniV2SummaryLane" class="mini-v2-summary-lane"></div>
            </div>
          </section>

          <div class="mini-v2-workspace">
            <section class="v2-card mini-v2-table-card">
              <div id="miniV2ListStage" class="mini-v2-list-stage">
                <div class="v2-card-header mini-v2-list-header">
                  <span>Browse<span class="mini-v2-browse-title-tail"> Minis</span></span>
                  <span id="miniV2ListHeaderNote" class="mini-v2-list-header-note" hidden></span>
                  <div class="mini-v2-view-switch" role="group" aria-label="Browse view">
                    <button type="button" data-browse-mode="groups" aria-pressed="true">Groups</button>
                    <button type="button" data-browse-mode="individuals" aria-pressed="false">Individuals</button>
                  </div>
                  <button class="button mini-v2-new-button" type="button" data-action="new-group" aria-label="Create a new miniature group" title="Create a new miniature group">+<span> New</span></button>
                </div>
                <div class="v2-card-body mini-v2-table-body">
                  <div class="mini-v2-controls">
                    <div class="mini-v2-search-row">
                      <div class="mini-v2-field">
                        <input id="miniV2SearchInput" type="search" placeholder="Search name, sticker, or details...">
                      </div>
                      <div class="mini-v2-field">
                        <div id="miniV2LocationCombobox" class="mini-v2-combobox">
                          <button
                            id="miniV2LocationTrigger"
                            class="mini-v2-combobox-trigger"
                            type="button"
                            data-action="toggle-location-menu"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-controls="miniV2LocationPopover"
                          >
                            <span id="miniV2LocationLabel" class="mini-v2-combobox-label">All locations</span>
                            <span class="mini-v2-combobox-caret" aria-hidden="true">▾</span>
                          </button>
                          <button
                            id="miniV2LocationClear"
                            class="mini-v2-combobox-clear"
                            type="button"
                            data-action="clear-location"
                            aria-label="Clear location filter"
                            hidden
                          >
                            ×
                          </button>
                          <div id="miniV2LocationPopover" class="mini-v2-combobox-popover" hidden>
                            <div class="mini-v2-combobox-search-wrap">
                              <input id="miniV2LocationSearch" class="mini-v2-combobox-search" type="search" placeholder="Search locations...">
                            </div>
                            <div id="miniV2LocationOptions" class="mini-v2-combobox-options" role="listbox" aria-label="Locations"></div>
                          </div>
                        </div>
                      </div>
                      <button class="button mini-v2-action-btn" type="button" data-action="clear-filters">Clear</button>
                    </div>
                    <div id="miniV2FacetShell" class="mini-v2-facet-shell">
                      <div id="miniV2FacetBar" class="mini-v2-facet-row"></div>
                      <span id="miniV2BrowseCount" class="mini-v2-browse-count"></span>
                      <div id="miniV2FacetPopover" class="mini-v2-facet-popover" hidden>
                        <div class="mini-v2-facet-popover-header">
                          <div id="miniV2FacetPopoverTitle" class="mini-v2-facet-popover-title"></div>
                          <button
                            id="miniV2FacetPopoverClear"
                            class="button mini-v2-facet-popover-link"
                            type="button"
                            data-action="clear-open-facet"
                            disabled
                          >
                            Clear
                          </button>
                        </div>
                        <div id="miniV2FacetPopoverBody" class="mini-v2-facet-popover-body"></div>
                      </div>
                    </div>
                  </div>
                  <div id="miniV2TableScroll" class="mini-v2-table-scroll"></div>
                </div>
              </div>
            </section>

            <aside id="miniV2DetailPanel" class="v2-card mini-v2-detail-card">
              <div id="miniV2DetailStage" class="mini-v2-detail-stage">
                <div class="v2-card-header mini-v2-detail-header">
                  <div class="mini-v2-detail-header-main">
                    <span id="miniV2DetailHeaderTitle">Mini Details</span>
                    <input id="miniV2EditName" class="mini-v2-editor-name" data-edit-field="name" aria-label="Miniature name" hidden>
                    <div id="miniV2DetailHeaderTags" class="mini-v2-detail-tag-row"></div>
                  </div>
                  <div class="mini-v2-detail-header-actions">
                    <button class="button mini-v2-detail-close" type="button" data-action="edit-mini" hidden>Edit</button>
                    <button id="miniV2DetailCloseButton" class="button mini-v2-detail-close" type="button" data-action="close-detail">Close</button>
                  </div>
                </div>
                <div class="v2-card-body">
                  <div id="miniV2DetailScroll" class="mini-v2-detail-scroll">
                    <div id="miniV2DetailEmpty" class="mini-v2-detail-empty">Select a miniature to view its details and move individual copies.</div>
                    <div id="miniV2DetailContent" hidden></div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function bindNodes() {
      root = document.getElementById("miniV2Root");
      workspaceNode = root.querySelector(".mini-v2-workspace");
      summaryLaneNode = document.getElementById("miniV2SummaryLane");
      listHeaderNoteNode = document.getElementById("miniV2ListHeaderNote");
      searchInputNode = document.getElementById("miniV2SearchInput");
      locationComboboxNode = document.getElementById("miniV2LocationCombobox");
      locationTriggerNode = document.getElementById("miniV2LocationTrigger");
      locationLabelNode = document.getElementById("miniV2LocationLabel");
      locationClearNode = document.getElementById("miniV2LocationClear");
      locationPopoverNode = document.getElementById("miniV2LocationPopover");
      locationSearchNode = document.getElementById("miniV2LocationSearch");
      locationOptionsNode = document.getElementById("miniV2LocationOptions");
      facetShellNode = document.getElementById("miniV2FacetShell");
      facetBarNode = document.getElementById("miniV2FacetBar");
      facetPopoverNode = document.getElementById("miniV2FacetPopover");
      facetPopoverTitleNode = document.getElementById("miniV2FacetPopoverTitle");
      facetPopoverClearNode = document.getElementById("miniV2FacetPopoverClear");
      facetPopoverBodyNode = document.getElementById("miniV2FacetPopoverBody");
      locationTriggerNode.querySelector(".mini-v2-combobox-caret").textContent = "";
      locationClearNode.textContent = "x";
      listStageNode = document.getElementById("miniV2ListStage");
      tableScrollNode = document.getElementById("miniV2TableScroll");
      detailPanelNode = document.getElementById("miniV2DetailPanel");
      detailStageNode = document.getElementById("miniV2DetailStage");
      detailHeaderTitleNode = document.getElementById("miniV2DetailHeaderTitle");
      detailHeaderTagsNode = document.getElementById("miniV2DetailHeaderTags");
      detailCloseButtonNode = document.getElementById("miniV2DetailCloseButton");
      detailScrollNode = document.getElementById("miniV2DetailScroll");
      detailEmptyNode = document.getElementById("miniV2DetailEmpty");
      detailContentNode = document.getElementById("miniV2DetailContent");
    }

    function bindEvents() {
      root.addEventListener("click", handleRootClick);
      root.addEventListener("input", handleRootInput);
      root.addEventListener("change", handleRootChange);
      root.addEventListener("keydown", handleRootKeydown);
      facetPopoverNode.addEventListener("transitionend", handleFacetPopoverTransitionEnd);
      const facetLayoutObserver = new ResizeObserver(syncFacetPopoverMetrics);
      facetLayoutObserver.observe(facetPopoverBodyNode);
      facetLayoutObserver.observe(facetShellNode);
      facetLayoutObserver.observe(workspaceNode);
      detailPanelNode.addEventListener("transitionend", handleDetailPanelTransitionEnd);
      document.addEventListener("click", handleDocumentClick);
      document.addEventListener("pointerdown", handleDocumentPointerDown, true);
    }

    function enrichGroup(group) {
      const copies = group.copies.map(copy => ({ ...copy }));
      const available = copies.filter(copy => copy.currentLocation === copy.home).length;
      const total = copies.length;
      const checkedOut = total - available;
      const needsStickers = copies.some(copy => getStickerStatus(copy.sticker) === "Missing");
      const sharedSearchText = [
        group.name,
        group.rootId,
        group.home,
        group.size,
        group.creatureType,
        group.sex,
        group.race,
        group.role,
        group.set,
        group.setNumber,
        group.notes
      ].join(" ").toLowerCase();
      const searchText = [sharedSearchText]
        .concat(copies.map(copy => [copy.id, copy.sticker, copy.currentLocation, copy.note || ""].join(" ")))
        .join(" ")
        .toLowerCase();

      return { ...group, copies, available, total, checkedOut, needsStickers, sharedSearchText, searchText };
    }

    function getPaintValue(value) {
      if (value === true || value === "true") return "Painted";
      if (value === false || value === "false") return "Unpainted";
      const status = String(value ?? "").trim();
      return PAINT_OPTIONS.includes(status) ? status : "";
    }

    function getStickerStatus(value) {
      return String(value ?? "").trim() ? "Assigned" : "Missing";
    }

    function renderAll(options = {}) {
      const resumedEditor = !state.editor && state.editorDrafts[state.selectedRootId];
      if (resumedEditor) {
        state.editor = resumedEditor;
        delete state.editorDrafts[state.selectedRootId];
        if (!state.selectedCopyId) state.selectedCopyId = state.editor.selectedCopyId || "";
      }
      const rows = getBrowseRows();
      if (!options.keepSelection) ensureSelectionVisibility(rows);
      const selectedGroup = getSelectedGroup();
      root.classList.toggle("mini-v2-has-detail", !!selectedGroup);
      renderSummaryLane();
      renderListHeader(rows.length);
      renderLocationFilter();
      renderFacetBar();
      renderFacetFlyout();
      renderTable(rows);
      if (!options.keepDetail) renderDetail();
      syncDetailCopyTarget();
      return !!resumedEditor;
    }

    function renderAllPreservingScroll(existingState, options = {}) {
      const scrollState = existingState || captureScrollState();
      const restoreFocus = captureFocus();
      const resumedEditor = renderAll(options);
      if (resumedEditor && state.editor.editScroll) {
        scrollState.detailTop = state.editor.editScroll.detailTop;
        scrollState.detailTableLeft = state.editor.editScroll.detailTableLeft;
      }
      restoreFocus();
      restoreScrollState(scrollState);
      return scrollState;
    }

    function captureFocus() {
      const active = document.activeElement;
      if (!active || !root.contains(active)) return () => {};
      const identity = Array.from(active.attributes).filter(attribute =>
        attribute.name === "id" || attribute.name.startsWith("data-")
      );
      return () => {
        if (active.isConnected && !active.disabled && active.getClientRects().length) return;
        const replacement = identity.length && Array.from(root.querySelectorAll(active.tagName))
          .find(node => identity.every(attribute => node.getAttribute(attribute.name) === attribute.value));
        if (replacement && !replacement.disabled && replacement.getClientRects().length) {
          replacement.focus({ preventScroll: true });
        } else {
          (getSelectedGroup() ? detailCloseButtonNode : searchInputNode).focus({ preventScroll: true });
        }
      };
    }

    function renderSummaryLane() {
      const copies = state.groups.flatMap(group => group.copies);
      const missing = copies.filter(copy => getStickerStatus(copy.sticker) === "Missing").length;
      const away = copies.filter(copy => copy.currentLocation !== copy.home).length;
      const dirtyCount = copies.filter(isDirty).length;
      const draftCount = editorDraftIds().length;
      const hasWork = dirtyCount || draftCount || state.deletedGroups.length;
      const expanded = panel => String(state.summaryPanel === panel);
      const dashboard = `<button type="button" class="mini-v2-dashboard" disabled aria-label="Dashboard, coming soon">
        Dashboard <span>Soon</span></button>`;
      const shortcut = (view, count, label) => `<button type="button" class="mini-v2-summary-shortcut"
        data-action="collection-view" data-collection-view="${view}" aria-pressed="${state.collectionView === view}"
        title="${state.collectionView === view ? "Return to your previous browse view" : `Browse individual miniatures: ${label} (applied collection only)`}">
        <strong>${count}</strong> ${label}</button>`;
      const shortcuts = shortcut("away", away, "away") + shortcut("missing", missing, missing === 1 ? "missing sticker" : "missing stickers");

      const markup = `
        <div class="mini-v2-collection-overview">
          <span class="mini-v2-collection-total" title="${copies.length} miniatures across ${state.groups.length} groups. Unapplied drafts are excluded.">
            <strong>${copies.length}</strong> <span class="mini-v2-summary-wide">miniatures across</span><span class="mini-v2-summary-small">minis<span class="mini-v2-total-groups"> /</span></span>
            <span class="mini-v2-total-groups"><strong>${state.groups.length}</strong> ${state.groups.length === 1 ? "group" : "groups"}</span>
          </span>
          <span class="mini-v2-summary-desktop">${dashboard}</span>
        </div>
        <div class="mini-v2-summary-desktop mini-v2-summary-shortcuts">${shortcuts}</div>
        <div class="mini-v2-summary-compact">
          <button type="button" class="mini-v2-summary-control ${state.collectionView ? "has-work" : ""}" data-action="toggle-summary" data-summary-panel="collection"
            aria-label="Collection shortcuts${state.collectionView ? `, viewing ${state.collectionView === "away" ? "away from home" : "missing stickers"}` : ""}"
            aria-expanded="${expanded("collection")}" aria-controls="miniV2CollectionMenu">${state.collectionView === "away" ? "Away" : state.collectionView === "missing" ? "Stickers" : "Collection"}<span class="mini-v2-summary-caret" aria-hidden="true"></span></button>
          <div id="miniV2CollectionMenu" class="mini-v2-summary-popover" ${state.summaryPanel === "collection" ? "" : "hidden"}>
            <p class="mini-v2-summary-heading">Whole collection</p>
            <p class="mini-v2-summary-empty">${copies.length} miniatures / ${state.groups.length} ${state.groups.length === 1 ? "group" : "groups"}</p>${shortcuts}${dashboard}
          </div>
        </div>
        <div class="mini-v2-summary-recovery">
          <button type="button" class="mini-v2-summary-control ${hasWork ? "has-work" : ""}" data-action="toggle-summary" data-summary-panel="changes"
            aria-expanded="${expanded("changes")}" aria-controls="miniV2ChangesMenu"
            aria-label="Review changes${hasWork ? ", unfinished work or undo available" : ", no pending edits"}">
            <span class="mini-v2-work-indicator" aria-hidden="true"></span><span class="mini-v2-summary-wide">Review </span>Changes<span class="mini-v2-summary-caret" aria-hidden="true"></span>
          </button>
          <div id="miniV2ChangesMenu" class="mini-v2-summary-popover" ${state.summaryPanel === "changes" ? "" : "hidden"}>
            <p class="mini-v2-summary-heading">Review changes</p>
            ${dirtyCount ? `<button type="button" data-action="review-changes">Pending locations <span>${dirtyCount} ${dirtyCount === 1 ? "copy" : "copies"}</span></button>` : ""}
            ${draftCount ? `<button type="button" data-action="review-editor-drafts">Resume drafts <span>${draftCount} ${draftCount === 1 ? "group" : "groups"}</span></button>` : ""}
            ${state.deletedGroups.length ? `<button type="button" data-action="undo-delete-group">Undo deletion <span>${escapeHtml(state.deletedGroups.at(-1).group.name)}</span></button>` : ""}
            ${hasWork ? "" : '<p class="mini-v2-summary-empty">No pending edits.</p>'}
            <p class="mini-v2-summary-footnote">${previewMode ? "Preview" : "Demo"} only. Applied changes and drafts reset on reload.</p>
          </div>
        </div>
        <div id="miniV2DemoNotice" class="mini-v2-summary-popover mini-v2-demo-popover" ${state.summaryPanel === "demo" ? "" : "hidden"}>
          <p class="mini-v2-summary-heading">${previewMode ? "Real collection, temporary changes" : "Mock data only"}</p>
          <p>${previewMode ? "This preview reads the imported snapshot in 2.0. Save, Create, Delete, and location changes only affect this browser session. Reload restores the imported collection; neither spreadsheet is changed by the app. The old tracker is not synchronized." : "Save applies changes in this browser until reload. Your Google Sheet is not read or changed."}</p>
        </div>
      `;
      // Editor blur/change can follow pointerdown on the banner; keep unchanged buttons alive.
      if (markup !== summaryMarkup) {
        summaryLaneNode.innerHTML = markup;
        summaryMarkup = markup;
      }
      root.querySelector('[data-summary-panel="demo"]').setAttribute("aria-expanded", expanded("demo"));
    }

    function toggleSummaryPanel(panel) {
      state.summaryPanel = state.summaryPanel === panel ? "" : panel;
      renderSummaryLane();
      focusSummaryTrigger(panel);
    }

    function focusSummaryTrigger(panel) {
      const trigger = root.querySelector(`[data-summary-panel="${panel}"]`);
      if (trigger?.getClientRects().length) trigger.focus({ preventScroll: true });
      else root.querySelector('[data-summary-panel="changes"]').focus({ preventScroll: true });
    }

    function matchesCollectionView(copy) {
      if (state.collectionView === "away") return copy.currentLocation !== copy.home;
      if (state.collectionView === "missing") return getStickerStatus(copy.sticker) === "Missing";
      return true;
    }

    function openCollectionView(view) {
      if (!["away", "missing"].includes(view)) return;
      if (state.collectionView === view) { restorePreviousBrowse(); return; }
      // Keep the original browse context even when moving between collection shortcuts.
      if (!state.previousBrowse) state.previousBrowse = {
        browseMode: state.browseMode, search: state.search, locationFilter: state.locationFilter,
        filtersApplied: JSON.parse(JSON.stringify(state.filtersApplied)), sort: { ...state.sort },
        selectedRootId: state.selectedRootId, selectedCopyId: state.selectedCopyId,
        browseScroll: { ...state.browseScroll }, scroll: captureScrollState()
      };
      leaveEditor();
      state.collectionView = view;
      state.browseMode = "individuals";
      state.search = "";
      state.locationFilter = "all";
      state.filtersApplied = createEmptyFilterState();
      state.sort = { key: "", direction: "" };
      state.openFacetKey = "";
      state.locationMenuOpen = false;
      state.locationMenuSearch = "";
      state.summaryPanel = "";
      clearTimeout(copyRevealTimer);
      const candidates = getBrowseRows().filter(row => row.group.rootId === state.selectedRootId);
      const selected = candidates.find(row => row.copy.id === state.selectedCopyId) || candidates[0];
      state.selectedCopyId = selected?.copy.id || "";
      if (!selected) state.selectedRootId = "";
      const scroll = captureScrollState();
      scroll.tableTop = 0;
      scroll.tableLeft = 0;
      renderAllPreservingScroll(scroll);
      searchInputNode.focus({ preventScroll: true });
    }

    function restorePreviousBrowse() {
      const previous = state.previousBrowse;
      if (!previous) return;
      leaveEditor();
      clearTimeout(copyRevealTimer);
      const { scroll, ...browse } = previous;
      Object.assign(state, browse, { previousBrowse: null, collectionView: "", summaryPanel: "",
        openFacetKey: "", locationMenuOpen: false, locationMenuSearch: "" });
      if (!getSelectedGroup()) { state.selectedRootId = ""; state.selectedCopyId = ""; }
      renderAllPreservingScroll(scroll, { keepSelection: true });
      searchInputNode.focus({ preventScroll: true });
    }

    function getBrowseUnit(count) {
      const unit = state.browseMode === "individuals" ? "individual" : "group";
      return `${unit}${count === 1 ? "" : "s"}`;
    }

    function renderListHeader(visibleCount) {
      listHeaderNoteNode.textContent = `${visibleCount} ${getBrowseUnit(visibleCount)} shown`;
      const countNode = document.getElementById("miniV2BrowseCount");
      const scope = state.collectionView === "away" ? "Away from home" : state.collectionView === "missing" ? "Missing stickers" : "";
      countNode.textContent = scope ? `${scope}: ${visibleCount}` : `${visibleCount} ${getBrowseUnit(visibleCount)}`;
      countNode.title = scope ? `${visibleCount} ${getBrowseUnit(visibleCount)} shown: ${scope.toLowerCase()}` : listHeaderNoteNode.textContent;
      const clear = root.querySelector('[data-action="clear-filters"]');
      clear.textContent = scope ? "Back" : "Clear";
      clear.title = scope ? "Return to your previous browse view and filters" : "Clear all browse filters";
      searchInputNode.placeholder = scope ? `Search ${scope.toLowerCase()}...` : "Search name, sticker, or details...";
      searchInputNode.setAttribute("aria-label", scope ? `Search within ${scope.toLowerCase()}` : "Search name, sticker, or details");
      root.querySelectorAll("button[data-browse-mode]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.browseMode === state.browseMode));
      });
    }

    function renderLocationFilter() {
      searchInputNode.value = state.search;
      locationComboboxNode.classList.toggle("is-open", state.locationMenuOpen);
      locationLabelNode.textContent = state.locationFilter === "all" ? "All locations" : state.locationFilter;
      const locationMeaning = state.browseMode === "individuals" ? "Current location" : "Home or current location";
      locationTriggerNode.setAttribute("aria-label", `${locationMeaning}: ${locationLabelNode.textContent}`);
      locationTriggerNode.title = `Filter by ${locationMeaning.toLowerCase()} (last saved locations)`;
      locationTriggerNode.setAttribute("aria-expanded", state.locationMenuOpen ? "true" : "false");
      locationTriggerNode.classList.toggle("is-active", state.locationFilter !== "all");
      locationTriggerNode.classList.toggle("is-open", state.locationMenuOpen);
      locationClearNode.hidden = true;
      locationPopoverNode.hidden = !state.locationMenuOpen;
      locationSearchNode.value = state.locationMenuSearch;

      const query = state.locationMenuSearch.trim().toLowerCase();
      const matchingLocations = state.locations.filter(location => location.toLowerCase().includes(query));
      const options = [
        {
          value: "all",
          label: "All locations"
        }
      ].concat(matchingLocations.map(location => ({
        value: location,
        label: location
      })));

      if (!options.length) {
        locationOptionsNode.innerHTML = `<div class="mini-v2-combobox-empty">No locations found.</div>`;
        return;
      }

      locationOptionsNode.innerHTML = options.map(option => `
        <button
          class="mini-v2-combobox-option ${state.locationFilter === option.value ? "is-selected" : ""}"
          type="button"
          role="option"
          aria-selected="${state.locationFilter === option.value ? "true" : "false"}"
          data-action="set-location-filter"
          data-location-value="${escapeHtml(option.value)}"
        >
          <span class="mini-v2-combobox-option-label">${escapeHtml(option.label)}</span>
          ${state.locationFilter === option.value ? '<span class="mini-v2-combobox-option-check" aria-hidden="true">✓</span>' : ""}
        </button>
      `).join("");
    }

    function renderFacetBar() {
      const facetConfigs = getFacetConfigs();
      facetBarNode.innerHTML = facetConfigs.map(config => renderFacetButton(config)).join("");
    }

    function renderFacetButton(config) {
      const count = getFacetCount(config.key);
      const isActive = count > 0;
      const isOpen = state.openFacetKey === config.key;

      return `
        <button
          class="mini-v2-facet-btn ${isActive ? "is-active" : ""} ${isOpen ? "is-open" : ""}"
          type="button"
          data-action="toggle-facet"
          data-facet-key="${escapeHtml(config.key)}"
          aria-pressed="${isActive ? "true" : "false"}"
          aria-expanded="${isOpen ? "true" : "false"}"
        >
          <span class="mini-v2-facet-label">${escapeHtml(config.label)}</span>
          ${count > 1 ? `<span class="mini-v2-facet-count">${count}</span>` : ""}
        </button>
      `;
    }

    function getFacetCount(facetKey) {
      if (facetKey === "more") {
        return state.filtersApplied.roles.length
          + state.filtersApplied.paints.length
          + (state.filtersApplied.set ? 1 : 0)
          + state.filtersApplied.stickers.length;
      }

      const values = state.filtersApplied[facetKey];
      return Array.isArray(values) ? values.length : 0;
    }

    function clearOpenFacetSelections() {
      if (state.openFacetKey === "more") {
        state.filtersApplied.roles = [];
        state.filtersApplied.paints = [];
        state.filtersApplied.set = "";
        state.filtersApplied.stickers = [];
        return;
      }

      if (!state.openFacetKey) return;
      if (Array.isArray(state.filtersApplied[state.openFacetKey])) {
        state.filtersApplied[state.openFacetKey] = [];
      }
    }

    function toggleAppliedFacetValue(kind, value) {
      if (!kind || !value || !Array.isArray(state.filtersApplied[kind])) return;
      const nextValues = state.filtersApplied[kind].slice();
      const existingIndex = nextValues.indexOf(value);
      if (existingIndex >= 0) {
        nextValues.splice(existingIndex, 1);
      } else {
        nextValues.push(value);
      }
      state.filtersApplied[kind] = nextValues;
    }

    function renderFacetFlyout() {
      if (!facetPopoverNode) return;

      const activeConfig = getFacetConfigs().find(config => config.key === state.openFacetKey) || null;
      facetShellNode.classList.toggle("has-open-facet", !!activeConfig);

      if (activeConfig) {
        const wasHidden = facetPopoverNode.hidden;
        const previousFacetKey = facetPopoverNode.getAttribute("data-facet-key") || "";
        const startHeight = !wasHidden ? facetPopoverNode.getBoundingClientRect().height : 0;
        const activeCount = getFacetCount(activeConfig.key);
        facetPopoverTitleNode.textContent = activeConfig.label;
        facetPopoverClearNode.disabled = !activeCount;
        facetPopoverBodyNode.innerHTML = renderFacetFlyoutBody(activeConfig);
        facetPopoverNode.setAttribute("data-facet-key", activeConfig.key);
        if (previousFacetKey !== activeConfig.key) {
          facetPopoverBodyNode.scrollTop = 0;
        }

        if (facetHideTimer) {
          clearTimeout(facetHideTimer);
          facetHideTimer = null;
        }

        if (wasHidden) {
          facetPopoverNode.style.height = "";
          facetPopoverNode.hidden = false;
          requestAnimationFrame(() => {
            facetPopoverNode.classList.add("is-visible");
          });
        } else {
          facetPopoverNode.classList.add("is-visible");
          animateFacetPopoverHeight(startHeight);
          if (previousFacetKey && previousFacetKey !== activeConfig.key) {
            animateFacetPopoverSwap();
          }
        }
        syncFacetPopoverMetrics();
        return;
      }

      facetPopoverNode.classList.remove("is-visible");
      facetPopoverNode.style.height = "";
      if (facetHideTimer) {
        clearTimeout(facetHideTimer);
      }
      facetHideTimer = setTimeout(() => {
        if (!state.openFacetKey) {
          facetPopoverNode.hidden = true;
          facetPopoverNode.removeAttribute("data-facet-key");
        }
        facetHideTimer = null;
      }, 180);
    }

    function syncFacetPopoverMetrics() {
      if (!facetPopoverBodyNode) return;
      if (state.openFacetKey === "more") {
        const workspace = workspaceNode.getBoundingClientRect();
        const shell = facetShellNode.getBoundingClientRect();
        const below = Math.min(window.innerHeight, workspace.bottom) - shell.bottom - 16;
        const above = shell.top - Math.max(0, workspace.top) - 16;
        const flipped = below < 160 && above > below;
        facetPopoverNode.setAttribute("data-facet-placement", flipped ? "above" : "below");
        const height = `${Math.max(80, Math.floor(flipped ? above : below))}px`;
        if (facetPopoverNode.style.getPropertyValue("--mini-v2-facet-available-height") !== height) {
          facetPopoverNode.style.setProperty("--mini-v2-facet-available-height", height);
        }
      } else {
        facetPopoverNode.removeAttribute("data-facet-placement");
      }
      // Spend existing right padding on a non-overlay scrollbar, not column width.
      const width = state.openFacetKey === "more"
        ? facetPopoverBodyNode.offsetWidth - facetPopoverBodyNode.clientWidth : 0;
      const value = `${width}px`;
      if (facetPopoverBodyNode.style.getPropertyValue("--mini-v2-facet-scrollbar-width") !== value) {
        facetPopoverBodyNode.style.setProperty("--mini-v2-facet-scrollbar-width", value);
      }
    }

    function animateFacetPopoverHeight(startHeight) {
      if (!facetPopoverNode || !startHeight) return;

      facetPopoverNode.style.height = "auto";
      const endHeight = facetPopoverNode.getBoundingClientRect().height;

      if (!endHeight || Math.abs(endHeight - startHeight) < 2) {
        facetPopoverNode.style.height = "";
        return;
      }

      facetPopoverNode.style.height = `${Math.round(startHeight)}px`;
      facetPopoverNode.getBoundingClientRect();
      requestAnimationFrame(() => {
        facetPopoverNode.style.height = `${Math.round(endHeight)}px`;
      });
    }

    function animateFacetPopoverSwap() {
      if (!facetPopoverBodyNode) return;

      facetPopoverBodyNode.classList.remove("is-swapping");
      facetPopoverBodyNode.getBoundingClientRect();
      facetPopoverBodyNode.classList.add("is-swapping");

      if (facetSwapTimer) {
        clearTimeout(facetSwapTimer);
      }
      facetSwapTimer = setTimeout(() => {
        facetPopoverBodyNode.classList.remove("is-swapping");
        facetSwapTimer = null;
      }, 170);
    }

    function renderFacetFlyoutBody(config) {
      if (Object.hasOwn(FACET_FIELDS, config.key)) {
        return renderFacetTileGrid(config.key, getFacetOptions(config.key), state.filtersApplied[config.key], "is-three-col");
      }

      if (config.key === "more") {
        return `
          <div class="mini-v2-facet-more">
            ${renderFacetGroup("Role", renderFacetTileGrid("roles", getFacetOptions("roles"), state.filtersApplied.roles, "is-three-col"))}
            ${renderSetFilter()}
            ${renderFacetGroup("Paint status", renderFacetTileGrid("paints", PAINT_OPTIONS, state.filtersApplied.paints, "is-three-col mini-v2-facet-paint-grid"))}
            ${renderFacetGroup("Stickers", renderFacetTileGrid("stickers", STICKER_FILTER_OPTIONS, state.filtersApplied.stickers, "is-three-col"))}
          </div>
        `;
      }

      return "";
    }

    function getFacetOptions(kind) {
      const known = FILTER_OPTIONS[kind];
      const field = FACET_FIELDS[kind];
      const extra = [...new Set(state.groups.map(group => group[field]).concat(state.filtersApplied[kind]))]
        .filter(value => value && value !== UNSPECIFIED_VALUE && !known.includes(value))
        .sort(compareText);
      return [...known, ...extra, UNSPECIFIED_VALUE];
    }

    function renderSetFilter() {
      const selected = state.filtersApplied.set;
      const options = [...new Set([...state.sets, ...state.groups.map(group => group.set), selected, "n/a", UNSPECIFIED_VALUE])]
        .filter(Boolean).sort(compareText);
      return `<div class="mini-v2-facet-group">
        <label class="mini-v2-facet-group-label" for="miniV2SetFilter">Set</label>
        <select id="miniV2SetFilter" class="mini-v2-facet-select" data-filter-set title="${escapeHtml(selected || "All sets")}">
          <option value="">All sets</option>
          ${options.map(value => `<option value="${escapeHtml(value)}"${value === selected ? " selected" : ""}>${escapeHtml(value)}</option>`).join("")}
        </select>
      </div>`;
    }

    function getFacetConfigs() {
      return [
        { key: "sizes", label: "Size" },
        { key: "creatureTypes", label: "Type" },
        { key: "races", label: "Race" },
        { key: "sexes", label: "Sex" },
        { key: "more", label: "More" }
      ];
    }

    function renderFacetGroup(label, bodyMarkup) {
      return `
        <section class="mini-v2-facet-group">
          <div class="mini-v2-facet-group-label">${escapeHtml(label)}</div>
          ${bodyMarkup}
        </section>
      `;
    }

    function renderFacetTileGrid(kind, options, selectedValues, layoutClass) {
      return `
        <div class="mini-v2-facet-tile-grid ${layoutClass}">
          ${options.map(option => renderFacetTile(kind, option, selectedValues.includes(option))).join("")}
        </div>
      `;
    }

    function renderFacetTile(kind, value, isSelected) {
      const label = kind === "paints" && value === "Work in Progress" ? "In Progress" : value;
      const title = kind === "stickers"
        ? value === "Assigned" ? "Copies with an ID or explicit n/a; groups match if any copy qualifies."
          : "Copies with a blank ID; groups match if any copy qualifies."
        : value;
      return `
        <button
          class="mini-v2-facet-tile ${isSelected ? "is-selected" : ""}"
          type="button"
          data-action="toggle-facet-value"
          data-facet-kind="${escapeHtml(kind)}"
          data-facet-value="${escapeHtml(value)}"
          title="${escapeHtml(title)}"
          aria-label="${escapeHtml(value)}"
          aria-pressed="${isSelected ? "true" : "false"}"
        >
          <span class="mini-v2-facet-tile-check" aria-hidden="true">${isSelected ? "x" : ""}</span>
          <span class="mini-v2-facet-tile-label">${escapeHtml(label)}</span>
        </button>
      `;
    }

    function renderTable(browseRows) {
      const individuals = state.browseMode === "individuals";

      if (!browseRows.length) {
        tableScrollNode.innerHTML = `
          <div class="mini-v2-list-wrap">
            <div class="mini-v2-empty">No ${getBrowseUnit(0)} match those filters.</div>
          </div>
        `;
        return;
      }

      const rows = browseRows.map(({ group, copy }) => {
        const status = getStatusKey(group);
        const selected = group.rootId === state.selectedRootId && (!copy || copy.id === state.selectedCopyId);
        const dirty = copy && isDirty(copy);
        const copyLabel = copy ? `${copy.sticker || `No sticker, copy ${copy.miniNumber}`}, ${group.name}` : "";
        return `
          <tr class="mini-v2-row ${selected ? "is-selected" : ""} ${dirty ? "has-pending-copy" : ""}" data-group-id="${escapeHtml(group.rootId)}"${copy ? ` data-copy-id="${escapeHtml(copy.id)}" aria-label="${escapeHtml(copyLabel)}${dirty ? ", unsaved location change" : ""}"` : ""}${selected ? ' aria-current="true"' : ""} tabindex="0">
            <td class="mini-v2-cell mini-v2-cell-avail${!copy && group.total >= 100 ? " has-wide-count" : ""}">
              ${copy
                ? `<span class="mini-v2-individual-id" title="${escapeHtml(copyLabel)}${dirty ? "; unsaved location change" : ""}">${escapeHtml(copy.sticker || "No ID")}</span>`
                : `<span class="mini-v2-count mini-v2-count--browse ${statusClass(status)}" title="${group.available} of ${group.total} available">${group.available}/${group.total}</span>`}
            </td>
            <td class="mini-v2-cell mini-v2-cell-name"><div class="mini-v2-name" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</div></td>
            <td class="mini-v2-cell mini-v2-cell-home">${copy ? renderBrowseCopyLocation(copy) : `<span title="${escapeHtml(group.home)}">${escapeHtml(group.home)}</span>`}</td>
            <td class="mini-v2-cell mini-v2-cell-size" title="${escapeHtml(group.size)}">${escapeHtml(group.size)}</td>
            <td class="mini-v2-cell mini-v2-cell-type" title="${escapeHtml(group.creatureType)}">${escapeHtml(group.creatureType)}</td>
            <td class="mini-v2-cell mini-v2-cell-race" title="${escapeHtml(group.race || "n/a")}">${escapeHtml(group.race || "n/a")}</td>
            <td class="mini-v2-cell mini-v2-cell-sex" title="${escapeHtml(group.sex || "n/a")}">${escapeHtml(group.sex || "n/a")}</td>
            <td class="mini-v2-cell mini-v2-cell-role" title="${escapeHtml(group.role || "n/a")}">${escapeHtml(group.role || "n/a")}</td>
          </tr>
        `;
      }).join("");

      tableScrollNode.innerHTML = `
        <div class="mini-v2-list-wrap">
          <table class="mini-v2-table mini-v2-browse-table${individuals ? " is-individuals" : ""}" aria-label="${individuals ? "Individual miniatures" : "Miniature groups"}">
            <thead>
              <tr>
                ${renderSortHeader("mini-v2-cell-avail", individuals ? "sticker" : "avail", individuals ? "ID" : "#", individuals ? "Sticker ID" : "Available")}
                ${renderSortHeader("mini-v2-cell-name", "name", "Name")}
                ${renderSortHeader("mini-v2-cell-home", individuals ? "currentLocation" : "home", individuals ? "Current Location" : "Home")}
                ${renderSortHeader("mini-v2-cell-size", "size", "Size")}
                ${renderSortHeader("mini-v2-cell-type", "type", "Type")}
                ${renderSortHeader("mini-v2-cell-race", "race", "Race")}
                ${renderSortHeader("mini-v2-cell-sex", "sex", "Sex")}
                ${renderSortHeader("mini-v2-cell-role", "role", "Role")}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderBrowseCopyLocation(copy) {
      const away = copy.currentLocation !== copy.home;
      const label = away ? "Away" : "Home";
      const title = `${copy.currentLocation} (${label}); home: ${copy.home}${isDirty(copy) ? `; pending move to ${getEffectiveLocation(copy)} (not saved)` : ""}`;
      return `
        <div class="mini-v2-individual-location" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}">
          <span class="mini-v2-individual-location-label">${escapeHtml(copy.currentLocation)}</span>
          <span class="mini-v2-copy-status ${away ? "is-away" : "is-home"}">${label}</span>
        </div>
      `;
    }

    function renderDetail() {
      const group = getSelectedGroup();
      const editing = !!state.editor;
      const editButton = root.querySelector('.mini-v2-detail-header-actions button:first-child');
      editButton.hidden = !group;
      editButton.textContent = editing ? "Discard" : "Edit";
      editButton.dataset.action = editing ? "discard-edit" : "edit-mini";
      editButton.title = editing ? "Discard this editor draft and return to details" : "Edit this miniature";
      detailCloseButtonNode.textContent = "Close";
      detailCloseButtonNode.dataset.action = "close-detail";
      detailCloseButtonNode.title = editing ? "Close and keep your draft until reload" : "Close details";
      detailPanelNode.classList.toggle("is-editing", editing);
      detailHeaderTitleNode.hidden = editing;
      const nameInput = document.getElementById("miniV2EditName");
      nameInput.hidden = !editing;
      nameInput.placeholder = "Miniature name";

      if (group && editing) {
        detailEmptyNode.hidden = true;
        detailContentNode.hidden = false;
        detailCloseButtonNode.disabled = false;
        // Preserve live controls and caret positions across browse/filter rerenders.
        if (detailContentNode.querySelector(".mini-v2-editor")?.dataset.editorRoot !== group.rootId) {
          nameInput.removeAttribute("aria-invalid");
          nameInput.removeAttribute("aria-describedby");
          nameInput.value = state.editor.fields.name;
          renderEditor(group);
        }
        syncEditorFeedback();
        return;
      }

      if (!group) {
        detailHeaderTitleNode.textContent = "Mini Details";
        detailHeaderTagsNode.innerHTML = "";
        detailEmptyNode.hidden = false;
        detailContentNode.hidden = true;
        detailCloseButtonNode.disabled = true;
        return;
      }

      const dirtyCount = group.copies.filter(isDirty).length;
      const missingFieldLabels = getMissingFieldLabels(group);
      const missingFieldCount = missingFieldLabels.length;
      const canSetAllHome = group.copies.some(copy => getEffectiveLocation(copy) !== copy.home);
      const collectionSummary = getCollectionSummary(group);
      detailHeaderTitleNode.textContent = group.name;
      detailHeaderTagsNode.innerHTML = [
        missingFieldCount
          ? renderDetailTag(
            `${missingFieldCount} missing field${missingFieldCount === 1 ? "" : "s"}`,
            "is-warn",
            `Missing: ${missingFieldLabels.join(", ")}`
          )
          : renderDetailTag("Ready", "is-success"),
        dirtyCount ? renderDetailTag(`Unsaved ${dirtyCount}`, "is-warn") : ""
      ].join("");
      detailCloseButtonNode.disabled = false;
      detailEmptyNode.hidden = true;
      detailContentNode.hidden = false;

      detailContentNode.innerHTML = `
        <div class="mini-v2-detail-panel">
          ${getBrowseRows().some(row => row.group.rootId === group.rootId) ? "" : '<p class="mini-v2-editor-scope" role="status">This group is outside your current browse filters.</p>'}
          <section class="mini-v2-detail-group">
            <div class="mini-v2-detail-group-title">Details</div>
            <div class="mini-v2-detail-grid">
              ${renderReadCard("Size", group.size)}
              ${renderReadCard("Creature Type", group.creatureType)}
              ${renderReadCard("Race", group.race || "n/a")}
              ${renderReadCard("Sex", group.sex)}
              ${renderReadCard("Role", group.role || "n/a")}
            </div>
          </section>

          <section class="mini-v2-detail-group">
            <div class="mini-v2-detail-group-title">Miniature</div>
            <div class="mini-v2-product-grid">
              ${renderReadCard("Set", collectionSummary, { marquee: true, wide: true })}
              ${renderReadCard("Paint", getPaintValue(group.paint) || "—")}
            </div>
          </section>

          <section class="mini-v2-detail-group mini-v2-inventory-block">
            <div class="mini-v2-detail-group-title">Inventory</div>
            ${renderCopyGrid(group)}
            <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
              <button class="button mini-v2-copy-btn" type="button" data-action="reset-changes" title="Discard pending location changes for this entire group"${dirtyCount ? "" : " disabled"}>Reset</button>
              <button class="button mini-v2-copy-btn mini-v2-secondary" type="button" data-action="set-all-home" title="Stage all ${group.total} copies in this group home, including copies outside the browse filter"${canSetAllHome ? "" : " disabled"}>Set All Home</button>
              <button class="button mini-v2-copy-btn mini-v2-primary" type="button" data-action="save-changes" title="Apply pending location changes in this browser until reload; no spreadsheet changes"${dirtyCount ? "" : " disabled"}>Save Changes</button>
            </div>
          </section>

          <section class="mini-v2-detail-group">
            <div class="mini-v2-note-card">
              <div class="mini-v2-note-label">Notes</div>
              ${renderReadValue(group.notes || "No notes yet.", { marquee: true, className: "mini-v2-note-body" })}
            </div>
          </section>
        </div>
      `;

      scheduleDetailMarqueeSync(260);
    }

    function editorSnapshot(editor = state.editor) {
      return editor ? JSON.stringify({ fields: editor.fields, copies: editor.copies,
        addedCopies: editor.addedCopies, removedCopyIds: editor.removedCopyIds }) : "";
    }

    function editorHasChanges() {
      return !!state.editor && (state.editor.isNew || editorSnapshot() !== state.editor.initial);
    }

    function editorDraftIds() {
      return Array.from(new Set([...Object.keys(state.editorDrafts), ...(editorHasChanges() ? [state.editor.rootId] : [])]));
    }

    function beginEditor(isNew = false, returnSelection = null) {
      const group = getSelectedGroup();
      if (!group || state.editor) return;
      isNew = isNew || Object.hasOwn(state.newGroups, group.rootId);
      clearTimeout(copyRevealTimer);
      clearTimeout(detailMarqueeSyncTimer);
      detailPanelNode.style.setProperty("--mini-v2-editor-header-height", `${detailPanelNode.querySelector(".mini-v2-detail-header").getBoundingClientRect().height}px`);
      document.getElementById("miniV2EditName").removeAttribute("aria-invalid");
      document.getElementById("miniV2EditName").removeAttribute("aria-describedby");
      state.editor = {
        rootId: group.rootId,
        isNew,
        returnSelection,
        fields: Object.fromEntries(EDIT_FIELDS.map(key => [key, key === "paint"
          ? getPaintValue(group.paint) : String(group[key] ?? "")])),
        copies: Object.fromEntries(group.copies.map(copy => [copy.id, {
          note: copy.note || "", sticker: copy.sticker || "", currentLocation: getEffectiveLocation(copy)
        }])),
        stickerCursors: [],
        addedCopies: [],
        removedCopyIds: [],
        hasPendingLocations: group.copies.some(isDirty),
        readScroll: captureScrollState()
      };
      state.editor.initial = editorSnapshot();
      const scroll = captureScrollState();
      scroll.detailTop = 0;
      renderAllPreservingScroll(scroll, { keepSelection: true });
      document.getElementById("miniV2EditName").focus({ preventScroll: true });
    }

    function newMockId(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${state.nextMockId++}`;
    }

    function beginNewGroup() {
      const existingId = Object.keys(state.newGroups)[0];
      if (state.editor?.isNew) {
        document.getElementById("miniV2EditName").focus({ preventScroll: true });
        revealDetailOnSmallScreen();
        return;
      }
      const returnSelection = { rootId: state.selectedRootId, copyId: state.selectedCopyId };
      leaveEditor();
      if (existingId) {
        state.selectedRootId = existingId;
        state.selectedCopyId = "";
        renderAllPreservingScroll(null, { keepSelection: true });
      } else {
        const rootId = newMockId("mock-group");
        state.newGroups[rootId] = enrichGroup({
          rootId, ...Object.fromEntries(EDIT_FIELDS.map(key => [key, ""])),
          originalOrder: Math.max(-1, ...state.groups.map(group => group.originalOrder)) + 1,
          copies: []
        });
        state.selectedRootId = rootId;
        state.selectedCopyId = "";
        beginEditor(true, returnSelection);
        addEditorCopy(false);
      }
      document.getElementById("miniV2EditName").focus({ preventScroll: true });
      revealDetailOnSmallScreen();
    }

    function editorBaseCopies(group = getSelectedGroup()) {
      return state.editor ? group.copies.concat(state.editor.addedCopies) : group.copies;
    }

    function retainedEditorCopies(group = getSelectedGroup()) {
      return editorBaseCopies(group).filter(copy => !state.editor?.removedCopyIds.includes(copy.id));
    }

    function sequentialStickerIndex(value) {
      const match = /^([A-Z])(\d{2})$/.exec(String(value || "").trim().toUpperCase());
      return match ? (match[1].charCodeAt(0) - 65) * 100 + Number(match[2]) : null;
    }

    function stickerCode(index) {
      return index < 2600
        ? String.fromCharCode(65 + Math.floor(index / 100)) + String(index % 100).padStart(2, "0") : "";
    }

    function loadNextStickerStart() {
      if (stickerCatalog) return 0;
      try {
        const stored = previewMode ? null : window.localStorage.getItem(NEXT_STICKER_STORAGE_KEY);
        if (stored === "end") return 2600;
        const index = sequentialStickerIndex(stored);
        if (index !== null) return index;
      } catch {
        // Embedded browsers may block local storage; collection scanning still works.
      }
      let latest = -1;
      state.groups.forEach(group => group.copies.forEach(copy => {
        const index = sequentialStickerIndex(copy.sticker);
        if (index !== null) latest = Math.max(latest, index);
      }));
      return latest + 1;
    }

    function availableStickerFrom(start, used) {
      if (stickerCatalog) {
        const free = code => !used.has(code);
        return stickerCatalog.find(code => sequentialStickerIndex(code) >= start && free(code))
          || stickerCatalog.find(free) || "";
      }
      for (let index = start; index < 2600; index++) {
        const code = stickerCode(index);
        if (!used.has(code)) return code;
      }
      return "";
    }

    function editorStickerCursor(editor) {
      return editor?.stickerCursors.findLast(cursor => !editor.removedCopyIds.includes(cursor.copyId)
        && String(editor.copies[cursor.copyId]?.sticker || "").trim().toUpperCase() === cursor.sticker);
    }

    function preferredStickerCursor() {
      let preferred = { start: state.nextStickerStart, revision: state.nextStickerRevision };
      [state.editor, ...Object.values(state.editorDrafts)].forEach(editor => {
        const cursor = editorStickerCursor(editor);
        if (cursor && cursor.revision > preferred.revision) preferred = cursor;
      });
      return preferred;
    }

    function recordStickerCursor(copyId, start) {
      state.editor.stickerCursors.push({ copyId, start, revision: ++state.stickerCursorRevision,
        sticker: String(state.editor.copies[copyId].sticker).trim().toUpperCase() });
    }

    function rememberNextStickerStart(editor) {
      const assigned = new Set(state.groups.flatMap(group => group.copies)
        .map(copy => String(copy.sticker || "").trim().toUpperCase()));
      // Only the saved editor can commit a sequence preference; other drafts remain temporary.
      const cursor = editorStickerCursor(editor);
      if (cursor && cursor.revision > state.nextStickerRevision) {
        state.nextStickerStart = cursor.start;
        state.nextStickerRevision = cursor.revision;
      }
      const next = availableStickerFrom(state.nextStickerStart, assigned);
      state.nextStickerStart = next ? sequentialStickerIndex(next) : 2600;
      // A preview reload must also reset ID suggestions, regardless of old mock preferences.
      if (previewMode || stickerCatalog) return;
      try {
        window.localStorage.setItem(NEXT_STICKER_STORAGE_KEY, next || "end");
      } catch {
        // The in-memory counter remains usable when storage is unavailable.
      }
    }

    function reservedStickerIds(excludeRootId = "") {
      const used = new Set();
      const reserve = value => {
        const id = String(value || "").trim().toUpperCase();
        if (id && id !== "N/A") used.add(id);
      };
      state.groups.filter(group => group.rootId !== excludeRootId)
        .concat(state.deletedGroups.map(record => record.group))
        .forEach(group => group.copies.forEach(copy => reserve(copy.sticker)));
      [state.editor, ...Object.values(state.editorDrafts), ...state.deletedGroups.map(record => record.editor)]
        .filter(editor => editor && editor.rootId !== excludeRootId)
        .forEach(editor => Object.values(editor.copies).forEach(copy => reserve(copy.sticker)));
      return used;
    }

    function nextStickerSuggestion() {
      // Scan reservations instead of consuming a code when it is merely suggested.
      return availableStickerFrom(preferredStickerCursor().start, reservedStickerIds());
    }

    function nextBlankStickerCopy() {
      return state.editor && retainedEditorCopies().find(copy => !String(state.editor.copies[copy.id]?.sticker || "").trim());
    }

    function syncNextStickerAction() {
      const button = detailContentNode.querySelector('[data-action="apply-next-sticker"]');
      if (!button) return;
      const code = nextStickerSuggestion();
      const target = nextBlankStickerCopy();
      button.textContent = code ? `Apply ${code}` : "Apply next ID";
      button.disabled = !code || !target;
      button.title = !code ? (stickerCatalog ? "No available IDs remain in the sticker catalog." : "No available IDs remain through Z99. Enter a different starting ID.")
        : !target ? "Add a new copy or leave a copy's ID blank to apply this sticker."
        : `Apply ${code} to copy ${target.miniNumber}, the first blank ID. Does not add a row or change the selection.`;
    }

    function applyNextSticker() {
      const copy = nextBlankStickerCopy();
      const code = nextStickerSuggestion();
      if (!copy || !code) return;
      const start = preferredStickerCursor().start;
      state.editor.copies[copy.id].sticker = code;
      recordStickerCursor(copy.id, start);
      const input = detailContentNode.querySelector(`[data-edit-copy-sticker="${copy.id}"]`);
      input.value = code;
      input.title = code;
      clearEditorError();
      syncEditorFeedback();
    }

    function refreshEditorCopies() {
      const scroll = captureScrollState();
      const grid = detailContentNode.querySelector(".mini-v2-copy-grid");
      grid.outerHTML = renderCopyGrid(getSelectedGroup());
      syncEditorFeedback();
      syncDetailCopyTarget();
      restoreScrollState(scroll);
    }

    function addEditorCopy(focus = true) {
      if (!state.editor) return;
      const group = getSelectedGroup();
      const number = Math.max(0, ...editorBaseCopies(group).map(copy => copy.miniNumber || 0)) + 1;
      const copy = { id: newMockId("mock-copy"), miniNumber: number, sticker: "", note: "",
        home: state.editor.fields.home, currentLocation: state.editor.fields.home };
      state.editor.addedCopies.push(copy);
      state.editor.copies[copy.id] = { note: "", sticker: "", currentLocation: copy.currentLocation, followsHome: true };
      refreshEditorCopies();
      if (focus) {
        const input = detailContentNode.querySelector(`[data-edit-copy-sticker="${copy.id}"]`);
        input.focus({ preventScroll: true });
        input.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    function removeEditorCopy(copyId) {
      if (!state.editor) return;
      const copy = editorBaseCopies().find(item => item.id === copyId);
      if (!copy) return;
      if (!state.editor.addedCopies.includes(copy) && retainedEditorCopies().length <= 1) {
        showEditorError("A group needs at least one copy. Use Delete group to remove the whole entry.",
          detailContentNode.querySelector('[data-action="delete-group"]'));
        return;
      }
      if (state.editor.addedCopies.includes(copy)) {
        state.editor.addedCopies = state.editor.addedCopies.filter(item => item.id !== copyId);
        delete state.editor.copies[copyId];
      } else state.editor.removedCopyIds.push(copyId);
      refreshEditorCopies();
      detailContentNode.querySelector('[data-action="add-copy"]').focus({ preventScroll: true });
    }

    function undoEditorCopyRemoval(copyId) {
      if (!state.editor) return;
      state.editor.removedCopyIds = state.editor.removedCopyIds.filter(id => id !== copyId);
      refreshEditorCopies();
      detailContentNode.querySelector(`[data-remove-copy="${copyId}"]`).focus({ preventScroll: true });
    }

    function leaveEditor() {
      if (!state.editor) return true;
      if (editorHasChanges()) {
        state.editor.editScroll = captureScrollState();
        state.editor.selectedCopyId = state.selectedCopyId;
        state.editorDrafts[state.editor.rootId] = state.editor;
      } else {
        delete state.editorDrafts[state.editor.rootId];
      }
      state.editor = null;
      return true;
    }

    function discardEditor() {
      const scroll = state.editor?.readScroll;
      if (!state.editor) return;
      const editor = state.editor;
      delete state.editorDrafts[state.editor.rootId];
      state.editor = null;
      if (editor.isNew) {
        delete state.newGroups[editor.rootId];
        state.selectedRootId = editor.returnSelection?.rootId || "";
        state.selectedCopyId = editor.returnSelection?.copyId || "";
      }
      const currentScroll = captureScrollState();
      if (scroll) {
        currentScroll.detailTop = scroll.detailTop;
        currentScroll.detailTableLeft = scroll.detailTableLeft;
      }
      renderAllPreservingScroll(currentScroll, { keepSelection: true });
      root.querySelector(getSelectedGroup() ? '[data-action="edit-mini"], [data-action="discard-edit"]' : '[data-action="new-group"]').focus({ preventScroll: true });
    }

    function renderEditSelect(key, label, options) {
      return `<label class="mini-v2-edit-field">
        <span class="mini-v2-field-label">${escapeHtml(label)}</span>
        <select data-edit-field="${key}" aria-label="${escapeHtml(label)}">${renderEditOptions(key, options)}</select>
      </label>`;
    }

    function renderEditOptions(key, options) {
      const value = state.editor.fields[key];
      const choices = key === "paint" ? ["", ...PAINT_OPTIONS] : Array.from(new Set([
        ...(key === "home" && value ? [] : [""]), ...options,
        ...(Object.hasOwn(EDIT_REQUIRED_CHOICES, key) ? [UNSPECIFIED_VALUE] : []), value]));
      return choices.map(option =>
        `<option value="${escapeHtml(option)}"${option === value ? " selected" : ""}>${escapeHtml(option)}</option>`).join("");
    }

    function renderEditor(group) {
      const fields = state.editor.fields;
      detailContentNode.innerHTML = `<div class="mini-v2-detail-panel mini-v2-editor" data-editor-root="${escapeHtml(group.rootId)}">
        <section class="mini-v2-detail-group">
          <div class="mini-v2-editor-section-heading">
            <div class="mini-v2-detail-group-title">Details</div>
            <span class="mini-v2-editor-scope" data-copy-scope></span></div>
          ${state.editor.isNew ? '<p class="mini-v2-editor-scope mini-v2-new-match" hidden></p>' : ""}
          <div class="mini-v2-detail-grid">
            ${renderEditSelect("size", "Size", FILTER_OPTIONS.sizes)}
            ${renderEditSelect("creatureType", "Creature Type", FILTER_OPTIONS.creatureTypes)}
            ${renderEditSelect("race", "Race", FILTER_OPTIONS.races)}
            ${renderEditSelect("sex", "Sex", FILTER_OPTIONS.sexes)}
            ${renderEditSelect("role", "Role", FILTER_OPTIONS.roles)}
          </div>
        </section>
        <section class="mini-v2-detail-group">
          <div class="mini-v2-detail-group-title">Miniature</div>
          <div class="mini-v2-product-grid">
            <div class="mini-v2-edit-field mini-v2-set-field">
              <div class="mini-v2-editor-set-labels"><label class="mini-v2-field-label" for="miniV2EditSet">Set</label><label class="mini-v2-field-label" for="miniV2EditSetNumber">#</label></div>
              <div class="mini-v2-editor-set"><select id="miniV2EditSet" data-edit-field="set" title="Set name">${renderEditOptions("set", state.sets)}</select>
                <input id="miniV2EditSetNumber" data-edit-field="setNumber" aria-label="Set number" maxlength="3" value="${escapeHtml(fields.setNumber)}"></div>
            </div>
            ${renderEditSelect("paint", "Paint", PAINT_OPTIONS)}
          </div>
        </section>
        <section class="mini-v2-detail-group mini-v2-inventory-block">
          <div class="mini-v2-detail-group-title">Inventory</div>
          ${renderCopyGrid(group)}
          <p class="mini-v2-editor-home-note" hidden>Changing Home does not move copies. Current locations stay as shown.</p>
          <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row mini-v2-copy-edit-actions">
            <div class="mini-v2-copy-add-actions">
              <button class="button mini-v2-copy-btn mini-v2-secondary" type="button" data-action="add-copy">+ Add new copy</button>
              <button class="button mini-v2-copy-btn mini-v2-secondary mini-v2-next-sticker" type="button" data-action="apply-next-sticker" disabled>Apply next ID</button>
            </div>
            <button class="button mini-v2-copy-btn mini-v2-secondary" type="button" data-action="edit-all-home">Set All Home</button>
          </div>
        </section>
        <section class="mini-v2-detail-group">
          <label class="mini-v2-edit-field"><span class="mini-v2-note-label">Notes</span>
            <textarea data-edit-field="notes" aria-label="Group notes" rows="3">${escapeHtml(fields.notes)}</textarea></label>
        </section>
        <div class="mini-v2-editor-footer">
          <p id="miniV2EditorError" class="mini-v2-editor-error" role="alert" hidden></p>
          <div class="mini-v2-editor-save-row">
            ${state.editor.isNew ? '<span class="mini-v2-editor-save-note">Creates this group and its copies</span>' : '<button class="mini-v2-delete-link" type="button" data-action="delete-group">Delete group</button>'}
            <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
              <button class="button mini-v2-copy-btn mini-v2-primary" type="button" data-action="save-edit" title="Apply the shown group and copies in this browser until reload; no spreadsheet changes"${state.editor.isNew ? " disabled" : ""}>${state.editor.isNew ? "Create Group" : "Save Changes"}</button>
            </div>
          </div>
          ${state.editor.isNew ? "" : `<div class="mini-v2-delete-confirm" hidden role="group" aria-label="Confirm group deletion">
            <p>Delete <strong>${escapeHtml(group.name)}</strong> and all ${group.total} ${group.total === 1 ? "copy" : "copies"}?</p>
            <div class="mini-v2-inventory-actions mini-v2-inventory-actions-row">
              <button class="button mini-v2-copy-btn" type="button" data-action="cancel-delete-group">Cancel</button>
              <button class="button mini-v2-copy-btn mini-v2-delete-button" type="button" data-action="confirm-delete-group">Delete Group</button>
            </div>
          </div>`}
        </div>
      </div>`;
    }

    function editorCopy(copy) {
      const draft = state.editor.copies[copy.id];
      const group = getSelectedGroup();
      const usesDraftHome = state.editor.addedCopies.includes(copy) || state.editor.fields.home !== group.home;
      return { ...copy, ...draft, home: usesDraftHome ? state.editor.fields.home : copy.home };
    }

    function syncEditorFeedback() {
      if (!state.editor) return;
      const changed = editorHasChanges();
      detailContentNode.querySelector('[data-edit-field="set"]').title = state.editor.fields.set || "Set not specified";
      const setNumber = detailContentNode.querySelector('[data-edit-field="setNumber"]');
      setNumber.disabled = !hasNamedSet(state.editor.fields);
      setNumber.value = setNumber.disabled ? "" : state.editor.fields.setNumber;
      setNumber.title = setNumber.disabled ? "Set # does not apply without a named set" : "Set number, such as 40 or 4a";
      detailHeaderTagsNode.innerHTML = renderDetailTag(state.editor.isNew ? "New" : changed || state.editor.hasPendingLocations ? "Editing *" : "Editing", "is-neutral");
      const save = detailContentNode.querySelector('[data-action="save-edit"]');
      if (save) {
        const validationError = state.editor.isNew ? getEditorValidationError() : null;
        save.disabled = state.editor.isNew ? !!validationError : !changed && !state.editor.hasPendingLocations;
        save.title = validationError ? validationError.message : "Apply the shown group and copies in this browser until reload; no spreadsheet changes";
      }
      renderSummaryLane();
      const group = getSelectedGroup();
      const copies = retainedEditorCopies(group);
      detailContentNode.querySelector('[data-copy-scope]').textContent = `Shared by all ${copies.length} ${copies.length === 1 ? "copy" : "copies"}`;
      const matchNote = detailContentNode.querySelector('.mini-v2-new-match');
      if (matchNote) {
        const match = state.groups.find(item => item.name.trim().toLowerCase() === state.editor.fields.name.trim().toLowerCase());
        matchNote.hidden = !match;
        matchNote.textContent = match ? `A group named "${match.name}" already exists. To add copies to it, open that group and choose Edit.` : "";
      }
      detailContentNode.querySelector('.mini-v2-availability-wrap').outerHTML = renderInventoryAvailability(group);
      const homeNote = detailContentNode.querySelector(".mini-v2-editor-home-note");
      if (homeNote) homeNote.hidden = state.editor.isNew || state.editor.fields.home === group.home;
      const allHome = detailContentNode.querySelector('[data-action="edit-all-home"]');
      if (allHome) allHome.disabled = !state.editor.fields.home || !copies.some(copy => {
        const draft = editorCopy(copy);
        return draft.currentLocation !== draft.home;
      });
      detailContentNode.querySelectorAll("[data-detail-copy-id]").forEach(row => {
        const copy = editorBaseCopies(group).find(copy => copy.id === row.dataset.detailCopyId);
        if (state.editor.removedCopyIds.includes(copy.id)) return;
        const draft = editorCopy(copy);
        const away = draft.currentLocation !== draft.home;
        const dirty = state.editor.addedCopies.includes(copy) || draft.currentLocation !== copy.currentLocation
          || draft.note !== (copy.note || "") || draft.sticker !== (copy.sticker || "");
        row.classList.toggle("is-away", away);
        row.classList.toggle("is-dirty", dirty);
        const badge = row.querySelector(".mini-v2-copy-status");
        badge.className = `mini-v2-copy-status ${dirty ? "is-dirty" : away ? "is-away" : "is-home"}`;
        badge.textContent = state.editor.addedCopies.includes(copy) ? "New" : dirty ? "Unsaved" : away ? "Away" : "Home";
      });
      syncNextStickerAction();
    }

    function clearEditorError() {
      const error = document.getElementById("miniV2EditorError");
      if (error) error.hidden = true;
      root.querySelectorAll('[aria-describedby="miniV2EditorError"]').forEach(node => {
        node.removeAttribute("aria-invalid");
        node.removeAttribute("aria-describedby");
      });
    }

    function showEditorError(message, target) {
      const error = document.getElementById("miniV2EditorError");
      error.textContent = message;
      error.hidden = false;
      if (target) {
        if (target.matches("input, select, textarea")) target.setAttribute("aria-invalid", "true");
        target.setAttribute("aria-describedby", "miniV2EditorError");
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
    }

    function updateEditorInput(target) {
      if (!state.editor) return false;
      const field = target.dataset.editField;
      const copyId = target.dataset.editCopyNote;
      const stickerCopyId = target.dataset.editCopySticker;
      if (field && EDIT_FIELDS.includes(field)) {
        state.editor.fields[field] = target.value;
        if (field === "home") {
          retainedEditorCopies().forEach(copy => {
            if (state.editor.copies[copy.id].followsHome) state.editor.copies[copy.id].currentLocation = state.editor.fields.home;
            const draft = editorCopy(copy);
            const select = Array.from(detailContentNode.querySelectorAll("select[data-copy-id]"))
              .find(node => node.dataset.copyId === copy.id);
            select.innerHTML = renderCopyLocationOptions(draft, draft.currentLocation);
          });
        }
      } else if (copyId && state.editor.copies[copyId]) {
        state.editor.copies[copyId].note = target.value;
      } else if (stickerCopyId && state.editor.copies[stickerCopyId]) {
        state.editor.copies[stickerCopyId].sticker = target.value;
        target.title = target.value || "Sticker not assigned";
        const index = sequentialStickerIndex(target.value);
        if (index !== null) recordStickerCursor(stickerCopyId, index + 1);
      } else return false;
      clearEditorError();
      syncEditorFeedback();
      return true;
    }

    function getEditorValidationError() {
      const editor = state.editor;
      if (!editor.fields.name.trim()) {
        return { message: "Enter a miniature name before saving.", selector: "#miniV2EditName" };
      }
      if (editor.isNew && !editor.fields.home.trim()) {
        return { message: "Choose a Home before creating this group.", selector: "#miniV2EditHome" };
      }
      const initial = JSON.parse(editor.initial);
      if ((editor.fields.paint || initial.fields.paint) && !PAINT_OPTIONS.includes(editor.fields.paint)) {
        return { message: "Choose Paint: Painted, Unpainted, or Work in Progress.", selector: '[data-edit-field="paint"]' };
      }
      if (editor.isNew) {
        for (const [key, label] of Object.entries(EDIT_REQUIRED_CHOICES)) {
          if (!editor.fields[key].trim()) {
            return { message: key === "paint" ? "Choose Paint: Painted, Unpainted, or Work in Progress."
              : `Choose ${label} before creating this group. Not specified is an explicit choice.`,
              selector: `[data-edit-field="${key}"]` };
          }
        }
        if (hasNamedSet(editor.fields) && !editor.fields.setNumber.trim()) {
          return { message: "Enter Set # for the selected set before creating this group.", selector: "#miniV2EditSetNumber" };
        }
      }
      const copies = retainedEditorCopies();
      if (!copies.length) {
        return { message: "Add at least one copy before saving.", selector: '[data-action="add-copy"]' };
      }
      const setNumber = editor.fields.setNumber.trim();
      if (hasNamedSet(editor.fields) && setNumber !== initial.fields.setNumber && !/^(?:\d[a-z\d]{0,2})?$/i.test(setNumber)) {
        return { message: "Use up to three characters for Set #, starting with a digit (for example, 40 or 4a).", selector: "#miniV2EditSetNumber" };
      }
      const group = getSelectedGroup();
      const assignedStickers = reservedStickerIds(group.rootId);
      const stickerKey = value => String(value || "").trim().toUpperCase();
      const stickerChanged = copy => editor.addedCopies.includes(copy)
        || stickerKey(editorCopy(copy).sticker) !== stickerKey(copy.sticker);
      copies.filter(copy => !stickerChanged(copy)).forEach(copy => assignedStickers.add(stickerKey(copy.sticker)));
      for (const copy of copies) {
        if (editor.addedCopies.includes(copy) && !editorCopy(copy).currentLocation.trim()) {
          return { message: "Choose a current location for each new copy before saving.",
            selector: `select[data-copy-id="${copy.id}"]` };
        }
        const sticker = (editorCopy(copy).sticker || "").trim().toUpperCase();
        if (!sticker || sticker === "N/A" || !stickerChanged(copy)) continue;
        if (assignedStickers.has(sticker)) {
          return { message: `Sticker ${editorCopy(copy).sticker.trim()} is already assigned. Use a different sticker or leave it blank.`,
            selector: `[data-edit-copy-sticker="${copy.id}"]` };
        }
        assignedStickers.add(sticker);
      }
      return null;
    }

    function saveEditor() {
